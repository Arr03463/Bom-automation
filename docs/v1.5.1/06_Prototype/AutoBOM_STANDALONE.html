<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>AutoBOM — Platform (Standalone)</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
<style>
/* ============================================================
   AutoBOM — Design System (per Instruction Package v1.0)
   ============================================================ */
:root {
  /* Backgrounds */
  --bg-app: #0D1117;
  --bg-app-2: #161B22;        /* sidebar raised / hover */
  --bg-app-3: #1F2630;        /* sidebar active fill */
  --bg-surface: #FFFFFF;
  --bg-raised: #F8FAFC;
  --bg-overlay: #F1F5F9;
  /* Borders */
  --border: #CBD5E1;
  --border-soft: #E2E8F0;
  --border-focus: #2563EB;
  --border-dark: #2A323D;
  /* Text */
  --text-primary: #0D1117;
  --text-secondary: #475569;
  --text-muted: #64748B;
  --text-on-dark: #E6EDF3;
  --text-on-dark-dim: #8B949E;
  /* Action */
  --action: #2563EB;
  --action-hover: #1D4ED8;
  --action-soft: #EFF4FE;
  /* Semantic */
  --success: #16A34A;
  --success-soft: #ECFDF3;
  --warning: #D97706;
  --warning-soft: #FEF6EC;
  --danger: #DC2626;
  --danger-soft: #FEF2F2;
  --info: #0891B2;
  --info-soft: #ECFAFD;
  --darkred: #991B1B;
  /* Roles */
  --role-designer: #7C3AED;
  --role-production: #0891B2;
  --role-purchasing: #EA580C;
  --role-development: #059669;
  /* Suppliers */
  --supplier-mouser: #1A56DB;
  --supplier-digikey: #D91F1F;

  --sidebar-w: 248px;
  --rail-h: 56px;
  --bch: 40px;
  --radius: 6px;
  --radius-lg: 10px;
  --shadow-sm: 0 1px 2px rgba(13,17,23,.06), 0 1px 1px rgba(13,17,23,.04);
  --shadow-md: 0 4px 12px rgba(13,17,23,.10), 0 1px 3px rgba(13,17,23,.08);
  --shadow-lg: 0 12px 32px rgba(13,17,23,.18), 0 2px 8px rgba(13,17,23,.12);
  --font-sans: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  --font-mono: 'JetBrains Mono', ui-monospace, 'SF Mono', Menlo, monospace;
}

* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  font-family: var(--font-sans);
  font-size: 14px;
  line-height: 1.45;
  color: var(--text-primary);
  background: var(--bg-surface);
  min-height: 100vh;
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
}
#root { display: block; }
.mono { font-family: var(--font-mono); font-feature-settings: "tnum" 1; }
a { color: var(--action); text-decoration: none; }
a:hover { text-decoration: underline; }
button { font-family: inherit; }
::selection { background: #cfe0ff; }

/* ---------- App layout: sidebar is fixed chrome; the page is one native scroll ---------- */
.app { display: block; }

/* ---------- Sidebar (fixed, never scrolls with the page) ---------- */
.sidebar { position: fixed; top: 0; left: 0; bottom: 0; width: var(--sidebar-w); z-index: 60; background: var(--bg-app); color: var(--text-on-dark); display: flex; flex-direction: column; border-right: 1px solid #000; }
.sb-brand { display: flex; align-items: center; gap: 10px; padding: 16px 18px 14px; }
.sb-logo { width: 28px; height: 28px; border-radius: 7px; background: linear-gradient(135deg,#2563EB,#7C3AED); display: grid; place-items: center; color: #fff; font-weight: 800; font-size: 15px; flex: none; }
.sb-brandname { font-weight: 700; font-size: 15.5px; letter-spacing: -.2px; color: #fff; }
.sb-brandsub { font-size: 11px; color: var(--text-on-dark-dim); margin-top: 1px; }

.role-switcher { margin: 4px 12px 8px; }
.proto-tag { display: flex; align-items: center; gap: 5px; font-size: 9.5px; font-weight: 700; letter-spacing: .05em; text-transform: uppercase; color: #7c8794; margin: 0 2px 6px; }
.role-switcher .role-chip { border-style: dashed; }
.role-chip { width: 100%; display: flex; align-items: center; gap: 9px; padding: 8px 10px; background: var(--bg-app-2); border: 1px solid var(--border-dark); border-radius: 8px; cursor: pointer; color: var(--text-on-dark); text-align: left; }
.role-chip:hover { background: var(--bg-app-3); }
.role-dot { width: 9px; height: 9px; border-radius: 50%; flex: none; }
.role-chip .rc-label { font-size: 11px; color: var(--text-on-dark-dim); line-height: 1.1; }
.role-chip .rc-role { font-size: 13px; font-weight: 600; color: #fff; line-height: 1.2; }
.role-menu { position: absolute; z-index: 60; margin: 6px 12px 0; left: 0; right: 0; background: var(--bg-app-2); border: 1px solid var(--border-dark); border-radius: 8px; box-shadow: var(--shadow-lg); overflow: hidden; }
.role-menu button { width: 100%; display: flex; align-items: center; gap: 9px; padding: 9px 12px; background: none; border: 0; color: var(--text-on-dark); cursor: pointer; font-size: 13px; }
.role-menu button:hover { background: var(--bg-app-3); }

.sb-nav { padding: 6px 10px; overflow-y: auto; flex: 1; }
.sb-section-label { font-size: 10.5px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: #586069; padding: 14px 10px 6px; }
.nav-item { display: flex; align-items: center; gap: 11px; padding: 8px 10px; border-radius: 7px; color: var(--text-on-dark-dim); cursor: pointer; font-size: 13.5px; font-weight: 500; position: relative; user-select: none; }
.nav-item:hover { background: var(--bg-app-2); color: var(--text-on-dark); text-decoration: none; }
.nav-item.active { background: var(--bg-app-3); color: #fff; }
.nav-item.active::before { content:""; position:absolute; left:-10px; top:7px; bottom:7px; width:3px; border-radius:0 3px 3px 0; background: var(--accent, var(--action)); }
.nav-item .ni-icon { flex: none; opacity: .9; }
.nav-item .ni-count { margin-left: auto; font-size: 11px; font-weight: 700; background: var(--action); color: #fff; min-width: 18px; height: 18px; padding: 0 5px; border-radius: 9px; display: grid; place-items: center; }
.nav-item .ni-count.amber { background: var(--warning); }
.nav-item.disabled { color: #4b525c; cursor: default; }
.nav-item.disabled:hover { background: none; color: #4b525c; }
.nav-item .ni-soon { margin-left: auto; font-size: 9.5px; font-weight: 700; letter-spacing: .04em; color: #586069; border: 1px solid var(--border-dark); border-radius: 4px; padding: 1px 5px; text-transform: uppercase; }
.nav-pulse { margin-left: auto; width: 8px; height: 8px; border-radius: 50%; background: var(--info); box-shadow: 0 0 0 0 rgba(8,145,178,.6); animation: pulse 1.8s infinite; }
@keyframes pulse { 0%{box-shadow:0 0 0 0 rgba(8,145,178,.55);} 70%{box-shadow:0 0 0 7px rgba(8,145,178,0);} 100%{box-shadow:0 0 0 0 rgba(8,145,178,0);} }

.sb-user { border-top: 1px solid var(--border-dark); padding: 10px 12px; display: flex; align-items: center; gap: 10px; cursor: pointer; }
.sb-user:hover { background: var(--bg-app-2); }
.avatar { width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center; color: #fff; font-weight: 700; font-size: 12px; flex: none; }
.sb-user .su-name { font-size: 13px; font-weight: 600; color: #fff; line-height: 1.15; }
.sb-user .su-role { font-size: 11px; color: var(--text-on-dark-dim); }

/* ---------- Main column (offset past the fixed sidebar; flows in the page scroll) ---------- */
.main { margin-left: var(--sidebar-w); min-width: 0; min-height: 100vh; display: flex; flex-direction: column; background: var(--bg-surface); }
.toprail { position: sticky; top: 0; z-index: 50; height: var(--rail-h); border-bottom: 1px solid var(--border); display: flex; align-items: center; gap: 14px; padding: 0 22px; flex: none; background: var(--bg-surface); }

/* breadcrumb bar — sticky directly under the top rail */
.breadcrumbs { position: sticky; top: var(--rail-h); z-index: 40; height: var(--bch); display: flex; align-items: center; gap: 7px; padding: 0 22px; background: var(--bg-raised); border-bottom: 1px solid var(--border-soft); font-size: 12.5px; overflow-x: auto; white-space: nowrap; }
.breadcrumbs .bc-sep { color: var(--border); flex: none; }
.bc-link { background: none; border: 0; padding: 2px 4px; border-radius: 5px; color: var(--text-muted); font: inherit; cursor: pointer; flex: none; }
.bc-link:hover { color: var(--action); background: var(--action-soft); }
.bc-current { color: var(--text-primary); font-weight: 600; padding: 2px 4px; flex: none; }

/* related-object links on detail views */
.related { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; padding: 10px 0 2px; }
.related-label { display: inline-flex; align-items: center; gap: 5px; font-size: 11px; font-weight: 700; letter-spacing: .04em; text-transform: uppercase; color: var(--text-muted); }
.related-chip { display: inline-flex; align-items: center; gap: 7px; height: 28px; padding: 0 11px; border: 1px solid var(--border); border-radius: 7px; background: var(--bg-surface); cursor: pointer; font: inherit; }
.related-chip:hover { border-color: var(--action); background: var(--action-soft); }
.related-chip .related-kind { font-size: 11px; font-weight: 700; letter-spacing: .03em; text-transform: uppercase; color: var(--text-muted); }
.related-chip .related-val { font-size: 13px; font-weight: 600; color: var(--text-primary); }

/* Role-switch context banner — fired when a notif click auto-switched roles */
.role-switch-banner { position: sticky; top: calc(var(--rail-h) + var(--bc-h, 40px)); z-index: 9;
  display: flex; align-items: center; gap: 9px; padding: 9px 22px; background: var(--info-soft);
  border-bottom: 1px solid #b6e6f0; color: #0a6c84; font-size: 13px; font-weight: 500; }
.role-switch-banner svg { flex: none; }
.role-switch-banner .btn-link { color: var(--info); font-weight: 600; }

/* ---------- Global Search Overlay ---------- */
.search-scrim { position: fixed; inset: 0; z-index: 110; background: transparent; cursor: default; }
.search-overlay { z-index: 120; background: var(--bg-surface); border: 1px solid var(--border); border-radius: 12px; box-shadow: 0 24px 64px rgba(13,17,23,.22), 0 4px 12px rgba(13,17,23,.10); display: flex; flex-direction: column; max-height: 72vh; animation: searchin .15s cubic-bezier(.2,.7,.3,1); overflow: hidden; }
@keyframes searchin { from { opacity: 0; transform: translateY(-6px); } }
.search-overlay.palette { animation: paletteIn .16s cubic-bezier(.2,.7,.3,1); }
@keyframes paletteIn { from { opacity: 0; transform: translate(-50%, -6px) scale(.98); } }
.search-input-wrap { display: flex; align-items: center; gap: 10px; padding: 12px 14px; border-bottom: 1px solid var(--border-soft); }
.search-input-wrap input { flex: 1; border: 0; outline: 0; font: inherit; font-size: 15px; background: none; color: var(--text-primary); }
.search-input-wrap input::placeholder { color: var(--text-muted); }
.kbd-esc { font-size: 10.5px; font-family: var(--font-mono); background: var(--bg-overlay); border: 1px solid var(--border); border-radius: 4px; padding: 2px 6px; color: var(--text-muted); }
.search-body { overflow-y: auto; flex: 1; padding: 6px 6px 8px; }
.search-group { padding: 4px 4px 6px; }
.search-group-head { display: flex; align-items: center; gap: 6px; padding: 9px 10px 6px; font-size: 10.5px; font-weight: 700; letter-spacing: .05em; text-transform: uppercase; color: var(--text-muted); }
.search-group-head .caption { margin-left: auto; }
.search-row { display: flex; align-items: center; gap: 10px; padding: 9px 10px; border-radius: 7px; cursor: pointer; }
.search-row.active, .search-row:hover { background: var(--action-soft); }
.search-row.active .search-actions { opacity: 1; }
.search-actions { display: flex; gap: 6px; opacity: 0; transition: opacity .12s; flex: none; }
.search-row:hover .search-actions { opacity: 1; }
.search-empty { padding: 24px 16px 22px; text-align: center; color: var(--text-secondary); }
.search-footer { display: flex; align-items: center; gap: 14px; padding: 9px 14px; border-top: 1px solid var(--border-soft); background: var(--bg-raised); font-size: 11.5px; color: var(--text-muted); }
.search-footer kbd { font-family: var(--font-mono); background: var(--bg-surface); border: 1px solid var(--border); border-radius: 4px; padding: 1px 5px; font-size: 10.5px; margin-right: 3px; color: var(--text-secondary); }
.add-popover { position: absolute; right: 14px; bottom: 60px; z-index: 130; min-width: 280px; background: var(--bg-surface); border: 1px solid var(--border); border-radius: 10px; box-shadow: var(--shadow-lg); padding: 5px; }

/* ---------- Task Center timeline + row tweaks ---------- */
.timeline { list-style: none; padding: 0; margin: 0; }
.timeline li { display: flex; gap: 12px; padding: 6px 0 14px; position: relative; }
.timeline li:not(:last-child)::after { content: ''; position: absolute; left: 5px; top: 18px; bottom: 0; width: 1px; background: var(--border); }
.timeline .tl-dot { width: 11px; height: 11px; border-radius: 50%; background: var(--action); margin-top: 4px; flex: none; z-index: 1; box-shadow: 0 0 0 3px var(--bg-surface); }
.timeline li > div { min-width: 0; flex: 1; }
.nav-task-center .ni-count { font-weight: 700; }
.nav-attention .ni-count { font-weight: 700; }

/* ---------- Needs Attention (v1.3-rev — Dashboard is the inbox) ---------- */
.na-panel .na-list { display: flex; flex-direction: column; }
.na-clear { display: flex; flex-direction: column; align-items: center; text-align: center; padding: 34px 16px 38px; }
.na-clear-badge { width: 52px; height: 52px; border-radius: 50%; background: var(--success-soft, rgba(31,138,91,.12)); color: var(--success); display: grid; place-items: center; }
.na-card { border-bottom: 1px solid var(--border-soft); transition: background .12s; }
.na-card:last-child { border-bottom: 0; }
.na-card.open { background: var(--bg-raised); }
.na-card.overdue { box-shadow: inset 3px 0 0 var(--warning); }
.na-row { display: flex; align-items: flex-start; gap: 13px; padding: 14px 16px; }
.na-icon { width: 38px; height: 38px; border-radius: 9px; display: grid; place-items: center; flex: none; }
.na-main { flex: 1; min-width: 0; }
.na-type { font-size: 10.5px; font-weight: 700; letter-spacing: .05em; text-transform: uppercase; }
.na-title { display: flex; align-items: center; gap: 8px; margin-top: 3px; flex-wrap: wrap; }
.na-titlelink { border: 0; background: none; padding: 0; font: inherit; font-weight: 600; font-size: 14.5px; color: var(--text-primary); cursor: pointer; text-align: left; }
.na-titlelink:hover { color: var(--action); text-decoration: underline; }
.na-badge { color: var(--text-muted); }
.na-meta { font-size: 12.5px; color: var(--text-secondary); margin-top: 3px; }
.na-actions { flex: none; display: flex; align-items: center; gap: 8px; padding-top: 2px; }
.na-working, .na-done { display: inline-flex; align-items: center; gap: 6px; font-size: 12.5px; font-weight: 600; color: var(--text-secondary); }
.na-expand { padding: 0 16px 16px 67px; animation: naExpand .16s ease; }
@keyframes naExpand { from { opacity: 0; transform: translateY(-4px); } }
.na-exp-body { border: 1px solid var(--border); border-radius: 10px; padding: 14px; background: var(--bg-surface); }
.na-confirm { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.na-phase { display: flex; align-items: center; gap: 9px; font-size: 13px; font-weight: 600; color: var(--text-secondary); }
.na-quote { display: flex; gap: 8px; padding: 10px 12px; background: var(--danger-soft); border-radius: 8px; font-size: 13px; color: var(--text-primary); }
.na-exline { border: 1px solid var(--border-soft); border-radius: 9px; padding: 11px; margin-bottom: 9px; }
.na-exline-head { display: flex; align-items: center; gap: 7px; margin-bottom: 8px; font-size: 13px; }
/* amber flash when a notification routes the user to this card */
.na-flash { animation: naFlash 2.2s ease; }
@keyframes naFlash {
  0% { background: var(--warning-soft); box-shadow: inset 3px 0 0 var(--warning); }
  70% { background: var(--warning-soft); box-shadow: inset 3px 0 0 var(--warning); }
  100% { background: transparent; box-shadow: none; }
}

/* ---------- Comments (CommentThread) ---------- */
.comments { display: block; }
.comments-head { display: flex; align-items: center; gap: 9px; padding: 0 0 10px; }
.comments-empty { text-align: center; padding: 22px 18px; border: 1px dashed var(--border); border-radius: 9px; background: var(--bg-raised); color: var(--text-secondary); }
.comment-list { list-style: none; padding: 0; margin: 0 0 14px; display: flex; flex-direction: column; gap: 10px; }
.comment-item { display: grid; grid-template-columns: 40px 1fr; gap: 10px; padding: 11px 13px 11px 11px; border: 1px solid var(--border-soft); border-radius: 9px; background: var(--bg-surface); }
.comment-rail { display: flex; flex-direction: column; align-items: center; padding-top: 1px; }
.comment-meta { display: flex; align-items: center; gap: 8px; font-size: 13px; }
.comment-text { margin-top: 6px; font-size: 13.5px; line-height: 1.5; white-space: pre-wrap; color: var(--text-primary); }
.comment-composer { display: grid; grid-template-columns: 40px 1fr; gap: 10px; align-items: flex-start; padding: 12px; border: 1px solid var(--border); border-radius: 10px; background: var(--bg-raised); }
.comment-composer .textarea { background: var(--bg-surface); }
.comment-composer-row { display: flex; align-items: center; gap: 10px; margin-top: 6px; }
.comment-composer-row .caption { flex: 1; }

/* ---------- Add Part drawer result list ---------- */
.add-result-list { list-style: none; padding: 0; margin: 12px 0 0; display: flex; flex-direction: column; gap: 6px; }
.add-result { display: flex; align-items: center; gap: 10px; padding: 9px 12px; border: 1px solid var(--border-soft); border-radius: 8px; background: var(--bg-surface); cursor: pointer; }
.add-result:hover { background: var(--action-soft); border-color: var(--action); }

/* ---------- Inline-editable title + description ---------- */
.inline-edit-title { font: inherit; font-size: 22px; font-weight: 700; letter-spacing: -.3px; border: 0; outline: 0; background: none; color: var(--text-primary); width: 100%; padding: 1px 3px; border-radius: 5px; margin: -1px -3px; }
.inline-edit-title:hover { background: var(--bg-overlay); }
.inline-edit-title:focus { background: var(--bg-surface); box-shadow: inset 0 0 0 2px var(--action); }
.inline-edit-desc { font: inherit; font-size: 13.5px; border: 0; outline: 0; background: none; color: var(--text-secondary); width: 100%; padding: 4px 6px; border-radius: 5px; margin: -4px -6px; resize: vertical; min-height: 22px; }
.inline-edit-desc:hover { background: var(--bg-overlay); }
.inline-edit-desc:focus { background: var(--bg-surface); box-shadow: inset 0 0 0 2px var(--action); color: var(--text-primary); }

/* ---------- Multi-supplier checklist ---------- */
.supplier-checklist { display: flex; flex-direction: column; gap: 12px; }
.supplier-card { border: 1px solid var(--border); border-radius: 10px; background: var(--bg-surface); overflow: hidden; }
.supplier-card.complete { border-color: var(--success); }
.supplier-card.in-progress { border-color: var(--action); }
.supplier-head { display: grid; grid-template-columns: auto 1fr auto auto; gap: 14px; align-items: center; padding: 14px 16px; cursor: pointer; }
.supplier-head:hover { background: var(--bg-raised); }
.supplier-head .check-box { width: 22px; height: 22px; border-radius: 6px; border: 2px solid var(--border); display: grid; place-items: center; color: #fff; flex: none; }
.supplier-head .check-box.done { background: var(--success); border-color: var(--success); }
.supplier-head .check-box.in-progress { background: var(--action); border-color: var(--action); }
.supplier-meta { display: flex; flex-direction: column; gap: 3px; min-width: 0; }
.supplier-name { display: flex; align-items: center; gap: 9px; font-weight: 700; font-size: 15px; }
.supplier-stats { display: flex; gap: 14px; font-size: 12.5px; color: var(--text-secondary); }
.supplier-body { padding: 0 16px 16px; border-top: 1px solid var(--border-soft); background: var(--bg-raised); }
.supplier-step { display: grid; grid-template-columns: 28px 1fr auto; gap: 12px; padding: 12px 0; align-items: center; border-bottom: 1px dashed var(--border-soft); }
.supplier-step:last-child { border-bottom: 0; }
.supplier-step .step-num { width: 24px; height: 24px; border-radius: 50%; background: var(--bg-overlay); border: 1px solid var(--border); color: var(--text-muted); display: grid; place-items: center; font-size: 11.5px; font-weight: 700; }
.supplier-step.done .step-num { background: var(--success); border-color: var(--success); color: #fff; }
.supplier-step.active .step-num { background: var(--action); border-color: var(--action); color: #fff; }
.supplier-step .step-title { font-weight: 600; font-size: 13.5px; }
.supplier-step .step-sub { font-size: 12.5px; color: var(--text-muted); margin-top: 1px; }

/* Parent/child order rows */
.po-parent-row { background: var(--bg-raised); font-weight: 600; }
.po-child-row td:first-child { padding-left: 36px; position: relative; }
.po-child-row td:first-child::before { content: ''; position: absolute; left: 18px; top: 0; bottom: 50%; border-left: 2px solid var(--border); border-bottom: 2px solid var(--border); width: 14px; border-bottom-left-radius: 6px; }

/* ---------- Inline Part Verify ---------- */
.ipv { width: 100%; }
.ipv-fields { display: grid; grid-template-columns: 1fr 1.4fr auto; gap: 8px; align-items: flex-end; }
.ipv-fields.compact { grid-template-columns: 1fr 1.4fr auto; }
.ipv-field { display: flex; flex-direction: column; gap: 4px; }
.ipv-label { font-size: 11px; font-weight: 700; letter-spacing: .04em; text-transform: uppercase; color: var(--text-muted); }
.ipv-card { margin-top: 9px; border-radius: 9px; border: 1px solid var(--border); background: var(--bg-raised); padding: 11px 13px; animation: ipvIn .14s ease; }
@keyframes ipvIn { from { opacity: 0; transform: translateY(-3px); } }
.ipv-card.ipv-loading { background: var(--bg-overlay); }
.ipv-card.ipv-result { background: var(--bg-surface); border-color: var(--success); box-shadow: 0 0 0 3px rgba(22,163,74,.06); }
.ipv-card.ipv-result.eol { border-color: var(--danger); box-shadow: 0 0 0 3px rgba(220,38,38,.05); }
.ipv-card.ipv-empty { background: var(--danger-soft); border-color: #f3c2c2; }
.ipv-card.ipv-warn { background: var(--warning-soft); border-color: #f3d9a8; }

.ipv-phase { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--text-muted); padding: 3px 0; }
.ipv-phase.active { color: var(--info); font-weight: 600; }
.ipv-phase.done { color: var(--text-secondary); }

.ipv-result-head { display: flex; align-items: center; gap: 9px; flex-wrap: wrap; }
.ipv-mpn { flex: 1; min-width: 0; font-size: 14px; }
.ipv-suppliers { display: flex; flex-direction: column; gap: 6px; margin-top: 10px; }
.ipv-sup { display: flex; align-items: center; gap: 12px; padding: 7px 10px; border-radius: 7px; background: var(--bg-overlay); font-size: 13px; }
.ipv-sup.rec { background: var(--action-soft); }
.ipv-sup.ipv-sup-unavail { background: var(--bg-overlay); color: var(--text-muted); }
.ipv-stock { min-width: 130px; }
.ipv-price { min-width: 70px; font-weight: 600; }
.ipv-pn { flex: 1; text-align: right; }
.ipv-rec-flag { font-size: 10px; font-weight: 800; letter-spacing: .04em; text-transform: uppercase; color: var(--action); background: #fff; padding: 2px 7px; border-radius: 5px; }
.ipv-recommended { font-size: 12.5px; color: var(--text-secondary); margin-top: 9px; display: flex; align-items: center; gap: 7px; }
.ipv-empty-head { display: flex; align-items: center; gap: 8px; font-size: 13px; font-weight: 600; color: var(--text-primary); }
.ipv-actions { display: flex; gap: 8px; margin-top: 10px; flex-wrap: wrap; }
.crumbs { display: flex; align-items: center; gap: 7px; font-size: 13px; color: var(--text-muted); min-width: 0; }
.crumbs .c-sep { color: var(--border); }
.crumbs .c-current { color: var(--text-secondary); font-weight: 600; }
.rail-search { margin-left: 6px; flex: 1; max-width: 440px; }
.rail-search .rs-box { display: flex; align-items: center; gap: 9px; height: 34px; padding: 0 11px; background: var(--bg-raised); border: 1px solid var(--border); border-radius: 7px; color: var(--text-muted); cursor: text; }
.rail-search .rs-box:hover { border-color: #aebbcb; }
.rail-search .rs-box .kbd { margin-left: auto; font-size: 11px; font-family: var(--font-mono); background: var(--bg-surface); border: 1px solid var(--border); border-radius: 4px; padding: 1px 5px; color: var(--text-muted); }
.rail-actions { margin-left: auto; display: flex; align-items: center; gap: 6px; }
.icon-btn { width: 36px; height: 36px; border-radius: 8px; border: 1px solid transparent; background: none; display: grid; place-items: center; cursor: pointer; color: var(--text-secondary); position: relative; }
.icon-btn:hover { background: var(--bg-overlay); color: var(--text-primary); }
.bell-badge { position: absolute; top: 5px; right: 5px; min-width: 16px; height: 16px; padding: 0 4px; border-radius: 8px; background: var(--danger); color: #fff; font-size: 10px; font-weight: 700; display: grid; place-items: center; border: 2px solid var(--bg-surface); }

.content { background: var(--bg-surface); }
.page { max-width: 1240px; margin: 0 auto; padding: 26px 30px 64px; }
.page-wide { max-width: 1400px; }

/* ---------- Typography helpers ---------- */
.display { font-size: 28px; font-weight: 700; letter-spacing: -.5px; line-height: 1.15; }
.h1 { font-size: 22px; font-weight: 700; letter-spacing: -.3px; }
.h2 { font-size: 17px; font-weight: 600; letter-spacing: -.1px; }
.label { font-size: 13px; font-weight: 500; color: var(--text-secondary); }
.caption { font-size: 12px; color: var(--text-muted); }
.secondary { color: var(--text-secondary); }
.muted { color: var(--text-muted); }

/* ---------- Page header ---------- */
.page-head { display: flex; align-items: flex-start; gap: 16px; margin-bottom: 18px; }
.page-head .ph-titles { min-width: 0; }
.page-head .ph-sub { color: var(--text-muted); font-size: 13.5px; margin-top: 3px; }
.page-head .ph-actions { margin-left: auto; display: flex; gap: 9px; align-items: center; flex: none; }

/* ---------- Buttons ---------- */
.btn { display: inline-flex; align-items: center; gap: 7px; height: 34px; padding: 0 13px; border-radius: 7px; border: 1px solid var(--border); background: var(--bg-surface); color: var(--text-primary); font-size: 13px; font-weight: 600; cursor: pointer; white-space: nowrap; transition: background .12s, border-color .12s; }
.btn:hover { background: var(--bg-raised); border-color: #aebbcb; text-decoration: none; }
.btn.primary { background: var(--action); border-color: var(--action); color: #fff; }
.btn.primary:hover { background: var(--action-hover); border-color: var(--action-hover); }
.btn.danger { background: var(--danger); border-color: var(--danger); color: #fff; }
.btn.danger:hover { background: #b91c1c; border-color: #b91c1c; }
.btn.ghost { border-color: transparent; background: transparent; }
.btn.ghost:hover { background: var(--bg-overlay); }
.btn.sm { height: 28px; padding: 0 10px; font-size: 12.5px; }
.btn.lg { height: 40px; padding: 0 18px; font-size: 14px; }
.btn:disabled { opacity: .5; cursor: default; }
.btn-link { background: none; border: 0; color: var(--action); font-weight: 600; cursor: pointer; padding: 0; font-size: 13px; }
.btn-link:hover { text-decoration: underline; }

/* ---------- Cards / panels ---------- */
.card { background: var(--bg-surface); border: 1px solid var(--border); border-radius: var(--radius-lg); }
.panel { background: var(--bg-surface); border: 1px solid var(--border); border-radius: var(--radius-lg); overflow: hidden; }
.panel-head { display: flex; align-items: center; gap: 10px; padding: 13px 16px; background: var(--bg-overlay); border-bottom: 1px solid var(--border); }
.panel-head .ph-title { font-size: 13.5px; font-weight: 700; letter-spacing: -.1px; }
.panel-head .ph-meta { margin-left: auto; font-size: 12px; color: var(--text-muted); }
.panel-body { padding: 16px; }

/* ---------- Badges ---------- */
.badge { display: inline-flex; align-items: center; gap: 5px; height: 20px; padding: 0 8px; border-radius: 5px; font-size: 11px; font-weight: 700; letter-spacing: .03em; text-transform: uppercase; white-space: nowrap; line-height: 1; vertical-align: middle; }
.badge svg { width: 12px; height: 12px; flex: none; }
.badge.filled { color: #fff; }
.badge.outlined { background: var(--bg-surface); border: 1px solid currentColor; }
.badge .spin { animation: spin 1s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }

/* role + supplier tags */
.tag { display: inline-flex; align-items: center; gap: 5px; height: 19px; padding: 0 7px; border-radius: 5px; font-size: 11px; font-weight: 700; letter-spacing: .03em; text-transform: uppercase; white-space: nowrap; }
.role-tag { color: #fff; }
.dot { width: 7px; height: 7px; border-radius: 50%; flex: none; display: inline-block; }

/* ---------- Traceability strip ---------- */
.trace { display: flex; align-items: center; flex-wrap: wrap; gap: 9px 14px; padding: 9px 0 2px; font-size: 12.5px; color: var(--text-secondary); }
.trace .tr-name { font-weight: 600; color: var(--text-primary); }
.trace .tr-sep { width: 3px; height: 3px; border-radius: 50%; background: var(--border); display: inline-block; }
.trace .chip { display: inline-flex; align-items: center; gap: 5px; padding: 1px 8px; height: 21px; border: 1px solid var(--border); border-radius: 11px; background: var(--bg-raised); font-size: 12px; font-weight: 500; color: var(--text-secondary); cursor: pointer; }
.trace .chip:hover { border-color: #aebbcb; text-decoration: none; }
.trace .tr-id { font-family: var(--font-mono); font-size: 12px; color: var(--action); cursor: pointer; }
.trace .tr-id:hover { text-decoration: underline; }

/* ---------- Banners ---------- */
.banner { display: flex; align-items: flex-start; gap: 11px; padding: 12px 15px; border-radius: var(--radius-lg); border: 1px solid; margin: 14px 0; }
.banner svg { flex: none; margin-top: 1px; }
.banner .bn-title { font-weight: 700; font-size: 13.5px; }
.banner .bn-body { font-size: 13px; margin-top: 2px; }
.banner .bn-actions { margin-left: auto; display: flex; gap: 8px; align-items: center; flex: none; }
.banner.lock { background: var(--bg-overlay); border-color: var(--border); color: var(--text-secondary); }
.banner.lock .bn-title { color: var(--text-primary); }
.banner.warn { background: var(--warning-soft); border-color: #f3d9a8; color: #92590b; }
.banner.warn .bn-title { color: #7c4a08; }
.banner.danger { background: var(--danger-soft); border-color: #f3c2c2; color: #9b2222; }
.banner.danger .bn-title { color: #8a1c1c; }
.banner.info { background: var(--info-soft); border-color: #b6e6f0; color: #0a6c84; }

/* ---------- Tables ---------- */
.tbl-wrap { border: 1px solid var(--border); border-radius: var(--radius-lg); overflow: hidden; background: var(--bg-surface); }
table.bom { width: 100%; border-collapse: collapse; font-size: 13px; }
table.bom thead th { position: sticky; top: calc(var(--rail-h) + var(--bch) + var(--abh, 0px)); z-index: 15; background: var(--bg-overlay); text-align: left; font-size: 11.5px; font-weight: 700; letter-spacing: .03em; text-transform: uppercase; color: var(--text-secondary); padding: 9px 12px; border-bottom: 1px solid var(--border); white-space: nowrap; user-select: none; }
/* Flowing table: grows with content, header sticks to the PAGE scroll (no inner scrollbox). */
.tbl-wrap.flow { overflow: visible; }
.tbl-wrap.flow table.bom thead th { box-shadow: 0 1px 0 var(--border); }
.tbl-wrap.flow table.bom thead th:first-child { border-top-left-radius: var(--radius-lg); }
.tbl-wrap.flow table.bom thead th:last-child { border-top-right-radius: var(--radius-lg); }
/* Sticky action bar: any page header carrying actions pins below the top rail + breadcrumbs. */
.page:has(.page-head .ph-actions) { --abh: 86px; }
.page-head:has(.ph-actions) { position: sticky; top: calc(var(--rail-h) + var(--bch)); z-index: 30; background: var(--bg-surface); margin: 0 -30px 14px; padding: 13px 30px; border-bottom: 1px solid var(--border-soft); }
table.bom thead th.sortable { cursor: pointer; }
/* Inside modals/slideouts there is no page chrome — the header must stick to the container top,
   not the rail+breadcrumb+action-bar offset (which floated it into the middle of the table). */
.modal table.bom thead th, .slideout table.bom thead th, .modal-body table.bom thead th { top: 0; }
table.bom thead th.sortable:hover { color: var(--text-primary); }
table.bom thead th .th-inner { display: inline-flex; align-items: center; gap: 5px; }
table.bom tbody td { padding: 9px 12px; border-bottom: 1px solid var(--border-soft); vertical-align: middle; }
table.bom tbody tr:last-child td { border-bottom: 0; }
table.bom tbody tr.alt { background: var(--bg-raised); }
table.bom tbody tr:hover { background: var(--action-soft); }
table.bom tbody tr.exception { box-shadow: inset 3px 0 0 var(--danger); }
table.bom tbody tr.warn { box-shadow: inset 3px 0 0 var(--warning); }
table.bom tbody tr.unsaved { box-shadow: inset 3px 0 0 var(--action); }
table.bom tbody tr.selected { background: var(--action-soft); }
.num { text-align: right; font-variant-numeric: tabular-nums; }
.cell-edit { border: 1px solid var(--action); border-radius: 5px; padding: 4px 7px; font: inherit; width: 64px; }
.cell-editable { cursor: text; border-radius: 4px; padding: 2px 5px; margin: -2px -5px; }
.cell-editable:hover { background: #fff; box-shadow: inset 0 0 0 1px var(--border); }

/* filter bar */
.filterbar { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; padding: 11px 14px; border: 1px solid var(--border); border-bottom: 0; border-radius: var(--radius-lg) var(--radius-lg) 0 0; background: var(--bg-surface); }
.filterbar + .tbl-wrap { border-radius: 0 0 var(--radius-lg) var(--radius-lg); border-top: 0; }
.fchip { display: inline-flex; align-items: center; gap: 6px; height: 28px; padding: 0 10px; border-radius: 6px; border: 1px solid var(--border); background: var(--bg-surface); font-size: 12.5px; font-weight: 600; color: var(--text-secondary); cursor: pointer; }
.fchip:hover { background: var(--bg-raised); }
.fchip.active { background: var(--action-soft); border-color: var(--action); color: var(--action); }
.fchip .fc-n { font-weight: 700; }
.searchfield { display: flex; align-items: center; gap: 8px; height: 32px; padding: 0 10px; border: 1px solid var(--border); border-radius: 7px; background: var(--bg-surface); }
.searchfield input { border: 0; outline: 0; font: inherit; background: none; width: 100%; }
.searchfield:focus-within { border-color: var(--action); box-shadow: 0 0 0 3px var(--action-soft); }

/* ---------- Inputs ---------- */
.field { display: block; }
.field > .fl { display: block; font-size: 13px; font-weight: 500; color: var(--text-secondary); margin-bottom: 5px; }
.input, .textarea, .select { width: 100%; border: 1px solid var(--border); border-radius: 7px; padding: 8px 11px; font: inherit; background: var(--bg-surface); color: var(--text-primary); outline: 0; }
.input:focus, .textarea:focus, .select:focus { border-color: var(--action); box-shadow: 0 0 0 3px var(--action-soft); }
.textarea { resize: vertical; min-height: 72px; }

/* ---------- Stat tiles ---------- */
.stat-row { display: grid; grid-template-columns: repeat(4,1fr); gap: 12px; }
.stat { border: 1px solid var(--border); border-radius: var(--radius-lg); padding: 13px 15px; background: var(--bg-surface); }
.stat .st-label { font-size: 12px; color: var(--text-muted); display: flex; align-items: center; gap: 6px; }
.stat .st-num { font-size: 26px; font-weight: 700; letter-spacing: -.5px; margin-top: 4px; }
.stat .st-sub { font-size: 12px; color: var(--text-muted); margin-top: 1px; }

/* ---------- Needs attention items ---------- */
.attn-item { display: flex; align-items: center; gap: 13px; padding: 13px 16px; border-bottom: 1px solid var(--border-soft); }
.attn-item:last-child { border-bottom: 0; }
.attn-item:hover { background: var(--bg-raised); }
.attn-icon { width: 34px; height: 34px; border-radius: 8px; display: grid; place-items: center; flex: none; }
.attn-main { min-width: 0; flex: 1; }
.attn-main .am-type { font-size: 11px; font-weight: 700; letter-spacing: .04em; text-transform: uppercase; }
.attn-main .am-title { font-size: 14px; font-weight: 600; margin-top: 1px; }
.attn-main .am-meta { font-size: 12px; color: var(--text-muted); margin-top: 2px; }
.attn-item .am-action { margin-left: auto; flex: none; }

/* list rows (collections) */
.list { border: 1px solid var(--border); border-radius: var(--radius-lg); overflow: hidden; }
.lrow { display: grid; grid-template-columns: 1fr auto; gap: 12px; padding: 14px 18px; border-bottom: 1px solid var(--border-soft); cursor: pointer; align-items: center; }
.lrow:last-child { border-bottom: 0; }
.lrow:hover { background: var(--bg-raised); }
.lrow .lr-title { font-size: 15px; font-weight: 600; letter-spacing: -.1px; display: flex; align-items: center; gap: 9px; }
.lrow .lr-meta { font-size: 12.5px; color: var(--text-muted); margin-top: 4px; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.lrow .lr-right { display: flex; flex-direction: column; align-items: flex-end; gap: 7px; }
.lr-stats { display: flex; gap: 14px; font-size: 12.5px; color: var(--text-secondary); }
.lr-stats b { color: var(--text-primary); font-variant-numeric: tabular-nums; }

/* empty state */
.empty { text-align: center; padding: 56px 24px; }
.empty .em-icon { width: 52px; height: 52px; border-radius: 14px; background: var(--bg-overlay); display: grid; place-items: center; margin: 0 auto 16px; color: var(--text-muted); }
.empty .em-title { font-size: 17px; font-weight: 700; letter-spacing: -.2px; }
.empty .em-sub { color: var(--text-muted); margin-top: 6px; max-width: 380px; margin-left: auto; margin-right: auto; }
.empty .em-actions { margin-top: 18px; display: flex; gap: 10px; justify-content: center; }

/* supplier result grid */
.supplier-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px,1fr)); gap: 12px; }
.supcard { border: 1px solid var(--border); border-radius: var(--radius-lg); overflow: hidden; }
.supcard.recommended { border-color: var(--action); box-shadow: 0 0 0 3px var(--action-soft); }
.supcard-head { display: flex; align-items: center; gap: 8px; padding: 10px 13px; border-bottom: 1px solid var(--border-soft); }
.supcard-body { padding: 12px 13px; display: grid; gap: 7px; }
.sup-line { display: flex; justify-content: space-between; font-size: 13px; }
.sup-line .sl-k { color: var(--text-muted); }
.rec-flag { margin-left: auto; font-size: 10px; font-weight: 800; letter-spacing: .05em; text-transform: uppercase; color: var(--action); background: var(--action-soft); padding: 2px 7px; border-radius: 5px; }

/* ---------- Slide-out & modal ---------- */
.scrim { position: fixed; inset: 0; background: rgba(13,17,23,.42); z-index: 80; animation: fade .15s ease; }
@keyframes fade { from { opacity: 0; } }
.slideout { position: fixed; top: 0; right: 0; bottom: 0; width: 460px; max-width: 92vw; background: var(--bg-surface); z-index: 90; box-shadow: var(--shadow-lg); display: flex; flex-direction: column; animation: slidein .2s cubic-bezier(.2,.7,.3,1); }
@keyframes slidein { from { transform: translateX(100%); } }
.slideout-head { display: flex; align-items: center; gap: 10px; padding: 16px 20px; border-bottom: 1px solid var(--border); }
.slideout-body { padding: 18px 20px; overflow-y: auto; flex: 1; }
.slideout-foot { padding: 14px 20px; border-top: 1px solid var(--border); display: flex; gap: 10px; justify-content: flex-end; background: var(--bg-raised); }

.modal-wrap { position: fixed; inset: 0; z-index: 90; display: grid; place-items: center; padding: 24px; }
.modal { width: 480px; max-width: 100%; background: var(--bg-surface); border-radius: 12px; box-shadow: var(--shadow-lg); overflow: hidden; animation: pop .16s ease; }
@keyframes pop { from { transform: scale(.96); opacity: 0; } }
.modal-head { padding: 18px 20px 6px; }
.modal-head .mh-title { font-size: 17px; font-weight: 700; }
.modal-body { padding: 6px 20px 18px; color: var(--text-secondary); font-size: 13.5px; }
.modal-foot { padding: 14px 20px; background: var(--bg-raised); border-top: 1px solid var(--border); display: flex; justify-content: flex-end; gap: 10px; }

/* notification panel */
.notif-panel { position: fixed; top: 0; right: 0; bottom: 0; width: 400px; max-width: 92vw; background: var(--bg-surface); z-index: 90; box-shadow: var(--shadow-lg); display: flex; flex-direction: column; animation: slidein .2s cubic-bezier(.2,.7,.3,1); }
.notif-head { display: flex; align-items: center; gap: 10px; padding: 15px 18px; border-bottom: 1px solid var(--border); }
.notif-list { overflow-y: auto; flex: 1; }
.notif-group-label { font-size: 11px; font-weight: 700; letter-spacing: .05em; text-transform: uppercase; color: var(--text-muted); padding: 13px 18px 5px; background: var(--bg-raised); }
.notif { display: flex; gap: 11px; padding: 13px 18px; border-bottom: 1px solid var(--border-soft); }
.notif.unread { background: var(--action-soft); }
.notif .nf-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--action); margin-top: 6px; flex: none; }
.notif .nf-dot.read { background: transparent; }
.notif .nf-type { font-size: 11px; font-weight: 700; letter-spacing: .03em; text-transform: uppercase; }
.notif .nf-body { font-size: 13px; margin-top: 2px; }
.notif .nf-meta { font-size: 11.5px; color: var(--text-muted); margin-top: 3px; }
.notif .nf-reject { margin-top: 7px; background: var(--danger-soft); border: 1px solid #f3c2c2; border-radius: 6px; padding: 7px 9px; font-size: 12.5px; color: #9b2222; }
.notif .nf-action { margin-top: 8px; }

/* toast */
.toast-wrap { position: fixed; bottom: 22px; left: 50%; transform: translateX(-50%); z-index: 120; display: flex; flex-direction: column; gap: 8px; align-items: center; }
.toast { display: flex; align-items: center; gap: 10px; background: var(--bg-app); color: #fff; padding: 11px 15px; border-radius: 9px; box-shadow: var(--shadow-lg); font-size: 13.5px; font-weight: 500; animation: toastin .22s cubic-bezier(.2,.7,.3,1); }
.toast .t-undo { color: #8ab4ff; font-weight: 700; cursor: pointer; margin-left: 6px; }
@keyframes toastin { from { transform: translateY(12px); opacity: 0; } }

/* dropdown menu */
.menu { position: fixed; z-index: 100; background: var(--bg-surface); border: 1px solid var(--border); border-radius: 9px; box-shadow: var(--shadow-lg); padding: 5px; min-width: 220px; }
.menu .mi { display: flex; align-items: center; gap: 9px; padding: 8px 10px; border-radius: 6px; cursor: pointer; font-size: 13px; }
.menu .mi:hover { background: var(--bg-overlay); }
.menu .mi.new { color: var(--action); font-weight: 600; border-top: 1px solid var(--border-soft); margin-top: 4px; padding-top: 10px; }
.menu .mi-sub { font-size: 11.5px; color: var(--text-muted); margin-left: auto; }
.menu-label { font-size: 11px; font-weight: 700; letter-spacing: .04em; text-transform: uppercase; color: var(--text-muted); padding: 7px 10px 4px; }

/* freshness */
.fresh { display: inline-flex; align-items: center; gap: 5px; font-size: 12px; color: var(--text-muted); }
.fresh.stale { color: var(--warning); font-weight: 600; }

/* tabs */
.tabs { display: flex; gap: 2px; border-bottom: 1px solid var(--border); margin-bottom: 18px; }
.tab { padding: 9px 14px; font-size: 13.5px; font-weight: 600; color: var(--text-muted); cursor: pointer; border-bottom: 2px solid transparent; margin-bottom: -1px; }
.tab:hover { color: var(--text-primary); }
.tab.active { color: var(--action); border-bottom-color: var(--action); }

/* misc */
.divider { height: 1px; background: var(--border-soft); margin: 16px 0; }
.kv { display: grid; grid-template-columns: 130px 1fr; gap: 7px 16px; font-size: 13.5px; }
.kv dt { color: var(--text-muted); }
.kv dd { margin: 0; color: var(--text-primary); }
.spinner { width: 16px; height: 16px; border: 2px solid var(--border); border-top-color: var(--action); border-radius: 50%; animation: spin .7s linear infinite; }
.progress { height: 8px; background: var(--bg-overlay); border-radius: 5px; overflow: hidden; }
.progress > i { display: block; height: 100%; background: var(--action); border-radius: 5px; transition: width .3s; }
.comment-empty { text-align: center; padding: 26px; color: var(--text-muted); font-size: 13px; border: 1px dashed var(--border); border-radius: var(--radius-lg); }

/* upload / validation */
.dropzone { border: 2px dashed var(--border); border-radius: var(--radius-lg); padding: 40px 24px; text-align: center; cursor: pointer; background: var(--bg-raised); transition: border-color .15s, background .15s; }
.dropzone:hover { border-color: var(--action); background: var(--action-soft); }
.dropzone.error { border-color: #f3c2c2; background: var(--danger-soft); cursor: default; }
.map-chip { display: flex; align-items: center; gap: 6px; padding: 7px 10px; border: 1px solid var(--border-soft); border-radius: 7px; background: var(--bg-raised); font-size: 12.5px; }
.err-msg { display: inline-flex; align-items: center; gap: 4px; color: var(--danger); font-size: 12px; margin-top: 5px; }

/* sourcing live log */
.sourcing-grid { display: grid; grid-template-columns: repeat(5,1fr); gap: 10px; }
.scount { border: 1px solid var(--border); border-radius: var(--radius-lg); padding: 12px 13px; }
.scount .sc-n { font-size: 24px; font-weight: 700; font-variant-numeric: tabular-nums; }
.scount .sc-l { font-size: 11px; font-weight: 700; letter-spacing: .03em; text-transform: uppercase; display: flex; align-items: center; gap: 5px; margin-top: 2px; }
.logbox { background: var(--bg-app); border-radius: var(--radius-lg); padding: 12px 14px; font-family: var(--font-mono); font-size: 12px; color: var(--text-on-dark); max-height: 220px; overflow-y: auto; }
.logbox .lg { padding: 2px 0; display: flex; gap: 9px; }
.logbox .lg .lt { color: #586069; flex: none; }
.logbox .lg.warn { color: #f0b450; }
.logbox .lg.err { color: #f08a8a; }
.logbox .lg.ok { color: #7ee2a8; }

/* stepper */
.stepper { display: flex; gap: 0; margin-bottom: 22px; }
.step { flex: 1; display: flex; flex-direction: column; gap: 8px; position: relative; }
.step .st-bar { height: 4px; border-radius: 3px; background: var(--border-soft); }
.step.done .st-bar, .step.active .st-bar { background: var(--role-purchasing); }
.step .st-meta { display: flex; align-items: center; gap: 8px; }
.step .st-dot { width: 24px; height: 24px; border-radius: 50%; display: grid; place-items: center; font-size: 12px; font-weight: 700; flex: none; background: var(--bg-overlay); color: var(--text-muted); border: 1px solid var(--border); }
.step.done .st-dot { background: var(--role-purchasing); color: #fff; border-color: var(--role-purchasing); }
.step.active .st-dot { background: #fff; color: var(--role-purchasing); border-color: var(--role-purchasing); box-shadow: 0 0 0 3px var(--warning-soft); }
.step .st-name { font-size: 13px; font-weight: 600; }
.step .st-sub { font-size: 11.5px; color: var(--text-muted); }

/* pipeline rail (BOM pipeline progress) */
.pipeline-rail { display: flex; align-items: center; gap: 0; margin: 16px 0 4px; }
.pl-node { display: flex; align-items: center; gap: 8px; padding-right: 10px; }
.pl-node:not(:last-child)::after { content: ""; width: 28px; height: 2px; background: var(--border); margin-left: 2px; }
.pl-node.done:not(:last-child)::after { background: var(--role-production); }
.pl-dot { width: 24px; height: 24px; border-radius: 50%; display: grid; place-items: center; font-size: 12px; font-weight: 700; flex: none; background: var(--bg-overlay); color: var(--text-muted); border: 1px solid var(--border); }
.pl-node.done .pl-dot { background: var(--role-production); color: #fff; border-color: var(--role-production); }
.pl-node.active .pl-dot { background: #fff; color: var(--role-production); border-color: var(--role-production); box-shadow: 0 0 0 3px var(--info-soft); }
.pl-label { font-size: 12.5px; font-weight: 600; color: var(--text-secondary); }
.pl-node.active .pl-label { color: var(--text-primary); }
.scorecard { display: grid; grid-template-columns: repeat(4,1fr); gap: 12px; }

/* exception response rows */
.ex-row { display: grid; grid-template-columns: 1fr auto 1.3fr; gap: 14px; padding: 14px 16px; border-bottom: 1px solid var(--border-soft); align-items: stretch; }
.ex-row:last-child { border-bottom: 0; }
.ex-orig { background: var(--danger-soft); border: 1px solid #f3c2c2; border-radius: 8px; padding: 10px 12px; }
.ex-new { background: var(--success-soft); border: 1px solid #bce8cd; border-radius: 8px; padding: 10px 12px; }

/* admin: role rows, toggles, config rows */
.role-row { display: flex; align-items: center; gap: 10px; padding: 9px 12px; border: 1px solid var(--border-soft); border-radius: 8px; cursor: pointer; font-size: 13.5px; }
.cap-group { margin-top: 12px; }
.cap-group:first-of-type { margin-top: 0; }
.cap-group-label { font-size: 11px; font-weight: 700; letter-spacing: .04em; text-transform: uppercase; color: var(--text-muted); padding: 6px 0 6px; border-bottom: 1px solid var(--border-soft); margin-bottom: 4px; }
.cap-row { display: flex; align-items: center; gap: 10px; padding: 7px 4px; border-radius: 6px; font-size: 13px; cursor: pointer; }
.cap-row:hover { background: var(--bg-raised); }
.cap-row.base { color: var(--text-secondary); }
.cap-row.override { background: var(--warning-soft); }
.cfg-row { display: flex; align-items: center; gap: 16px; padding: 14px 18px; border-bottom: 1px solid var(--border-soft); }
.cfg-row:last-child { border-bottom: 0; }

/* ---------- Purchasing observation surface ---------- */
.onedrive-banner { display: flex; align-items: center; gap: 14px; padding: 14px 18px; border: 1px solid #bce8cd; background: var(--success-soft); border-radius: var(--radius-lg); margin-bottom: 20px; }
.onedrive-banner .od-pulse { width: 40px; height: 40px; border-radius: 10px; background: #fff; border: 1px solid #bce8cd; display: grid; place-items: center; color: var(--success); flex: none; }
.onedrive-banner .od-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--success); display: inline-block; box-shadow: 0 0 0 0 rgba(22,163,74,.5); animation: odPulse 2s infinite; }
@keyframes odPulse { 0% { box-shadow: 0 0 0 0 rgba(22,163,74,.45); } 70% { box-shadow: 0 0 0 7px rgba(22,163,74,0); } 100% { box-shadow: 0 0 0 0 rgba(22,163,74,0); } }
.obs-section { margin-bottom: 28px; }
.obs-head { display: flex; align-items: flex-start; gap: 12px; margin-bottom: 4px; }
.obs-head .obs-num { width: 26px; height: 26px; border-radius: 7px; background: var(--role-purchasing, var(--action)); color: #fff; display: grid; place-items: center; font-weight: 700; font-size: 13px; flex: none; }
.obs-head .obs-title { font-size: 17px; font-weight: 700; letter-spacing: -.01em; }
.obs-split { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-top: 10px; align-items: start; }
@media (max-width: 1100px) { .obs-split { grid-template-columns: 1fr; } }
/* v2 bucket model */
.bucket-head { display: flex; align-items: center; gap: 12px; padding: 10px 2px 12px; }
.bucket-flag { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 800; letter-spacing: .05em; padding: 4px 10px; border-radius: 6px; background: var(--bg-raised); color: var(--text-secondary); }
.bucket-head.critical .bucket-flag { background: var(--danger-soft); color: var(--danger); }
.bucket-count { font-size: 20px; font-weight: 800; color: var(--text-primary); }
.batch-timer { margin-left: auto; display: inline-flex; align-items: center; gap: 6px; font-size: 12.5px; color: var(--text-secondary); background: var(--bg-raised); border: 1px solid var(--border-soft); border-radius: 999px; padding: 4px 12px; }
.batch-timer strong { color: var(--text-primary); }
.bucket-empty { padding: 18px; text-align: center; color: var(--text-muted); font-size: 13px; border: 1px dashed var(--border); border-radius: 10px; }
.bucket-empty.critical { border-color: #f3c2c2; background: var(--danger-soft); color: #9b2222; }
.obs-section .tbl-wrap.flow { border-left: 3px solid var(--border); }
.bucket-head.critical + .tbl-wrap.flow { border-left-color: var(--danger); }
/* Critical flag toggle on Request to Order */
.crit-toggle { display: flex; align-items: flex-start; gap: 12px; padding: 12px 14px; border: 1px solid var(--border); border-radius: 10px; background: var(--bg-raised); }
.switch { width: 40px; height: 24px; border-radius: 999px; border: 0; background: var(--border); position: relative; cursor: pointer; flex: none; transition: background .15s; padding: 0; }
.switch.on { background: var(--danger); }
.switch .knob { position: absolute; top: 3px; left: 3px; width: 18px; height: 18px; border-radius: 50%; background: #fff; transition: transform .15s; }
.switch.on .knob { transform: translateX(16px); }
.cfg-row .cfg-ctl { margin-left: auto; flex: none; }
.toggle { width: 42px; height: 24px; border-radius: 13px; border: 0; background: var(--border); cursor: pointer; position: relative; transition: background .15s; padding: 0; }
.toggle.on { background: var(--success); }
.toggle.locked { opacity: .5; cursor: not-allowed; }
.toggle-knob { position: absolute; top: 3px; left: 3px; width: 18px; height: 18px; border-radius: 50%; background: #fff; transition: left .15s; box-shadow: 0 1px 3px rgba(0,0,0,.25); }
.toggle.on .toggle-knob { left: 21px; }

@media (prefers-reduced-motion: reduce) {
  * { animation-duration: .001ms !important; transition-duration: .001ms !important; }
}

/* ---------- v4 embedded surfaces ---------- */
.seg-toggle { display: inline-flex; border: 1px solid var(--border); border-radius: 8px; overflow: hidden; }
.seg-toggle button { border: 0; background: var(--bg-surface); padding: 7px 14px; font: inherit; font-size: 13px; font-weight: 600; cursor: pointer; color: var(--text-secondary); }
.seg-toggle button + button { border-left: 1px solid var(--border); }
.seg-toggle button.on { background: var(--action-soft); color: var(--action); }
.mini-progress { display: inline-block; width: 54px; height: 6px; border-radius: 3px; background: var(--border-soft); overflow: hidden; }
.mini-progress i { display: block; height: 100%; background: var(--success); }
.sync-bar { display: flex; align-items: center; gap: 8px; font-size: 12.5px; color: var(--text-secondary); padding: 8px 12px; border: 1px solid var(--border-soft); border-radius: 8px; background: var(--bg-raised); }
.loc-chip { font-size: 11.5px; font-family: var(--font-mono); padding: 2px 7px; border-radius: 5px; border: 1px solid var(--border); }
.loc-chip.project { background: var(--action-soft); color: var(--action); border-color: transparent; }
.loc-chip.wall { background: var(--warning-soft); color: var(--warning); border-color: transparent; }
.tag-chip { font-size: 10.5px; padding: 1px 6px; border-radius: 4px; background: var(--bg-overlay); color: var(--text-muted); border: 1px solid var(--border-soft); }
.prog-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 14px; }
.prog-card { text-align: left; border: 1px solid var(--border); border-radius: var(--radius-lg); padding: 18px; background: var(--bg-surface); cursor: pointer; font: inherit; transition: border-color .12s, box-shadow .12s; }
.prog-card:hover { border-color: var(--action); box-shadow: var(--shadow-sm); }
.prog-card-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; }
.prog-code { font-family: var(--font-mono); font-weight: 700; font-size: 13px; letter-spacing: .04em; background: var(--role-designer); color: #fff; padding: 3px 9px; border-radius: 6px; }
.prog-code.lg { font-size: 18px; padding: 5px 12px; }
.prog-name { font-weight: 700; font-size: 17px; }
.prog-meta { display: flex; gap: 14px; flex-wrap: wrap; font-size: 12px; color: var(--text-secondary); }
.prog-meta span { display: inline-flex; align-items: center; gap: 5px; }
.prog-coll-row { display: flex; align-items: center; gap: 10px; padding: 9px 10px; border-radius: 7px; cursor: pointer; }
.prog-coll-row:hover { background: var(--action-soft); }


/* ===== Push-Back resolution (v4 unified characteristic search) ===== */
.pbrl { border: 1px solid var(--border-soft); border-radius: 10px; padding: 10px; background: var(--bg-surface); }
.pbrl.picked { border-color: var(--success); background: rgba(22,163,74,.05); }
.pbrl-picked-row { display: flex; align-items: center; gap: 10px; }
.pbrl-fields { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.pbrl-fields .ipv-field { display: flex; flex-direction: column; gap: 3px; }
.pbrl-fields .ipv-label { font-size: 11px; font-weight: 600; color: var(--text-muted); text-transform: uppercase; letter-spacing: .04em; }
.pbrl-typeahead { position: absolute; top: 100%; left: 0; right: 0; z-index: 40; margin-top: 3px; background: var(--bg-surface); border: 1px solid var(--border); border-radius: 8px; box-shadow: 0 8px 24px rgba(0,0,0,.12); max-height: 220px; overflow-y: auto; }
.pbrl-typeahead .mi { display: flex; align-items: center; gap: 6px; padding: 7px 10px; font-size: 13px; cursor: pointer; }
.pbrl-typeahead .mi:hover { background: var(--action-soft); }
.pbrl-charbar { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin: 10px 0; }
.char-chip { display: inline-flex; align-items: center; gap: 4px; font-size: 12px; padding: 2px 8px; border-radius: 999px; background: var(--bg-overlay); border: 1px solid var(--border-soft); }
.char-x { border: 0; background: none; cursor: pointer; color: var(--text-muted); font-size: 14px; line-height: 1; padding: 0 0 0 2px; }
.pbrl-wall { display: inline-flex; align-items: center; gap: 5px; font-size: 12px; color: var(--text-secondary); margin-left: auto; }
.pbrl-results { display: flex; flex-direction: column; gap: 8px; }
.pbrl-sec-head { display: flex; align-items: center; gap: 8px; }
.cand-card { border: 1px solid var(--border-soft); border-radius: 8px; padding: 9px 11px; background: var(--bg-raised); }
.cand-card.eol { opacity: .7; }
.cand-head { display: flex; align-items: flex-start; gap: 10px; }
.cand-chars { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 6px; }
.cand-char { display: inline-flex; align-items: center; gap: 3px; font-size: 11.5px; font-weight: 600; }
.cand-foot { display: flex; align-items: center; gap: 10px; margin-top: 6px; }
.pb-line { border-top: 1px solid var(--border-soft); padding-top: 12px; margin-top: 12px; }
.pb-line.missing { border-top-color: var(--action); }
.pb-line-head { display: flex; align-items: center; gap: 8px; margin-bottom: 6px; flex-wrap: wrap; }
.na-actiontag { font-size: 11px; color: var(--text-muted); margin-right: 8px; white-space: nowrap; }


/* ===== CPN scope pill (v4 — replaces sigil prefix) ===== */
.cpn-cell { display: inline-flex; align-items: center; gap: 6px; }
.scope-pill { display: inline-flex; align-items: center; font-size: 10px; font-weight: 700; letter-spacing: .03em; text-transform: uppercase; padding: 1px 6px; border-radius: 999px; line-height: 1.5; border: 1px solid; }
.scope-pill.project { color: var(--role-designer); border-color: var(--role-designer); background: color-mix(in srgb, var(--role-designer) 8%, transparent); }
.scope-pill.wall { color: #B45309; border-color: #B45309; background: color-mix(in srgb, #B45309 8%, transparent); }


/* ===== Create-flow chip input ===== */
.chip-input { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; border: 1px solid var(--border); border-radius: 8px; padding: 6px 8px; background: var(--bg-surface); }
.chip-tag { display: inline-flex; align-items: center; gap: 3px; font-size: 12px; padding: 2px 4px 2px 9px; border-radius: 999px; background: var(--bg-overlay); border: 1px solid var(--border-soft); }
.chip-entry { border: 0; outline: 0; background: none; font: inherit; flex: 1; min-width: 120px; padding: 3px 2px; }


/* Sourcing/refresh button click feedback — one spin */
@keyframes sourcing-spin-once { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
svg[data-icon="refresh"].spin-once { animation: sourcing-spin-once .6s ease-in-out; transform-origin: 50% 50%; }


/* ===== Prototype login screen ===== */
.login-wrap { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 32px; background: radial-gradient(1200px 600px at 50% -10%, color-mix(in srgb, var(--action) 8%, var(--bg-app)) 0%, var(--bg-app) 60%); }
.login-card { width: 100%; max-width: 400px; background: var(--bg-surface); border: 1px solid var(--border); border-radius: 16px; padding: 32px; box-shadow: 0 24px 60px rgba(0,0,0,.10); }
.login-brand { display: flex; align-items: center; gap: 11px; margin-bottom: 26px; }
.login-logo { width: 40px; height: 40px; border-radius: 10px; background: var(--action); color: #fff; font-weight: 800; font-size: 20px; display: grid; place-items: center; }
.login-brandname { font-weight: 800; font-size: 17px; letter-spacing: -.01em; }
.login-brandsub { font-size: 12px; color: var(--text-muted); }
.login-title { font-size: 21px; font-weight: 700; letter-spacing: -.01em; }
.login-sub { font-size: 13px; color: var(--text-secondary); margin: 3px 0 20px; }
.login-submit { width: 100%; justify-content: center; margin-top: 2px; }
.login-error { display: flex; align-items: center; gap: 6px; font-size: 12.5px; color: var(--danger); background: var(--danger-soft, color-mix(in srgb, var(--danger) 9%, transparent)); border-radius: 7px; padding: 7px 10px; margin-bottom: 10px; }
.login-spinner { width: 14px; height: 14px; border: 2px solid rgba(255,255,255,.4); border-top-color: #fff; border-radius: 50%; display: inline-block; animation: sourcing-spin-once .7s linear infinite; }
.login-divider { display: flex; align-items: center; gap: 10px; margin: 18px 0; color: var(--text-muted); font-size: 11.5px; text-transform: uppercase; letter-spacing: .06em; }
.login-divider::before, .login-divider::after { content: ""; flex: 1; height: 1px; background: var(--border-soft); }
.login-sso { width: 100%; justify-content: center; gap: 9px; position: relative; }
.login-sso .ms-glyph { display: inline-grid; grid-template-columns: 8px 8px; gap: 2px; }
.login-sso .ms-glyph span { width: 8px; height: 8px; }
.login-sso .ms-glyph span:nth-child(1){ background:#F25022; } .login-sso .ms-glyph span:nth-child(2){ background:#7FBA00; }
.login-sso .ms-glyph span:nth-child(3){ background:#00A4EF; } .login-sso .ms-glyph span:nth-child(4){ background:#FFB900; }
.login-soon { font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: .04em; color: var(--text-muted); border: 1px solid var(--border-soft); border-radius: 999px; padding: 1px 6px; margin-left: 4px; }
.login-hints { margin-top: 22px; border-top: 1px solid var(--border-soft); padding-top: 16px; display: flex; flex-direction: column; gap: 7px; }
.login-hints-label { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .05em; color: var(--text-muted); }
.login-hint { display: grid; grid-template-columns: auto auto 1fr; align-items: center; gap: 8px; text-align: left; padding: 8px 10px; border: 1px solid var(--border-soft); border-radius: 8px; background: var(--bg-raised); cursor: pointer; }
.login-hint:hover { border-color: var(--action); background: var(--action-soft); }
.login-hint .lh-name { font-weight: 600; font-size: 13px; }
.login-hint .lh-note { font-size: 11px; color: var(--text-muted); }
.login-hint .lh-email { font-size: 11px; color: var(--text-secondary); text-align: right; }
.login-proto-note { display: flex; align-items: flex-start; gap: 6px; font-size: 11.5px; color: var(--text-muted); line-height: 1.5; margin-top: 6px; }


/* ===== User menu (top rail) + static role chip ===== */
.user-menu-btn { display: inline-flex; align-items: center; gap: 4px; border: 0; background: none; cursor: pointer; padding: 2px 4px 2px 2px; border-radius: 999px; }
.user-menu-btn:hover { background: var(--bg-overlay); }
.um-head { display: flex; align-items: center; gap: 10px; padding: 6px 10px 10px; border-bottom: 1px solid var(--border-soft); margin-bottom: 4px; }
.um-name { font-weight: 700; font-size: 13.5px; }
.um-email { font-size: 11.5px; color: var(--text-muted); overflow: hidden; text-overflow: ellipsis; }
.um-role { display: flex; align-items: center; justify-content: space-between; padding: 5px 10px; font-size: 12.5px; }
.role-chip-static { cursor: default; }
.role-chip-static:hover { background: inherit; }

/* Lightweight popover that positions under an anchor and closes on outside click */
function Popover({ anchorRef, open, onClose, children, align = 'left', width }) {
  const ref = useRef(null);
  const [pos, setPos] = useState(null);
  useLayoutEffect(() => {
    if (open && anchorRef.current) {
      const r = anchorRef.current.getBoundingClientRect();
      setPos({ top: r.bottom + 6, left: align === 'right' ? r.right - (width || 240) : r.left });
    }
  }, [open]);
  useEffect(() => {
    if (!open) return;
    const h = (e) => { if (ref.current && !ref.current.contains(e.target) && anchorRef.current && !anchorRef.current.contains(e.target)) onClose(); };
    const k = (e) => { if (e.key === 'Escape') onClose(); };
    document.addEventListener('mousedown', h); document.addEventListener('keydown', k);
    return () => { document.removeEventListener('mousedown', h); document.removeEventListener('keydown', k); };
  }, [open]);
  if (!open || !pos) return null;
  return <div ref={ref} className="menu" style={{ top: pos.top, left: pos.left, minWidth: width || 240 }}>{children}</div>;
}

function EmptyState({ icon = 'inbox', title, sub, actions }) {

          <span className="related-kind">{it.kind}</span>
          <span className="related-val">{it.label}</span>
        </button>
      ))}
    </div>
  );
}

/* Role defaults — what each role can do straight out of the box. */
const CAPS = {
  designer: new Set([
    'collection.create', 'collection.edit', 'collection.requestOrder',
    'part.search', 'part.addToCollection', 'bom.respondException',
    'comment', 'project.create',
  ]),
  production: new Set([

    'bom.sendException', 'bom.createPackage', 'bom.submitToPurchasing',

  ]),
  development: new Set([

    'dev.investigation.create', 'dev.recommendation.create',
    'dev.rework.create', 'dev.firmware.create',
    'dev.handshake.send', 'dev.handshake.respond',
    'comment',
  ]),
  manager:   new Set(['comment']),
  executive: new Set([]),
  readonly:  new Set([]),
  admin: new Set([
    'admin.users', 'admin.roles', 'admin.permissions', 'admin.workflow',
    'admin.suppliers', 'admin.settings', 'admin.audit', 'admin.override', 'comment',
  ]),
};

/* Resolve effective capability set for a user (one or more roles + overrides). */
function effectiveCaps(user) {
  const set = new Set();
  if (user && user.roles) for (const r of user.roles) (CAPS[r] || new Set()).forEach(c => set.add(c));
  if (user && user.overrides) for (const c of user.overrides) set.add(c);
  return set;
}
function inBaseRole(user, cap) {
  if (!user || !user.roles) return false;
  return user.roles.some(r => (CAPS[r] || new Set()).has(cap));
}

/* can(action, ctx): production code calls this everywhere.
   ctx may be { role } (legacy), { user }, or { role, user } — we honor whichever is most specific. */
function can(actionOrRole, action, user) {
  // legacy 2-arg form: can(role, action)
  if (typeof action === 'string' && !user) return !!(CAPS[actionOrRole] && CAPS[actionOrRole].has(action));
  // new form: can(action, user)
  const a = actionOrRole;
  const u = action;
  return effectiveCaps(u).has(a);
}

/* State-based lock resolver (unchanged in spec). */
function lockFor(objectType, state, role) {
  const D = role === 'designer', P = role === 'production';
  if (objectType === 'collection') {
    if (state === 'order-requested' && D) return { title: 'In the purchasing bucket', owner: 'purchasing', body: 'Its lines are pooling toward the next batch on the Daily Purchasing List. Parts are locked while it’s in the bucket.', canDo: 'View, comment, track status' };
    if (state === 'ordered' && (D || P)) return { title: 'Ordered — read-only', owner: 'purchasing', body: 'This collection has been ordered. All content is read-only.', canDo: 'View order status, track' };
  }
  if (objectType === 'bom') {
    if (state === 'submitted' && (P || D)) return { title: 'In the purchasing bucket', owner: 'purchasing', body: 'Engineering content is locked while its lines pool toward the next purchasing batch.', canDo: 'View, comment, track status' };
    if (state === 'exceptions' && P) return { title: 'Exception report sent to Designer', owner: 'designer', body: 'Waiting for replacement parts from engineering.', canDo: 'View, track' };
    if ((state === 'ordered' || state === 'approved') && (P || D)) return { title: 'Approved & ordered — read-only', owner: 'purchasing', body: 'This BOM has been ordered. All content is read-only.', canDo: 'View order status, track' };
  }
  if (objectType === 'request') {
    if ((state === 'approved' || state === 'ordered') && (D || P)) return { title: 'Approved & ordered — read-only', owner: 'purchasing', body: 'This request has been approved and ordered. All content is read-only.', canDo: 'View order status, track' };
  }
  return null;
}
