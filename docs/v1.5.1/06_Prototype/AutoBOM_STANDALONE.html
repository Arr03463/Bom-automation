              <button className={`btn ${respond === 'rejected' ? 'danger' : 'primary'}`}
                disabled={respond === 'rejected' && note.trim().length < 5}
                onClick={() => { storeActions.respondRecommendation(id, respond, note); setRespond(null); }}>
                Send {respond}
              </button>
            </div>
          </div>
        </div>}
      </div>
    )}
  </DevDetailShell>;
}

function ReworkDetail({ id, go }) {
  const obj = useStore(s => s.reworks.find(x => x.id === id));
  const [returnOpen, setReturnOpen] = useStateV(false);
  const [note, setNote] = useStateV('');
  const activeRole = useStore(s => s.activeRole);
  const canReturn = activeRole === 'production' && obj && (obj.state === 'pushed' || obj.state === 'inprogress');

  return <DevDetailShell kind="rework" id={id} go={go}
    action={canReturn ? <button className="btn primary" onClick={() => setReturnOpen(true)}><Icon name="check" size={15} />Mark validated & return</button> : null}>
    {(obj) => (
      <>
        <div className="card" style={{ padding: 18 }}>
          <div className="h2" style={{ marginBottom: 10 }}>Procedure · {obj.boards} units</div>
          <ol style={{ margin: 0, paddingLeft: 20 }}>{obj.procedure.map((s, i) => <li key={i} style={{ marginBottom: 5 }}>{s}</li>)}</ol>
          {obj.results && obj.results.progress != null && (
            <div style={{ marginTop: 14 }}>
              <div className="caption" style={{ fontWeight: 600, marginBottom: 5 }}>Production progress · {obj.results.progress} of {obj.results.ofTotal} units</div>
              <div className="progress"><i style={{ width: (obj.results.progress / obj.results.ofTotal * 100) + '%', background: 'var(--role-development)' }} /></div>
            </div>
          )}
        </div>
        {returnOpen && <div className="modal-wrap"><div className="scrim" onClick={() => setReturnOpen(false)} />
          <div className="modal" style={{ position: 'relative', zIndex: 95 }}>
            <div className="modal-head"><div className="mh-title">Return rework to Development</div></div>
            <div className="modal-body"><textarea className="textarea" placeholder="Results — pass/fail counts, anomalies, observations…" value={note} onChange={e => setNote(e.target.value)} /></div>
            <div className="modal-foot"><button className="btn" onClick={() => setReturnOpen(false)}>Cancel</button>
              <button className="btn primary" disabled={note.trim().length < 5} onClick={() => { storeActions.returnRework(id, note); setReturnOpen(false); }}>Return with results</button></div>
          </div>
        </div>}
      </>
    )}
  </DevDetailShell>;
}

function FirmwareDetail({ id, go }) {
  const obj = useStore(s => s.firmwares.find(x => x.id === id));
  const [openValidate, setOpenValidate] = useStateV(false);
  const [note, setNote] = useStateV('');
  const activeRole = useStore(s => s.activeRole);
  const canValidate = activeRole === 'production' && obj && obj.state === 'validating';
  const canPush = activeRole === 'development' && obj && (obj.state === 'released' || obj.state === 'draft');

  return <DevDetailShell kind="firmware" id={id} go={go}
    action={canValidate ? <button className="btn primary" onClick={() => setOpenValidate(true)}><Icon name="check" size={15} />Validate release</button>
      : canPush ? <button className="btn primary" onClick={() => storeActions.pushFirmware(id)}><Icon name="send" size={15} />Push for validation</button> : null}>
    {(obj) => (
      <>
        <div className="card" style={{ padding: 18 }}>
          <div className="h2" style={{ marginBottom: 8 }}>Changelog · v{obj.version}</div>
          <ul style={{ margin: 0, paddingLeft: 18 }}>{obj.changelog.map((c, i) => <li key={i} style={{ marginBottom: 4 }}>{c}</li>)}</ul>
        </div>
        {openValidate && <div className="modal-wrap"><div className="scrim" onClick={() => setOpenValidate(false)} />
          <div className="modal" style={{ position: 'relative', zIndex: 95 }}>
            <div className="modal-head"><div className="mh-title">Mark firmware validated</div></div>
            <div className="modal-body"><textarea className="textarea" placeholder="Validation results, units tested, observations…" value={note} onChange={e => setNote(e.target.value)} /></div>
            <div className="modal-foot"><button className="btn" onClick={() => setOpenValidate(false)}>Cancel</button>
              <button className="btn primary" disabled={note.trim().length < 5} onClick={() => { storeActions.validateFirmware(id, note); setOpenValidate(false); }}>Validate</button></div>
          </div>
        </div>}
      </>
    )}
  </DevDetailShell>;
}

Object.assign(window, { DevelopmentDashboard, DevListScreen, InvestigationDetail, RecommendationDetail, ReworkDetail, FirmwareDetail, DEV_BADGE });

</script>
<script type="text/babel" data-source="screen_dev_collections.jsx">
/* global React, Icon, StatusBadge, RoleTag, SupplierTag, Banner, EmptyState, TraceabilityStrip,
   RelatedLinks, BomTable, Totals, useStore, storeActions, PROJECTS, DC_BADGE, fmtUSD, fmtInt */
const { useState: useStateDC, useRef: useRefDC } = React;

const DC_CATEGORIES = ['Investigation', 'Testing', 'Validation', 'Rework', 'Reliability', 'Firmware', 'Hardware', 'Cost Reduction', 'Future Revision', 'Supplier Evaluation'];
const DC_CATEGORY_COLOR = {
  Investigation: '#059669', Testing: '#0891B2', Validation: '#0891B2', Rework: '#D97706',
  Reliability: '#7C3AED', Firmware: '#1A56DB', Hardware: '#059669',
  'Cost Reduction': '#16A34A', 'Future Revision': '#475569', 'Supplier Evaluation': '#EA580C',
};

const OUTCOME_TYPES = [
  { kind: 'recommendation', label: 'Improvement Recommendation', targetRole: 'designer', icon: 'sparkle',
    blurb: 'Suggest a part swap or design improvement to the Designer.' },
  { kind: 'rework', label: 'Rework Package', targetRole: 'production', icon: 'refresh',
    blurb: 'Send a structured rework procedure to Production for a batch of units.' },
  { kind: 'firmware', label: 'Firmware Release', targetRole: 'production', icon: 'upload',
    blurb: 'Push a firmware build to Production for validation.' },
  { kind: 'investigation-report', label: 'Investigation Report', targetRole: 'designer', icon: 'search',
    blurb: 'Publish findings — root cause, evidence, recommendation.' },
  { kind: 'eng-change', label: 'Engineering Change Recommendation', targetRole: 'designer', icon: 'flag',
    blurb: 'Formal engineering change request to the design team.' },
];

function CategoryChip({ category, size = 'sm' }) {
  const c = DC_CATEGORY_COLOR[category] || 'var(--role-development)';
  const h = size === 'lg' ? 24 : 20;
  return <span className="badge outlined" style={{ color: c, borderColor: c, height: h, fontSize: size === 'lg' ? 12 : 11 }}>
    <Icon name="tag" size={size === 'lg' ? 12 : 11} />{category}
  </span>;
}

function DevKindGlyph({ kind = 'development', size = 16 }) {
  // Visual marker to distinguish at-a-glance from Designer collections.
  const isDev = kind === 'development';
  return <span style={{ display: 'inline-grid', placeItems: 'center', width: size + 6, height: size + 6, borderRadius: 6, background: isDev ? 'var(--role-development)' : 'var(--role-designer)', color: '#fff', flex: 'none' }}>
    <Icon name={isDev ? 'sparkle' : 'layers'} size={size - 2} />
  </span>;
}

/* ---------- Development Collection List ---------- */
const DC_LIST_FILTERS = [
  { key: 'all', label: 'All' },
  { key: 'draft', label: 'Draft' },
  { key: 'active', label: 'Active' },
  { key: 'ready', label: 'Ready for review' },
  { key: 'recommendation-sent', label: 'Recommendation sent' },
  { key: 'accepted', label: 'Accepted' },
  { key: 'rejected', label: 'Rejected' },
  { key: 'closed', label: 'Closed' },
];

function DevCollectionListScreen({ go }) {
  const all = useStore(s => s.collections.filter(c => c.role === 'development'));
  const [ls, setLs] = window.useListState('v.collections', { filter: 'all', cat: 'all', q: '' });
  const [showNew, setShowNew] = React.useState(false);
  let rows = all;
  if (ls.filter !== 'all') rows = rows.filter(c => c.state === ls.filter);
  if (ls.cat !== 'all') rows = rows.filter(c => c.category === ls.cat);
  if (ls.q.trim()) { const s = ls.q.toLowerCase(); rows = rows.filter(c => (c.name + (c.category || '') + PROJECTS[c.project].name).toLowerCase().includes(s)); }
  const counts = {}; DC_LIST_FILTERS.forEach(f => counts[f.key] = f.key === 'all' ? all.length : all.filter(c => c.state === f.key).length);

  return (
    <div className="page page-wide">
      <div className="page-head">
        <div className="ph-titles">
          <div className="display" style={{ display: 'flex', alignItems: 'center', gap: 12 }}><DevKindGlyph kind="development" size={20} />Development Collections</div>
          <div className="ph-sub">Investigations, testing, reliability studies — work that produces an outcome, not an order. Owned by Development.</div>
        </div>
        <div className="ph-actions">
          <button className="btn primary" style={{ background: 'var(--role-development)', borderColor: 'var(--role-development)' }} onClick={() => setShowNew(true)}><Icon name="plus" size={15} />New Development Collection</button>
        </div>
      </div>

      <div className="filterbar">
        {DC_LIST_FILTERS.map(f => <button key={f.key} className={`fchip${ls.filter === f.key ? ' active' : ''}`} onClick={() => setLs({ filter: f.key })}>{f.label}<span className="fc-n">{counts[f.key]}</span></button>)}
        <div style={{ marginLeft: 'auto', display: 'flex', gap: 8, alignItems: 'center' }}>
          <select className="select" value={ls.cat} onChange={e => setLs({ cat: e.target.value })} style={{ height: 32, padding: '0 28px 0 10px', fontSize: 12.5, width: 180 }}>
            <option value="all">All categories</option>
            {DC_CATEGORIES.map(c => <option key={c} value={c}>{c}</option>)}
          </select>
          <div className="searchfield" style={{ minWidth: 230 }}>
            <Icon name="search" size={15} style={{ color: 'var(--text-muted)' }} />
            <input value={ls.q} placeholder="Filter by name, category, project…" onChange={e => setLs({ q: e.target.value })} />
          </div>
        </div>
      </div>

      <div className="tbl-wrap flow" style={{ borderRadius: '0 0 10px 10px', borderTop: 0 }}>
        {rows.length === 0 ? <EmptyState icon="search" title="No Development Collections match these filters." sub="Clear the filter or create a new collection to start an investigation."
          actions={<button className="btn" onClick={() => setLs({ filter: 'all', cat: 'all', q: '' })}>Clear filters</button>} />
        : rows.map(c => {
          const outcome = c.outcomes && c.outcomes[0];
          return (
            <div key={c.id} className="lrow" style={{ boxShadow: 'inset 3px 0 0 var(--role-development)' }} onClick={() => go({ screen: 'v.collectionDetail', id: c.id })}>
              <div style={{ minWidth: 0 }}>
                <div className="lr-title" style={{ display: 'flex', alignItems: 'center', gap: 9, flexWrap: 'wrap' }}>
                  <DevKindGlyph kind="development" size={13} />
                  <span>{c.name}</span>
                  <StatusBadge status={DC_BADGE[c.state]} />
                  <CategoryChip category={c.category} />
                </div>
                <div className="lr-meta">
                  <span className="mono">{c.id}</span><span className="tr-sep" />
                  <span style={{ display: 'inline-flex', alignItems: 'center', gap: 5 }}><Icon name="folder" size={13} />{PROJECTS[c.project].name}</span>
                  <span className="tr-sep" /><span>{c.items.length} part{c.items.length !== 1 ? 's' : ''}</span>
                  <span className="tr-sep" /><span>{c.creator}</span>
                  <span className="tr-sep" /><span>updated {c.updated}</span>
                </div>
              </div>
              <div className="lr-right">
                <div className="lr-stats">
                  {outcome ? <span style={{ display: 'inline-flex', alignItems: 'center', gap: 5 }}><Icon name="send" size={12} style={{ color: 'var(--role-development)' }} /><b>{outcome.label}</b> → {outcome.targetRole}</span>
                    : <span className="muted">No outcome yet</span>}
                </div>
              </div>
            </div>
          );
        })}
      </div>
      {showNew && <NewCollectionModal kind="development" onClose={() => setShowNew(false)} onCreated={(id) => { setShowNew(false); go({ screen: 'v.collectionDetail', id }); }} />}
    </div>
  );
}

/* ---------- Generate Outcome modal ---------- */
function GenerateOutcomeModal({ collection, onClose, onDone }) {
  const [kind, setKind] = useStateDC(null);
  const [title, setTitle] = useStateDC(collection.name);
  const [note, setNote] = useStateDC(collection.notes || '');
  const [boards, setBoards] = useStateDC('');
  const [version, setVersion] = useStateDC('');
  const [proposedMpn, setProposedMpn] = useStateDC('');
  const [currentMpn, setCurrentMpn] = useStateDC('');

  const meta = OUTCOME_TYPES.find(t => t.kind === kind);
  const canSubmit = !!kind && title.trim().length > 2 && (kind !== 'rework' || +boards > 0) && (kind !== 'firmware' || version.trim()) && (kind !== 'recommendation' || (proposedMpn.trim() && currentMpn.trim()));
  const submit = () => {
    const id = storeActions.generateOutcome(collection.id, { kind, title: title.trim(), desc: collection.desc, note: note.trim(),
      proposedMpn: proposedMpn.trim(), currentMpn: currentMpn.trim(), boards: +boards || 0, version: version.trim(),
      procedure: note.split('\n').filter(Boolean), changelog: note.split('\n').filter(Boolean) });
    onDone(id, meta);
  };

  return (
    <div className="modal-wrap"><div className="scrim" onClick={onClose} />
      <div className="modal" style={{ position: 'relative', zIndex: 95, width: 640, maxWidth: '94vw' }}>
        <div className="modal-head"><div className="mh-title" style={{ display: 'flex', alignItems: 'center', gap: 9 }}><Icon name="send" size={18} style={{ color: 'var(--role-development)' }} />Generate Outcome — {collection.name}</div>
          <div className="caption" style={{ marginTop: 4 }}>Pick the outcome type. This pushes a handshake to the receiving role with notification, audit, and ownership transfer.</div></div>
        <div className="modal-body" style={{ maxHeight: '60vh', overflowY: 'auto' }}>
          {!kind ? (
            <div style={{ display: 'grid', gap: 8 }}>
              {OUTCOME_TYPES.map(o => (
                <button key={o.kind} className="role-row" style={{ textAlign: 'left', cursor: 'pointer', borderColor: 'var(--border-soft)', background: 'var(--bg-surface)' }} onClick={() => setKind(o.kind)}>
                  <span style={{ width: 36, height: 36, borderRadius: 8, background: 'var(--success-soft)', color: 'var(--role-development)', display: 'grid', placeItems: 'center', flex: 'none' }}><Icon name={o.icon} size={18} /></span>
                  <div style={{ flex: 1 }}><div style={{ fontWeight: 600 }}>{o.label}</div><div className="caption" style={{ marginTop: 2 }}>{o.blurb}</div></div>
                  <span className="tag" style={{ color: '#fff', background: 'var(--role-' + o.targetRole + ')' }}>→ {o.targetRole.toUpperCase()}</span>
                </button>
              ))}
            </div>
          ) : (
            <>
              <div style={{ display: 'flex', alignItems: 'center', gap: 9, padding: '8px 11px', background: 'var(--bg-overlay)', borderRadius: 7, marginBottom: 14 }}>
                <Icon name={meta.icon} size={16} style={{ color: 'var(--role-development)' }} />
                <span style={{ fontWeight: 600 }}>{meta.label}</span>
                <span className="tag" style={{ marginLeft: 'auto', color: '#fff', background: 'var(--role-' + meta.targetRole + ')' }}>→ {meta.targetRole.toUpperCase()}</span>
                <button className="btn ghost sm" onClick={() => setKind(null)}>Change</button>
              </div>
              <label className="field" style={{ marginBottom: 10 }}><span className="fl">Title</span>
                <input className="input" value={title} onChange={e => setTitle(e.target.value)} /></label>
              {kind === 'recommendation' && (
                <>
                  <label className="field" style={{ marginBottom: 10 }}><span className="fl">Current MPN <span className="muted">(being replaced)</span></span>
                    <input className="input mono" value={currentMpn} onChange={e => setCurrentMpn(e.target.value)} placeholder="e.g. IRFB4110PBF" /></label>
                  <div className="field" style={{ marginBottom: 10 }}>
                    <span className="fl">Proposed MPN <span className="muted">(verify before pushing)</span></span>
                    {proposedMpn && proposedMpn.trim() && false /* confirmed view handled by IPV reset */}
                    <InlinePartVerify
                      mpn={proposedMpn}
                      mfr={''}
                      onMpnChange={setProposedMpn}
                      onMfrChange={() => {}}
                      originalMpn={currentMpn}
                      onConfirm={(part) => { setProposedMpn(part.mpn); }}
                    />
                  </div>
                </>
              )}
              {kind === 'rework' && (
                <label className="field" style={{ marginBottom: 10 }}><span className="fl">Units to rework</span>
                  <input className="input" type="number" value={boards} onChange={e => setBoards(e.target.value)} placeholder="e.g. 12" /></label>
              )}
              {kind === 'firmware' && (
                <label className="field" style={{ marginBottom: 10 }}><span className="fl">Version</span>
                  <input className="input mono" value={version} onChange={e => setVersion(e.target.value)} placeholder="e.g. 1.5.0" /></label>
              )}
              <label className="field"><span className="fl">{kind === 'rework' ? 'Procedure' : kind === 'firmware' ? 'Changelog' : 'Note to receiving role'} <span className="muted">(one per line)</span></span>
                <textarea className="textarea" rows={5} value={note} onChange={e => setNote(e.target.value)} placeholder={kind === 'rework' ? 'Step 1…\nStep 2…' : kind === 'firmware' ? 'Changelog item…' : 'Context, findings, recommendation…'} /></label>
            </>
          )}
        </div>
        <div className="modal-foot">
          <button className="btn" onClick={onClose}>Cancel</button>
          {kind && <button className="btn primary" disabled={!canSubmit} style={{ background: 'var(--role-development)', borderColor: 'var(--role-development)' }} onClick={submit}><Icon name="send" size={15} />Push to {meta.targetRole}</button>}
        </div>
      </div>
    </div>
  );
}

/* ---------- Development Collection Detail ---------- */
function DevCollectionDetail({ id, go }) {
  const c = useStore(s => s.collections.find(x => x.id === id && x.role === 'development'));
  const [outcomeOpen, setOutcomeOpen] = useStateDC(false);
  const [addOpen, setAddOpen] = useStateDC(false);
  const [editingNote, setEditingNote] = useStateDC(null);
  const [noteDraft, setNoteDraft] = useStateDC('');
  if (!c) return <div className="page"><EmptyState icon="search" title="Development Collection not found." /></div>;
  const PROJ = PROJECTS[c.project];
  const stateNext = c.state === 'draft' ? 'active' : c.state === 'active' ? 'ready' : null;
  const canPushOutcome = c.state === 'ready';
  const isLocked = ['accepted', 'closed', 'archived'].includes(c.state);

  return (
    <div className="page page-wide">
      <div className="page-head" style={{ marginBottom: 4 }}>
        <div className="ph-titles">
          <button className="btn-link" style={{ marginBottom: 8 }} onClick={() => go({ screen: 'v.collections' })}>← Development Collections</button>
          <div className="h1" style={{ display: 'flex', alignItems: 'center', gap: 11 }}><DevKindGlyph kind="development" size={18} />{c.name}</div>
        </div>
        <div className="ph-actions">
          {!isLocked && stateNext && <button className="btn" onClick={() => storeActions.setDevCollectionState(c.id, stateNext)}>
            <Icon name="arrow" size={15} />Mark {stateNext === 'ready' ? 'Ready for Review' : 'Active'}
          </button>}
          {canPushOutcome && <button className="btn primary" style={{ background: 'var(--role-development)', borderColor: 'var(--role-development)' }} onClick={() => setOutcomeOpen(true)}>
            <Icon name="send" size={15} />Generate Outcome
          </button>}
        </div>
      </div>
      <TraceabilityStrip name={c.name} status={DC_BADGE[c.state]} creator={c.creator} role="development"
        project={PROJ.name} updated={c.updated} updatedBy={c.updatedBy} recordId={c.id}
        onProject={() => go({ screen: 'projectDetail', id: c.project, tab: 'collections' })} />

      <div style={{ display: 'flex', alignItems: 'center', gap: 9, padding: '10px 0 2px' }}>
        <CategoryChip category={c.category} size="lg" />
        <span className="caption">·</span>
        <span className="caption">Development Collection · feeds into <strong style={{ color: 'var(--role-development)' }}>Improvement Recommendation / Rework / Firmware / Investigation Report / Engineering Change</strong></span>
      </div>

      <RelatedLinks items={[
        { kind: 'PCB Project', label: PROJ.name, icon: 'folder', onClick: () => go({ screen: 'projectDetail', id: c.project }) },
        ...(c.outcomes || []).map(o => ({ kind: o.label, label: o.linkedId, icon: 'send',
          onClick: () => go(o.kind === 'rework' ? { screen: 'v.reworkDetail', id: o.linkedId }
            : o.kind === 'firmware' ? { screen: 'v.firmwareDetail', id: o.linkedId }
            : o.kind === 'investigation-report' ? { screen: 'v.investigationDetail', id: o.linkedId }
            : { screen: 'v.recommendationDetail', id: o.linkedId }) })),
      ]} />

      {c.state === 'draft' && <Banner kind="info" icon="circle" title="Draft — work in progress"
        actions={<button className="btn sm" onClick={() => storeActions.setDevCollectionState(c.id, 'active')}>Start investigation</button>}>
        Add candidate components and notes. When you're ready, mark the collection Active to record progress and stale-check supplier data.
      </Banner>}
      {c.state === 'recommendation-sent' && c.outcomes[0] && <Banner kind="info" icon="send" title={`${c.outcomes[0].label} pushed to ${c.outcomes[0].targetRole} · ${c.outcomes[0].when}`}
        actions={<button className="btn sm" onClick={() => go(c.outcomes[0].kind === 'rework' ? { screen: 'v.reworkDetail', id: c.outcomes[0].linkedId } : c.outcomes[0].kind === 'firmware' ? { screen: 'v.firmwareDetail', id: c.outcomes[0].linkedId } : c.outcomes[0].kind === 'investigation-report' ? { screen: 'v.investigationDetail', id: c.outcomes[0].linkedId } : { screen: 'v.recommendationDetail', id: c.outcomes[0].linkedId })}>Track outcome →</button>}>
        Linked outcome: <span className="mono">{c.outcomes[0].linkedId}</span>. Awaiting response from the receiving role.
      </Banner>}
      {isLocked && <Banner kind="lock" title={`${c.state[0].toUpperCase() + c.state.slice(1)} — read-only`}>
        This collection is preserved as historical record. Knowledge stays in the system forever.
      </Banner>}

      <p className="secondary" style={{ margin: '10px 0 0', maxWidth: 760 }}>{c.desc}</p>

      {/* Investigation notes — distinct from per-item notes */}
      <div className="card" style={{ padding: 14, marginTop: 16 }}>
        <div className="caption" style={{ fontWeight: 700, textTransform: 'uppercase', fontSize: 10.5, letterSpacing: '.04em', color: 'var(--text-muted)' }}>Investigation Notes</div>
        {isLocked
          ? <p style={{ margin: '6px 0 0' }} className="secondary">{c.notes || 'No notes.'}</p>
          : <textarea className="textarea" style={{ marginTop: 8, minHeight: 56, border: 'none', padding: 0, background: 'transparent', resize: 'vertical' }} defaultValue={c.notes} onBlur={e => storeActions.setDevCollectionNotes(c.id, e.target.value)} placeholder="Capture observations, test results, hypotheses…" />}
      </div>

      {/* Candidate components */}
      <div style={{ marginTop: 16, display: 'flex', alignItems: 'center', gap: 10 }}>
        <div className="h2" style={{ margin: 0 }}>Candidate components · {c.items.length}</div>
        <span className="caption" style={{ marginLeft: 6 }}>Run sourcing check on any candidate.</span>
        {!isLocked && <button className="btn sm" style={{ marginLeft: 'auto' }} onClick={() => setAddOpen(true)}><Icon name="plus" size={13} />Add component</button>}
      </div>

      {c.items.length === 0 ? (
        <div className="card" style={{ marginTop: 8 }}><EmptyState icon="search" title="No candidates yet."
          sub="Search a part and add it as a candidate to record observations." actions={<button className="btn primary" onClick={() => setAddOpen(true)}><Icon name="plus" size={14} />Add a candidate</button>} /></div>
      ) : (
        <div className="tbl-wrap flow" style={{ marginTop: 8 }}>
          <table className="bom">
            <thead><tr><th style={{ width: 36 }}>#</th><th>MPN</th><th>Manufacturer</th><th>Description</th><th className="num">Qty</th><th>Supplier</th><th>Test note</th><th>Status</th></tr></thead>
            <tbody>
              {c.items.map((i, idx) => (
                <tr key={i.no} className={idx % 2 ? 'alt' : ''}>
                  <td className="num muted">{i.no}</td>
                  <td className="mono" style={{ fontWeight: 600 }}>{i.mpn}</td>
                  <td>{i.mfr}</td>
                  <td className="secondary" style={{ maxWidth: 220 }}>{i.desc}</td>
                  <td className="num">{i.qty}</td>
                  <td>{i.supplier ? <SupplierTag supplier={i.supplier} /> : <span className="muted">—</span>}</td>
                  <td style={{ minWidth: 260 }}>
                    {editingNote === i.no && !isLocked ? (
                      <input className="input" autoFocus value={noteDraft} onChange={e => setNoteDraft(e.target.value)}
                        onBlur={() => { storeActions.setDevItemNote(c.id, i.no, noteDraft); setEditingNote(null); }}
                        onKeyDown={e => { if (e.key === 'Enter') { storeActions.setDevItemNote(c.id, i.no, noteDraft); setEditingNote(null); } if (e.key === 'Escape') setEditingNote(null); }} />
                    ) : (
                      <span className={`cell-editable${isLocked ? '' : ''}`} style={{ cursor: isLocked ? 'default' : 'text' }}
                        onClick={() => { if (!isLocked) { setEditingNote(i.no); setNoteDraft(i.note || ''); } }}>
                        {i.note ? <span style={{ color: 'var(--text-primary)' }}>{i.note}</span> : <span className="muted">Click to add observation…</span>}
                      </span>
                    )}
                  </td>
                  <td><StatusBadge status={i.status} /></td>
                </tr>
              ))}
            </tbody>
          </table>
        </div>
      )}

      {/* Outcome history */}
      <div className="h2" style={{ marginTop: 22 }}>Outcome history</div>
      {(c.outcomes && c.outcomes.length) ? (
        <div className="list" style={{ marginTop: 8 }}>
          {c.outcomes.map(o => {
            const stateBadge = o.state === 'accepted' ? 'accepted' : o.state === 'rejected' ? 'rejected' : 'submitted';
            return (
              <div key={o.id} className="lrow" onClick={() => go(o.kind === 'rework' ? { screen: 'v.reworkDetail', id: o.linkedId } : o.kind === 'firmware' ? { screen: 'v.firmwareDetail', id: o.linkedId } : o.kind === 'investigation-report' ? { screen: 'v.investigationDetail', id: o.linkedId } : { screen: 'v.recommendationDetail', id: o.linkedId })}>
                <div style={{ minWidth: 0 }}>
                  <div className="lr-title" style={{ display: 'flex', alignItems: 'center', gap: 9 }}>
                    <Icon name="send" size={15} style={{ color: 'var(--role-development)' }} />
                    <span>{o.label}</span>
                    <span className="mono caption">{o.linkedId}</span>
                    <StatusBadge status={stateBadge} />
                  </div>
                  <div className="lr-meta">Pushed to <RoleTag role={o.targetRole} /> · {o.when}</div>
                </div>
                <Icon name="chevright" size={16} style={{ color: 'var(--text-muted)' }} />
              </div>
            );
          })}
        </div>
      ) : (
        <div className="comment-empty" style={{ marginTop: 8 }}>No outcomes generated yet. Once your investigation is complete, mark it Ready for Review then push the outcome to the receiving role.</div>
      )}

      {outcomeOpen && <GenerateOutcomeModal collection={c} onClose={() => setOutcomeOpen(false)}
        onDone={(id, meta) => { setOutcomeOpen(false); window.__toast?.(`${meta.label} pushed to ${meta.targetRole} · ${id}`, 'send'); }} />}
      <AddPartDrawer open={addOpen} onClose={() => setAddOpen(false)} collectionId={c.id} kind="development" />
      <div style={{ marginTop: 26 }}><CommentThread entityId={c.id} /></div>
    </div>
  );
}

Object.assign(window, { DevCollectionListScreen, DevCollectionDetail, DC_CATEGORIES, CategoryChip, DevKindGlyph });

</script>
<script type="text/babel" data-source="inline_part_verify.jsx">
/* global React, Icon, SupplierTag, CATALOG, fmtUSD, fmtInt */
/* InlinePartVerify — reusable embedded part lookup.

   Used wherever a user enters a Manufacturer + MPN and needs to verify the part
   WITHOUT leaving the workflow (BOM exception response, Designer collection rejection
   response, Dev Collection candidate entry, Improvement Recommendation, Rework Package).

   Hard rules:
   - Never navigates. Never opens a modal. Never affects scroll position.
   - The result card renders inline beneath the inputs, replacing only the loading state.
   - On Use This Part, calls onConfirm({mpn, mfr, supplier, supplierPn, unit, lifecycle}).
   - View Full Details opens /designer/search?q=<mpn> in a NEW browser tab only.
   - On failure (no result, API down), user-entered data is preserved.

   Props:
     mpn / mfr           — controlled values (parent owns the inputs' text)
     onMpnChange(s)      — fires on every keystroke
     onMfrChange(s)      — fires on every keystroke
     onConfirm(part)     — fires when user clicks Use This Part
     compact             — render side-by-side (for narrow contexts like exception rows)
     scenario            — 'auto' (default) | 'no-match' | 'unavailable' | 'partial'
                            controls the simulated fetch outcome for demo purposes;
                            in production this would just be 'auto'
*/
const { useState: useStateIPV, useRef: useRefIPV, useEffect: useEffIPV } = React;

const IPV_PHASES = [
  { key: 'mouser', label: 'Searching Mouser…' },
  { key: 'digikey', label: 'Searching DigiKey…' },
  { key: 'lifecycle', label: 'Checking lifecycle status…' },
];

/* Simulate the lookup. In production this hits real supplier APIs. */
function ipvSimulate(mpn, scenarioOverride) {
  const key = (mpn || '').trim().toUpperCase();
  const part = CATALOG[key];

  // Allow callers / specific MPNs to force demo scenarios
  let scenario = scenarioOverride || 'auto';
  if (scenario === 'auto') {
    if (key === 'NORESULT' || key === 'NONE' || key === 'XXX') scenario = 'no-match';
    else if (key === 'OFFLINE' || key === 'APIDOWN') scenario = 'unavailable';
    else if (key === 'PARTIAL') scenario = 'partial';
    else scenario = part ? 'found' : 'no-match';
  }
  return { scenario, part };
}

function InlinePartVerify({ mpn, mfr, onMpnChange, onMfrChange, onConfirm, scenario, compact, originalMpn, autoFocusMpn }) {
  // Lookup-state machine — completely independent of parent.
  // null = idle, 'running' = phases playing, anything else = a result mode
  const [phase, setPhase] = useStateIPV(null);     // null | 0 | 1 | 2  during 'running'
  const [running, setRunning] = useStateIPV(false);
  const [result, setResult] = useStateIPV(null);   // {scenario, part}
  const mpnRef = useRefIPV(null);
  const timers = useRefIPV([]);

  // Cleanup outstanding timers on unmount so a parent re-render won't strand them.
  useEffIPV(() => () => timers.current.forEach(clearTimeout), []);
  useEffIPV(() => { if (autoFocusMpn) mpnRef.current?.focus(); }, [autoFocusMpn]);

  const reset = () => {
    timers.current.forEach(clearTimeout); timers.current = [];
    setPhase(null); setRunning(false); setResult(null);
  };

  const run = () => {
    if (!mpn || !mpn.trim()) return;
    reset();
    setRunning(true); setPhase(0);
    // Sequential phases — purely visual; the click never causes a navigation.
    timers.current.push(setTimeout(() => setPhase(1), 380));
    timers.current.push(setTimeout(() => setPhase(2), 760));
    timers.current.push(setTimeout(() => {
      setRunning(false);
      setResult(ipvSimulate(mpn, scenario));
    }, 1180));
  };

  // Edits to MPN after a result has rendered clear the result (so it's not stale).
  // But we DO NOT clear other state — manufacturer text, the rest of the form, etc.
  const handleMpn = (v) => {
    onMpnChange && onMpnChange(v);
    if (result) reset();
  };

  const onKeyDown = (e) => {
    if (e.key === 'Enter' && !running) { e.preventDefault(); run(); }
  };

  // View Full Details opens in a NEW browser tab — the current workflow is preserved.
  const openInNewTab = () => {
    const url = window.location.origin + window.location.pathname + '#/designer/search?q=' + encodeURIComponent(mpn || '');
    window.open(url, '_blank', 'noopener');
  };

  return (
    <div className="ipv">
      {/* Inputs — parent controls values; we never reset them */}
      <div className={`ipv-fields ${compact ? 'compact' : ''}`}>
        <label className="ipv-field">
          <span className="ipv-label">Manufacturer</span>
          <input className="input" placeholder="e.g. Texas Instruments" value={mfr || ''} onChange={e => onMfrChange && onMfrChange(e.target.value)} onKeyDown={onKeyDown} />
        </label>
        <label className="ipv-field">
          <span className="ipv-label">MPN</span>
          <input ref={mpnRef} className="input mono" placeholder="e.g. LMR33630FDDAR" value={mpn || ''} onChange={e => handleMpn(e.target.value)} onKeyDown={onKeyDown} />
        </label>
        <button className="btn primary" disabled={!mpn || !mpn.trim() || running} onClick={run}>
          {running ? <span className="spinner" style={{ width: 14, height: 14 }} /> : <Icon name="check" size={15} />}
          {running ? 'Verifying…' : 'Verify Part'}
        </button>
      </div>

      {/* Loading state — renders inline; everything around stays put */}
      {running && (
        <div className="ipv-card ipv-loading">
          {IPV_PHASES.map((p, i) => {
            const state = i < phase ? 'done' : i === phase ? 'active' : 'pending';
            return (
              <div key={p.key} className={`ipv-phase ${state}`}>
                {state === 'done' ? <Icon name="check" size={14} />
                  : state === 'active' ? <span className="spinner" style={{ width: 12, height: 12 }} />
                    : <Icon name="circle" size={10} />}
                <span>{p.label}</span>
              </div>
            );
          })}
        </div>
      )}

      {/* Result — found */}
      {result && result.scenario === 'found' && (
        <IpvResultFound mpn={mpn} mfr={mfr} part={result.part} onUse={(p) => { onConfirm && onConfirm(p); reset(); }} onAgain={() => { reset(); mpnRef.current?.focus(); }} onView={openInNewTab} originalMpn={originalMpn} />
      )}

      {/* Result — partial: only one supplier responded */}
      {result && result.scenario === 'partial' && result.part && (
        <IpvResultFound mpn={mpn} mfr={mfr} part={{ ...result.part, digikey: null }} partial="digikey"
          onUse={(p) => { onConfirm && onConfirm(p); reset(); }} onAgain={() => { reset(); mpnRef.current?.focus(); }} onView={openInNewTab} originalMpn={originalMpn} />
      )}

      {/* Result — no match */}
      {result && result.scenario === 'no-match' && (
        <div className="ipv-card ipv-empty">
          <div className="ipv-empty-head">
            <Icon name="x" size={16} style={{ color: 'var(--danger)' }} />
            <span>No matching component found for <span className="mono">{mpn}</span>.</span>
          </div>
          <div className="caption" style={{ marginTop: 4 }}>Check the MPN spelling, try a partial MPN, or open advanced search to look more broadly. Your entries above were not cleared.</div>
          <div className="ipv-actions">
            <button className="btn sm" onClick={() => { mpnRef.current?.focus(); mpnRef.current?.select(); }}><Icon name="refresh" size={13} />Edit MPN</button>
            <button className="btn sm" onClick={() => { reset(); mpnRef.current?.focus(); }}>Search Again</button>
            <button className="btn sm ghost" onClick={openInNewTab}><Icon name="external" size={13} />Open Advanced Search</button>
          </div>
        </div>
      )}

      {/* Result — supplier API unavailable */}
      {result && result.scenario === 'unavailable' && (
        <div className="ipv-card ipv-warn">
          <div className="ipv-empty-head">
            <Icon name="alert" size={16} style={{ color: 'var(--warning)' }} />
            <span>Supplier information currently unavailable.</span>
          </div>
          <div className="caption" style={{ marginTop: 4 }}>Mouser and DigiKey both timed out. <strong>Your entries above have been preserved.</strong> You can retry now, or save and resolve this exception later.</div>
          <div className="ipv-actions">
            <button className="btn sm primary" onClick={run}><Icon name="refresh" size={13} />Retry</button>
            <button className="btn sm" onClick={reset}>Save and Continue Later</button>
          </div>
        </div>
      )}
    </div>
  );
}

function IpvResultFound({ mpn, mfr, part, partial, onUse, onAgain, onView, originalMpn }) {
  const isObsolete = part.lifecycle === 'obsolete';
  const recommended = part.recommend;
  const supplier = recommended || (part.mouser ? 'mouser' : 'digikey');
  const off = part[supplier];
  const handleUse = () => onUse({
    mpn: part.mpn, mfr: part.mfr, supplier,
    supplierPn: off?.pn, unit: off?.price, lifecycle: part.lifecycle,
    desc: part.desc,
  });

  return (
    <div className={`ipv-card ipv-result ${isObsolete ? 'eol' : ''}`}>
      <div className="ipv-result-head">
        <Icon name={isObsolete ? 'alert' : 'check'} size={16} style={{ color: isObsolete ? 'var(--danger)' : 'var(--success)' }} />
        <div className="ipv-mpn">
          <span className="mono" style={{ fontWeight: 700 }}>{part.mpn}</span>
          <span className="secondary"> — {part.mfr}</span>
        </div>
        <span className={`badge ${isObsolete ? 'filled' : 'outlined'}`} style={{ color: isObsolete ? '#fff' : 'var(--success)', background: isObsolete ? 'var(--darkred)' : 'transparent', borderColor: isObsolete ? 'var(--darkred)' : 'var(--success)' }}>
          <Icon name={isObsolete ? 'ban' : 'check'} size={11} />
          {isObsolete ? 'OBSOLETE / EOL' : 'ACTIVE'}
        </span>
      </div>
      {part.desc && <div className="caption" style={{ marginLeft: 24, marginTop: 2 }}>{part.desc}</div>}

      <div className="ipv-suppliers">
        {part.mouser ? (
          <IpvSupplierLine supplier="mouser" off={part.mouser} recommended={recommended === 'mouser'} />
        ) : (
          <IpvSupplierLine supplier="mouser" unavailable />
        )}
        {part.digikey ? (
          <IpvSupplierLine supplier="digikey" off={part.digikey} recommended={recommended === 'digikey'} />
        ) : (
          <IpvSupplierLine supplier="digikey" unavailable={partial === 'digikey'} />
        )}
      </div>

      {recommended && <div className="ipv-recommended">Recommended: <SupplierTag supplier={recommended} /></div>}
      {isObsolete && <div className="caption" style={{ marginTop: 6, color: 'var(--danger)' }}>This part is end-of-life. Not recommended as a replacement for a production BOM.</div>}
      {originalMpn && part.mpn === originalMpn && <div className="caption" style={{ marginTop: 6, color: 'var(--warning)' }}>⚠ This is the same MPN that was flagged. Pick a different replacement.</div>}

      <div className="ipv-actions">
        <button className="btn primary sm" disabled={isObsolete || (originalMpn && part.mpn === originalMpn)} onClick={handleUse}><Icon name="check" size={13} />Use This Part</button>
        <button className="btn sm" onClick={onAgain}><Icon name="refresh" size={13} />Search Again</button>
        <button className="btn sm ghost" onClick={onView}><Icon name="external" size={13} />View Full Details</button>
      </div>
    </div>
  );
}

function IpvSupplierLine({ supplier, off, recommended, unavailable }) {
  if (unavailable) return (
    <div className="ipv-sup ipv-sup-unavail">
      <SupplierTag supplier={supplier} />
      <span className="muted" style={{ marginLeft: 'auto' }}>Unavailable — retry later</span>
    </div>
  );
  const zero = off.stock === 0;
  return (
    <div className={`ipv-sup ${recommended ? 'rec' : ''}`}>
      <SupplierTag supplier={supplier} />
      <span className="ipv-stock" style={{ color: zero ? 'var(--danger)' : 'var(--success)', fontWeight: 600 }}>{zero ? '0 — no stock' : fmtInt(off.stock) + ' in stock'}</span>
      <span className="ipv-price mono">{off.price ? fmtUSD(off.price) : '—'}</span>
      <span className="ipv-pn mono caption">{off.pn}</span>
      {recommended && <span className="ipv-rec-flag">Recommended</span>}
    </div>
  );
}

Object.assign(window, { InlinePartVerify });

</script>
<script type="text/babel" data-source="pushback_resolve.jsx">
/* global React, Icon, SupplierTag, StatusBadge, Banner, EmptyState, useStore, storeActions, getState, CATALOG, PROJECTS, fmtUSD, fmtInt */
/* AutoBOM — Push-Back resolution (v4).
   Replaces the old manual InlinePartVerify flow. Designer resolves each flagged line
   (or a missing-component request) through a UNIFIED characteristic search running in
   `search_suppliers` mode (Mouser/DigiKey primary, PartsBox wall overlay behind a toggle).
   Designer's picks are RECOMMENDATIONS — Production applies them from their own Dashboard.

   Exports:
     PushbackReplaceLine   — one flagged line / added-component search widget
     PushbackResolvePanel  — the whole per-Push-Back resolution surface (dashboard-inline)
     REASON_META / URGENCY_META / PushbackBadges
*/
const { useState: usePR, useMemo: useMemoPR, useRef: useRefPR } = React;

/* ---- enums ---- */
const REASON_META = {
  obsolete:            { label: 'Obsolete', color: 'var(--danger)' },
  eol:                 { label: 'EOL', color: 'var(--danger)' },
  unsourceable:        { label: 'Unsourceable', color: 'var(--warning)' },
  'zero-stock':        { label: 'Zero stock', color: 'var(--warning)' },
  'missing-component': { label: 'Missing component', color: 'var(--action)' },
  other:               { label: 'Other', color: 'var(--text-muted)' },
};
const URGENCY_META = {
  blocking: { label: 'Blocking', color: 'var(--danger)' },
  standard: { label: 'Standard', color: 'var(--text-muted)' },
};
function PushbackBadges({ reason, urgency }) {
  const r = REASON_META[reason] || REASON_META.other;
  const u = URGENCY_META[urgency] || URGENCY_META.standard;
  return (
    <span style={{ display: 'inline-flex', gap: 6, alignItems: 'center' }}>
      <span className="badge outlined" style={{ color: r.color, borderColor: r.color }}>{r.label}</span>
      <span className="badge outlined" style={{ color: u.color, borderColor: u.color }}>{u.label === 'Blocking' ? '⏻ Blocking' : u.label}</span>
    </span>
  );
}

/* ---- characteristic model (mock of the sourcing engine's parametric extraction) ---- */
function parseChars(descOrObj) {
  if (descOrObj && typeof descOrObj === 'object') return descOrObj;
  const d = String(descOrObj || '');
  const pkg = (d.match(/\b(0201|0402|0603|0805|1206|1210|2010|2512|SOT-?\d+\w*|SOIC-?\d+|SO-?8|TO-?\d+\w*|QFN-?\d+|LQFP-?\d+|DFN-?\d+|TSSOP-?\d+|PowerPAD)\b/i) || [])[1] || null;
  const value = (d.match(/(\d+(?:\.\d+)?\s?(?:pF|nF|µF|uF|F|mΩ|kΩ|MΩ|Ω|Ohm|µH|uH|mH|A|MHz))/i) || [])[1] || null;
  const voltage = (d.match(/(\d+(?:\.\d+)?)\s?V\b/i) || [])[1] || null;
  const tolerance = (d.match(/±?\s?(\d+(?:\.\d+)?)\s?%/) || [])[1] || null;
  return { package: pkg, value, voltage: voltage ? voltage + 'V' : null, tolerance: tolerance ? tolerance + '%' : null };
}
const CHAR_LABEL = { package: 'Package', value: 'Value', voltage: 'Voltage', tolerance: 'Tolerance' };
/* Verdict per characteristic: match | improves | differs | unknown */
function compareChar(key, src, cand) {
  if (!src || !cand) return 'unknown';
  const n = (x) => parseFloat(String(x).replace(/[^0-9.]/g, ''));
  if (String(src).toLowerCase() === String(cand).toLowerCase()) return 'match';
  if (key === 'voltage') return n(cand) > n(src) ? 'improves' : 'differs';
  if (key === 'tolerance') return n(cand) < n(src) ? 'improves' : 'differs';
  return 'differs';
}
const VERDICT_META = {
  match:    { label: 'matches', color: 'var(--success)', icon: 'check' },
  improves: { label: 'improves', color: 'var(--success)', icon: 'arrow' },
  differs:  { label: 'differs', color: 'var(--danger)', icon: 'alert' },
  unknown:  { label: '—', color: 'var(--text-muted)', icon: 'circle' },
};

/* Mock datasheet URL — the sourcing engine returns one for most catalog parts. */
function datasheetUrl(mpn) { return mpn ? `https://www.mouser.com/datasheet/${encodeURIComponent(mpn)}.pdf` : null; }

/* ---- search_suppliers mode: supplier-primary, PartsBox wall as overlay ---- */
function searchSuppliers(query, chars, includeWall) {
  const q = (query || '').trim().toLowerCase();
  const supplier = [];
  for (const c of Object.values(CATALOG)) {
    const hay = `${c.mpn} ${c.mfr} ${c.desc}`.toLowerCase();
    const match = q ? hay.includes(q) : true; // no query → characteristic-only browse
    if (!match) continue;
    supplier.push({
      section: 'supplier', mpn: c.mpn, mfr: c.mfr, desc: c.desc, lifecycle: c.lifecycle, recommend: c.recommend,
      mouser: c.mouser, digikey: c.digikey, chars: parseChars(c.desc), datasheet: datasheetUrl(c.mpn),
    });
  }
  let wall = [];
  if (includeWall) {
    const inv = getState().inventory || [];
    for (const p of inv) {
      const hay = `${p.mpn} ${p.desc || ''}`.toLowerCase();
      if (q && !hay.includes(q)) continue;
      const loc = (p.locations || []).find(l => l.kind === 'wall') || (p.locations || [])[0];
      if (!loc) continue;
      wall.push({ section: 'wall', mpn: p.mpn, mfr: p.mfr || '', desc: p.desc, onHand: p.onHand, location: loc.name, chars: parseChars(p.desc), datasheet: null });
    }
    wall = wall.slice(0, 20);
  }
  return { supplier: supplier.slice(0, 30), wall };
}

/* Distinct manufacturers (for the bidirectional typeahead) */
function allManufacturers() { return [...new Set(Object.values(CATALOG).map(c => c.mfr))].sort(); }

/* ============================================================
   PushbackReplaceLine — one flagged line, or a missing-component request.
   Unified surface: MPN input + bidirectional Manufacturer typeahead + characteristic
   filters (AND-combined), Include-wall toggle, comparison-annotated result cards.
   ============================================================ */
function PushbackReplaceLine({ flaggedPart, addedComponentRequest, picked, onSelectCandidate, onClear }) {
  const isMissing = !!addedComponentRequest;
  const sourceChars = useMemoPR(() => isMissing
    ? parseChars(addedComponentRequest.characteristics || addedComponentRequest.description || '')
    : parseChars((CATALOG[flaggedPart?.mpn]?.desc) || flaggedPart?.desc || ''), [flaggedPart, addedComponentRequest]);

  const [mpn, setMpn] = usePR(isMissing ? (addedComponentRequest.mpn || '') : '');
  const [mfr, setMfr] = usePR('');
  const [chars, setChars] = usePR(sourceChars);           // refinable characteristic filters
  const [includeWall, setIncludeWall] = usePR(false);
  const [mfrOpen, setMfrOpen] = usePR(false);

  // Bidirectional constraint: manufacturers filtered by the current MPN text.
  const mfrOptions = useMemoPR(() => {
    const base = allManufacturers();
    if (!mpn.trim()) return base;
    const ql = mpn.trim().toLowerCase();
    const constrained = [...new Set(Object.values(CATALOG).filter(c => `${c.mpn} ${c.desc}`.toLowerCase().includes(ql)).map(c => c.mfr))];
    return constrained.length ? constrained.sort() : base;
  }, [mpn]);

  // Results: MPN text AND characteristic filters, constrained by selected manufacturer.
  const results = useMemoPR(() => {
    const { supplier, wall } = searchSuppliers(mpn, chars, includeWall);
    const byMfr = (arr) => mfr ? arr.filter(r => (r.mfr || '').toLowerCase() === mfr.toLowerCase()) : arr;
    return { supplier: byMfr(supplier), wall };
  }, [mpn, mfr, chars, includeWall]);

  if (picked) {
    return (
      <div className="pbrl picked">
        <div className="pbrl-picked-row">
          <Icon name="check" size={16} style={{ color: 'var(--success)' }} />
          <div style={{ flex: 1, minWidth: 0 }}>
            <span className="mono" style={{ fontWeight: 700 }}>{picked.mpn}</span> <span className="secondary">— {picked.mfr || '—'}</span>
            <div className="caption">{picked.section === 'wall' ? `Recommend from wall · ${picked.location}` : 'Supplier recommendation'}{picked.datasheet ? ' · datasheet queued for PartsBox' : ''}</div>
          </div>
          <button className="btn sm" onClick={onClear}><Icon name="refresh" size={13} />Change</button>
        </div>
      </div>
    );
  }

  const charChips = ['package', 'value', 'voltage', 'tolerance'].filter(k => chars[k]);

  return (
    <div className="pbrl">
      <div className="pbrl-fields">
        <label className="ipv-field">
          <span className="ipv-label">MPN {isMissing ? '(if known)' : ''}</span>
          <input className="input mono" placeholder="smart-match MPN…" value={mpn} onChange={e => setMpn(e.target.value)} />
        </label>
        <label className="ipv-field" style={{ position: 'relative' }}>
          <span className="ipv-label">Manufacturer</span>
          <input className="input" placeholder="constrained typeahead…" value={mfr}
            onChange={e => { setMfr(e.target.value); setMfrOpen(true); }} onFocus={() => setMfrOpen(true)}
            onBlur={() => setTimeout(() => setMfrOpen(false), 150)} />
          {mfrOpen && (
            <div className="pbrl-typeahead">
              {mfr && <div className="mi" onMouseDown={() => { setMfr(''); }}><Icon name="x" size={12} />Any manufacturer</div>}
              {mfrOptions.filter(m => !mfr || m.toLowerCase().includes(mfr.toLowerCase())).slice(0, 8).map(m => (
                <div key={m} className="mi" onMouseDown={() => { setMfr(m); setMfrOpen(false); }}>{m}</div>
              ))}
            </div>
          )}
        </label>
      </div>

      <div className="pbrl-charbar">
        <span className="caption" style={{ fontWeight: 600 }}>Characteristics</span>
        {charChips.length === 0 && <span className="caption">none extracted — search by MPN</span>}
        {charChips.map(k => (
          <span key={k} className="char-chip">{CHAR_LABEL[k]}: <strong>{chars[k]}</strong>
            <button className="char-x" onClick={() => setChars(c => ({ ...c, [k]: null }))} title="Remove filter">×</button>
          </span>
        ))}
        <label className="pbrl-wall">
          <input type="checkbox" checked={includeWall} onChange={e => setIncludeWall(e.target.checked)} /> Include wall
        </label>
      </div>

      <div className="pbrl-results">
        <div className="pbrl-sec-head"><SupplierTag supplier="mouser" /><SupplierTag supplier="digikey" /><span className="caption">Available from suppliers · {results.supplier.length}</span></div>
        {results.supplier.length === 0 ? <div className="caption" style={{ padding: '6px 0' }}>No supplier matches — refine the MPN or characteristics.</div>
          : results.supplier.slice(0, 6).map(r => <CandidateCard key={'s' + r.mpn} cand={r} sourceChars={isMissing ? sourceChars : parseChars((CATALOG[flaggedPart?.mpn]?.desc) || flaggedPart?.desc)} onRecommend={() => onSelectCandidate(r)} />)}
        {includeWall && (
          <>
            <div className="pbrl-sec-head" style={{ marginTop: 10 }}><span className={'loc-chip development'}>wall</span><span className="caption">On the development wall · {results.wall.length} — both sections shown, never deduped</span></div>
            {results.wall.length === 0 ? <div className="caption" style={{ padding: '6px 0' }}>No wall matches.</div>
              : results.wall.slice(0, 5).map(r => <CandidateCard key={'w' + r.mpn} cand={r} sourceChars={sourceChars} onRecommend={() => onSelectCandidate(r)} />)}
          </>
        )}
      </div>
    </div>
  );
}

function CandidateCard({ cand, sourceChars, onRecommend }) {
  const eol = cand.lifecycle === 'obsolete';
  const off = cand.recommend ? cand[cand.recommend] : (cand.mouser || cand.digikey);
  const keys = ['package', 'value', 'voltage', 'tolerance'].filter(k => sourceChars && sourceChars[k]);
  return (
    <div className={`cand-card${eol ? ' eol' : ''}`}>
      <div className="cand-head">
        <div style={{ minWidth: 0, flex: 1 }}>
          <span className="mono" style={{ fontWeight: 700 }}>{cand.mpn}</span> <span className="secondary">{cand.mfr}</span>
          {eol && <span className="badge filled" style={{ background: 'var(--darkred)', marginLeft: 8 }}><Icon name="ban" size={11} />EOL</span>}
          <div className="caption" style={{ marginTop: 1 }}>{cand.desc}</div>
        </div>
        <button className="btn sm primary" disabled={eol} onClick={onRecommend}>
          <Icon name="check" size={13} />{cand.section === 'wall' ? `Recommend from wall · ${cand.location}` : 'Recommend this replacement'}
        </button>
      </div>
      {keys.length > 0 && (
        <div className="cand-chars">
          {keys.map(k => {
            const v = compareChar(k, sourceChars[k], cand.chars[k]);
            const m = VERDICT_META[v];
            return <span key={k} className="cand-char" style={{ color: m.color }}><Icon name={m.icon} size={11} />{CHAR_LABEL[k]} {cand.chars[k] || '?'} · {m.label}</span>;
          })}
        </div>
      )}
      <div className="cand-foot">
        {cand.section === 'wall'
          ? <span className="caption">{cand.onHand} on hand · {cand.location}</span>
          : <span className="caption">{off ? `${fmtInt(off.stock)} in stock · ${fmtUSD(off.price)}` : 'stock —'}</span>}
        {cand.datasheet
          ? <a className="caption" href={cand.datasheet} target="_blank" rel="noopener noreferrer" style={{ marginLeft: 'auto', color: 'var(--action)' }}><Icon name="external" size={12} /> Datasheet</a>
          : <span className="caption" style={{ marginLeft: 'auto' }}>No datasheet</span>}
      </div>
    </div>
  );
}

/* ============================================================
   PushbackResolvePanel — Designer's inline resolution surface.
   Iterates flagged lines (+ a missing-component request), collects RECOMMENDATIONS,
   and submits them for Production to apply. Never mutates the master BOM.
   Secondary paths: comment (per Push-Back thread), defer, reassign.
   ============================================================ */
function PushbackResolvePanel({ bom, go, close }) {
  const pb = bom.pushback || {};
  const flagged = (pb.flaggedLines && pb.flaggedLines.length)
    ? pb.flaggedLines.map(fl => ({ ...fl, part: bom.items.find(i => i.no === fl.lineNo) || { no: fl.lineNo, mpn: '(line ' + fl.lineNo + ')' } }))
    : bom.items.filter(i => i.status === 'needs-review' || i.status === 'exception').map(i => ({ lineNo: i.no, exReason: i.exReason, part: i }));
  const added = pb.addedComponentRequest || null;

  const [picks, setPicks] = usePR({});          // key -> candidate  (key = 'L<lineNo>' or 'ADD')
  const [note, setNote] = usePR('');
  const [secondary, setSecondary] = usePR(null); // 'comment' | 'defer' | 'reassign'
  const [sent, setSent] = usePR(false);

  const totalSlots = flagged.length + (added ? 1 : 0);
  const doneCount = Object.keys(picks).length;
  const allDone = doneCount >= totalSlots && totalSlots > 0;

  const setPick = (key, cand) => setPicks(p => ({ ...p, [key]: cand }));
  const clearPick = (key) => setPicks(p => { const n = { ...p }; delete n[key]; return n; });

  const submit = () => {
    const recommendations = [];
    flagged.forEach(fl => { const c = picks['L' + fl.lineNo]; if (c) recommendations.push({ lineNo: fl.lineNo, candidate: c }); });
    if (added && picks['ADD']) recommendations.push({ added: true, candidate: picks['ADD'], request: added });
    storeActions.resolvePushback(bom.id, { recommendations, note });
    setSent(true);
  };

  if (sent) return (
    <div className="na-phase" style={{ color: 'var(--success)' }}>
      <Icon name="check" size={15} />Recommendations sent to Production. They'll review and Apply them to the master BOM — the BOM isn't changed until they do.
    </div>
  );

  return (
    <div className="na-exp-body pb-resolve">
      <div className="caption" style={{ marginBottom: 8, display: 'flex', gap: 10, alignItems: 'center', flexWrap: 'wrap' }}>
        <PushbackBadges reason={pb.reason} urgency={pb.urgency} />
        <span>Pick a replacement per line via characteristic search. Your picks are <strong>recommendations</strong> — Production applies them.</span>
      </div>

      {flagged.map(fl => (
        <div key={fl.lineNo} className="pb-line">
          <div className="pb-line-head">
            <span className="mono" style={{ fontWeight: 600 }}>Line {fl.lineNo} · {fl.part.mpn}</span>
            <span className="caption">· {fl.exReason || 'Needs engineering review'}</span>
          </div>
          <PushbackReplaceLine flaggedPart={fl.part} picked={picks['L' + fl.lineNo]}
            onSelectCandidate={(c) => { storeActions.attachDatasheet(c.mpn, c.datasheet); setPick('L' + fl.lineNo, c); }}
            onClear={() => clearPick('L' + fl.lineNo)} />
        </div>
      ))}

      {added && (
        <div className="pb-line missing">
          <div className="pb-line-head">
            <span className="badge outlined" style={{ color: 'var(--action)', borderColor: 'var(--action)' }}>MISSING COMPONENT</span>
            <span className="caption">{added.description}{added.designator ? ` · ${added.designator}` : ''}{added.quantityPerBoard ? ` · qty/board ${added.quantityPerBoard}` : ''}</span>
          </div>
          <div className="caption" style={{ margin: '2px 0 6px' }}>No source line to compare — recommend a new component to add to the master BOM.</div>
          <PushbackReplaceLine addedComponentRequest={added} picked={picks['ADD']}
            onSelectCandidate={(c) => { storeActions.attachDatasheet(c.mpn, c.datasheet); setPick('ADD', c); }}
            onClear={() => clearPick('ADD')} />
        </div>
      )}

      {secondary === 'comment' && <SecondaryBox label="Comment to Production (adds to the Push-Back thread)" confirm="Post comment"
        onCancel={() => setSecondary(null)} onConfirm={(t) => { storeActions.commentPushback(bom.id, t); setSecondary(null); }} />}
      {secondary === 'defer' && <SecondaryBox label="Reason for deferring this Push-Back" confirm="Defer"
        onCancel={() => setSecondary(null)} onConfirm={(t) => { storeActions.deferPushback(bom.id, t); setSecondary(null); close && close(); }} />}
      {secondary === 'reassign' && <SecondaryBox label="Note for the Designer you're reassigning to" confirm="Reassign"
        onCancel={() => setSecondary(null)} onConfirm={(t) => { storeActions.reassignPushback(bom.id, t); setSecondary(null); close && close(); }} />}

      <textarea className="input" style={{ marginTop: 10, minHeight: 48 }} placeholder="Optional note to Production…" value={note} onChange={e => setNote(e.target.value)} />

      <div className="na-confirm" style={{ marginTop: 10, flexWrap: 'wrap', gap: 8 }}>
        <div style={{ display: 'flex', gap: 6 }}>
          <button className="btn sm ghost" onClick={() => setSecondary(s => s === 'comment' ? null : 'comment')}><Icon name="comment" size={13} />Comment</button>
          <button className="btn sm ghost" onClick={() => setSecondary(s => s === 'defer' ? null : 'defer')}><Icon name="clock" size={13} />Defer</button>
          <button className="btn sm ghost" onClick={() => setSecondary(s => s === 'reassign' ? null : 'reassign')}><Icon name="arrow" size={13} />Reassign</button>
        </div>
        <div style={{ display: 'flex', gap: 8, marginLeft: 'auto', alignItems: 'center' }}>
          <span className="caption">{doneCount}/{totalSlots} recommended</span>
          <button className="btn sm ghost" onClick={close}>Cancel</button>
          <button className="btn sm primary" disabled={!allDone} onClick={submit}><Icon name="send" size={13} />Send recommendations to Production</button>
        </div>
      </div>
    </div>
  );
}

function SecondaryBox({ label, confirm, onCancel, onConfirm }) {
  const [t, setT] = usePR('');
  return (
    <div className="card" style={{ padding: 10, marginTop: 8, background: 'var(--bg-raised)' }}>
      <div className="caption" style={{ marginBottom: 4 }}>{label}</div>
      <textarea className="input" style={{ minHeight: 44 }} value={t} onChange={e => setT(e.target.value)} autoFocus />
      <div style={{ display: 'flex', gap: 8, justifyContent: 'flex-end', marginTop: 6 }}>
        <button className="btn sm ghost" onClick={onCancel}>Cancel</button>
        <button className="btn sm primary" disabled={!t.trim()} onClick={() => onConfirm(t.trim())}>{confirm}</button>
      </div>
    </div>
  );
}

/* Characteristic-match check (Production inline-edit). Returns { ok, unknown, diffs, candMfr, candChars }.
   Match rule: package + nominal value must match; voltage equal-or-higher; tolerance equal-or-tighter. */
function characteristicMatch(sourceDesc, candMpn) {
  const src = parseChars(sourceDesc);
  const cand = CATALOG[candMpn];
  if (!cand) return { ok: false, unknown: true, diffs: ['not found at suppliers — verify manually'], candMfr: null, candChars: null };
  const cch = parseChars(cand.desc);
  const diffs = [];
  ['package', 'value'].forEach(k => { if (src[k] && cch[k] && String(src[k]).toLowerCase() !== String(cch[k]).toLowerCase()) diffs.push(CHAR_LABEL[k]); });
  ['voltage', 'tolerance'].forEach(k => { if (src[k] && cch[k] && compareChar(k, src[k], cch[k]) === 'differs') diffs.push(CHAR_LABEL[k]); });
  return { ok: diffs.length === 0, unknown: false, diffs, candMfr: cand.mfr, candChars: cch, lifecycle: cand.lifecycle };
}

Object.assign(window, { PushbackReplaceLine, PushbackResolvePanel, PushbackBadges, REASON_META, URGENCY_META, parseChars, characteristicMatch });

</script>
<script type="text/babel" data-source="screen_addons.jsx">
/* global React, Icon, SupplierTag, ROLE, ROLE_META, Banner, EmptyState,
   useStore, storeActions, getState, CATALOG, PROJECTS, fmtUSD, fmtInt */
/* AutoBOM — shared interactive components used across multiple screens.
   - <CommentThread entityId>      Persistent comment surface for any object.
   - <NewCollectionModal>          Create-collection modal (designer or development kind).
   - <AddPartDrawer>               In-page drawer to add a part to a collection without navigating.
   These are all store-backed and update the global workflow state. */
const { useState: useStateAddons, useRef: useRefAddons, useEffect: useEffAddons } = React;

/* =========================================================
   CommentThread — every commentable object uses this.
   ========================================================= */
function CommentThread({ entityId, title = 'Comments', emptyHint = 'Comments on this record are a permanent part of the audit trail. They replace email threads and chat messages that would otherwise carry engineering decisions.' }) {
  const comments = useStore(s => s.comments[entityId] || []);
  const activeRole = useStore(s => s.activeRole);
  const me = useStore(s => s.users.find(u => u.id === s.currentUserId));
  const [body, setBody] = useStateAddons('');
  const tRef = useRefAddons(null);

  const submit = () => {
    const t = body.trim(); if (!t) return;
    storeActions.addComment(entityId, t);
    setBody('');
    requestAnimationFrame(() => tRef.current?.focus());
  };

  return (
    <section className="comments" aria-label={title}>
      <header className="comments-head">
        <Icon name="comment" size={16} />
        <h3 className="h2" style={{ margin: 0, fontSize: 15 }}>{title}</h3>
        <span className="caption" style={{ marginLeft: 'auto' }}>{comments.length} comment{comments.length === 1 ? '' : 's'}</span>
      </header>

      {comments.length === 0 ? (
        <div className="comments-empty">
          <Icon name="comment" size={18} />
          <div style={{ fontWeight: 600, marginTop: 5 }}>No comments yet.</div>
          <div className="caption" style={{ marginTop: 4, maxWidth: 460, marginLeft: 'auto', marginRight: 'auto' }}>{emptyHint}</div>
        </div>
      ) : (
        <ol className="comment-list">
          {comments.map(c => {
            const accent = (ROLE_META && ROLE_META[c.role]?.color) || (ROLE && ROLE[c.role]?.color) || 'var(--text-secondary)';
            const initials = c.name.split(' ').map(w => w[0]).slice(0, 2).join('');
            return (
              <li key={c.id} className="comment-item">
                {/* Avatar column — leaves room for future reply-indent rail. */}
                <div className="comment-rail">
                  <span className="avatar" style={{ background: accent, width: 28, height: 28, fontSize: 11 }}>{initials}</span>
                </div>
                <div className="comment-body">
                  <div className="comment-meta">
                    <span style={{ fontWeight: 600 }}>{c.name}</span>
                    <span className="tag" style={{ background: accent, color: '#fff' }}>{(c.role || '').toUpperCase()}</span>
                    <span className="caption" style={{ marginLeft: 'auto' }}>{c.when}</span>
                  </div>
                  <div className="comment-text">{c.body}</div>
                  {/* Reply hook reserved for future — visually leaves space without active control. */}
                </div>
              </li>
            );
          })}
        </ol>
      )}

      <div className="comment-composer">
        <span className="avatar" style={{ background: (ROLE_META && ROLE_META[activeRole]?.color) || 'var(--text-secondary)', width: 28, height: 28, fontSize: 11, flex: 'none' }}>
          {(me?.name || 'You').split(' ').map(w => w[0]).slice(0, 2).join('')}
        </span>
        <div style={{ flex: 1, minWidth: 0 }}>
          <textarea ref={tRef} className="textarea" rows={2} placeholder={`Add a comment as ${me?.name || 'you'} (${(activeRole || '').toUpperCase()})…`}
            value={body} onChange={e => setBody(e.target.value)}
            onKeyDown={e => { if ((e.metaKey || e.ctrlKey) && e.key === 'Enter') submit(); }} />
          <div className="comment-composer-row">
            <span className="caption">⌘↩ to post · saved with your name, role, and timestamp.</span>
            <button className="btn primary sm" disabled={!body.trim()} onClick={submit}><Icon name="send" size={13} />Post comment</button>
          </div>
        </div>
      </div>
    </section>
  );
}

/* =========================================================
   NewCollectionModal — designer + development variants.
   ========================================================= */
const DESIGNER_CATEGORIES = ['R&D', 'Prototype', 'Production Prep', 'Other'];
const DEV_CATEGORIES = ['Investigation', 'Testing', 'Validation', 'Rework', 'Reliability', 'Firmware', 'Hardware', 'Cost Reduction', 'Future Revision', 'Supplier Evaluation'];

function NewCollectionModal({ kind = 'designer', defaultProgram, onClose, onCreated }) {
  const programs = useStore(s => s.programs || []);
  const me = useStore(s => s.users.find(u => u.id === s.currentUserId));
  const boms = useStore(s => s.boms);

  const cats = kind === 'development' ? DEV_CATEGORIES : DESIGNER_CATEGORIES;
  const isDev = kind === 'development';

  const [name, setName] = useStateAddons('');
  const [program, setProgram] = useStateAddons(defaultProgram || programs[0]?.id || '');
  const [desc, setDesc] = useStateAddons('');
  const [category, setCategory] = useStateAddons(cats[0]);
  const [notes, setNotes] = useStateAddons('');
  const [showOptional, setShowOptional] = useStateAddons(false);
  const [tags, setTags] = useStateAddons('');
  const [priority, setPriority] = useStateAddons('');
  const [relatedBom, setRelatedBom] = useStateAddons('');
  const nameRef = useRefAddons(null);

  useEffAddons(() => { nameRef.current?.focus(); }, []);
  // Esc closes; outside-scrim click closes via Modal wrap.
  useEffAddons(() => {
    const k = (e) => { if (e.key === 'Escape') onClose(); };
    document.addEventListener('keydown', k); return () => document.removeEventListener('keydown', k);
  }, [onClose]);

  const valid = name.trim().length > 1 && program && (!isDev || category);

  const submit = () => {
    if (!valid) return;
    const id = storeActions.createCollection({
      kind, name, program_id: program, category: isDev ? category : null, desc, notes,
      tags: tags.split(',').map(s => s.trim()).filter(Boolean),
      priority: priority || null,
      relatedBom: relatedBom || null,
    });
    onCreated && onCreated(id);
  };

  const accent = isDev ? 'var(--role-development, #059669)' : 'var(--role-designer, #7C3AED)';

  return (
    <>
      <div className="scrim" onMouseDown={onClose} />
      <div className="modal-wrap" onMouseDown={(e) => { if (e.target === e.currentTarget) onClose(); }}>
        <div className="modal" style={{ width: 560, maxWidth: '95vw' }} onMouseDown={(e) => e.stopPropagation()}>
          <div className="modal-head" style={{ borderTop: `3px solid ${accent}` }}>
            <div style={{ display: 'flex', alignItems: 'center', gap: 9 }}>
              <Icon name="layers" size={18} style={{ color: accent }} />
              <div className="mh-title">New {isDev ? 'Development' : 'Designer'} Collection</div>
              <button className="icon-btn" style={{ marginLeft: 'auto', width: 30, height: 30 }} onClick={onClose}><Icon name="x" size={16} /></button>
            </div>
            <div className="caption" style={{ marginTop: 4 }}>
              {isDev ? 'A workspace for investigations, testing, and product improvements.' : 'A workspace for engineering research — parts you\'re investigating before they reach a BOM.'}
            </div>
          </div>

          <div className="modal-body" style={{ display: 'grid', gap: 12 }}>
            <label className="field">
              <span className="fl">Collection name<span style={{ color: 'var(--danger)' }}> *</span></span>
              <input ref={nameRef} className="input" placeholder={isDev ? 'e.g. Alternative Capacitor Testing' : 'e.g. TVCA Connector Research'} value={name} onChange={e => setName(e.target.value)} onKeyDown={e => { if (e.key === 'Enter' && valid) submit(); }} />
            </label>

            {isDev ? (
              <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: 12 }}>
                <label className="field">
                  <span className="fl">Program<span style={{ color: 'var(--danger)' }}> *</span></span>
                  <select className="select" value={program} onChange={e => setProgram(e.target.value)}>
                    {programs.map(p => <option key={p.id} value={p.id}>{(p.identifier || p.code)} · {p.name}</option>)}
                  </select>
                </label>
                <label className="field">
                  <span className="fl">Category<span style={{ color: 'var(--danger)' }}> *</span></span>
                  <select className="select" value={category} onChange={e => setCategory(e.target.value)}>
                    {cats.map(c => <option key={c} value={c}>{c}</option>)}
                  </select>
                </label>
              </div>
            ) : (
              <label className="field">
                <span className="fl">Program<span style={{ color: 'var(--danger)' }}> *</span></span>
                <select className="select" value={program} onChange={e => setProgram(e.target.value)}>
                  {programs.map(p => <option key={p.id} value={p.id}>{(p.identifier || p.code)} · {p.name}</option>)}
                </select>
              </label>
            )}

            <label className="field">
              <span className="fl">Description</span>
              <textarea className="textarea" rows={2} placeholder={isDev ? 'What are you investigating and why?' : 'What are you researching here?'} value={desc} onChange={e => setDesc(e.target.value)} />
            </label>

            <label className="field">
              <span className="fl">Notes <span className="muted">(optional)</span></span>
              <textarea className="textarea" rows={2} placeholder="Initial observations, hypotheses, anything you want to capture before parts are added." value={notes} onChange={e => setNotes(e.target.value)} />
            </label>

            <div className="field" style={{ marginTop: -2 }}>
              <span className="fl">Owner</span>
              <div className="input" style={{ display: 'flex', alignItems: 'center', gap: 9, color: 'var(--text-secondary)' }}>
                <span className="avatar" style={{ background: accent, width: 22, height: 22, fontSize: 10 }}>{(me?.name || 'You').split(' ').map(w => w[0]).slice(0, 2).join('')}</span>
                <span>{me?.name || 'You'}</span>
                <span className="caption" style={{ marginLeft: 'auto' }}>Defaults to current user — Admin can reassign later.</span>
              </div>
            </div>

            <button className="btn-link" style={{ alignSelf: 'flex-start', padding: 0 }} onClick={() => setShowOptional(s => !s)}>
              <Icon name={showOptional ? 'chevdown' : 'chevright'} size={13} />{showOptional ? 'Hide' : 'Show'} optional fields (tags, priority, related work)
            </button>

            {showOptional && (
              <div style={{ display: 'grid', gap: 10, padding: 12, border: '1px dashed var(--border)', borderRadius: 8, background: 'var(--bg-raised)' }}>
                <div style={{ display: 'grid', gridTemplateColumns: '2fr 1fr', gap: 10 }}>
                  <label className="field"><span className="fl">Tags</span>
                    <input className="input" placeholder="comma, separated, tags" value={tags} onChange={e => setTags(e.target.value)} />
                  </label>
                  <label className="field"><span className="fl">Priority</span>
                    <select className="select" value={priority} onChange={e => setPriority(e.target.value)}>
                      <option value="">—</option><option value="low">Low</option><option value="medium">Medium</option><option value="high">High</option>
                    </select>
                  </label>
                </div>
                <label className="field"><span className="fl">Related {isDev ? 'BOM' : 'BOM'} <span className="muted">(optional)</span></span>
                  <select className="select" value={relatedBom} onChange={e => setRelatedBom(e.target.value)}>
                    <option value="">—</option>
                    {boms.map(b => <option key={b.id} value={b.id}>{b.id} · {b.name}</option>)}
                  </select>
                </label>
              </div>
            )}
          </div>

          <div className="modal-foot">
            <button className="btn ghost" onClick={onClose}>Cancel</button>
            <button className="btn primary" disabled={!valid} onClick={submit}>
              <Icon name="check" size={14} />Create collection
            </button>
          </div>
        </div>
      </div>
    </>
  );
}

/* =========================================================
   AddPartDrawer — inline part lookup, never navigates the page.
   Pattern parallels <InlinePartVerify> but adapted for adding parts
   (search by MPN/manufacturer/keyword, set qty + per-item notes, confirm).
   ========================================================= */
function searchCatalog(q) {
  const s = (q || '').trim().toLowerCase();
  if (!s) return [];
  return Object.values(CATALOG).filter(c =>
    c.mpn.toLowerCase().includes(s) || c.mfr.toLowerCase().includes(s) || (c.desc || '').toLowerCase().includes(s)
  );
}

function AddPartDrawer({ open, onClose, collectionId, kind = 'designer' }) {
  const collection = useStore(s => s.collections.find(c => c.id === collectionId));
  const [q, setQ] = useStateAddons('');
  const [phase, setPhase] = useStateAddons('idle'); // idle | mouser | digikey | done
  const [results, setResults] = useStateAddons([]);
  const [selected, setSelected] = useStateAddons(null);
  const [qty, setQty] = useStateAddons(1);
  const [note, setNote] = useStateAddons('');
  const inputRef = useRefAddons(null);
  const timers = useRefAddons([]);
  const focusReturn = useRefAddons(null);

  useEffAddons(() => () => timers.current.forEach(clearTimeout), []);
  useEffAddons(() => {
    if (open) {
      focusReturn.current = document.activeElement;
      requestAnimationFrame(() => inputRef.current?.focus());
    } else if (focusReturn.current) {
      try { focusReturn.current.focus(); } catch (e) {}
    }
  }, [open]);

  useEffAddons(() => {
    const k = (e) => { if (e.key === 'Escape' && open) onClose(); };
    document.addEventListener('keydown', k); return () => document.removeEventListener('keydown', k);
  }, [open, onClose]);

  const reset = () => {
    timers.current.forEach(clearTimeout); timers.current = [];
    setPhase('idle'); setResults([]); setSelected(null); setQty(1); setNote('');
  };

  const run = () => {
    if (!q.trim()) return;
    timers.current.forEach(clearTimeout); timers.current = [];
    setSelected(null); setResults([]); setPhase('mouser');
    timers.current.push(setTimeout(() => setPhase('digikey'), 440));
    timers.current.push(setTimeout(() => { setResults(searchCatalog(q)); setPhase('done'); }, 880));
  };

  const confirm = () => {
    if (!selected) return;
    storeActions.addToCollection(selected.mpn, collectionId);
    // Apply qty + note to the line we just appended (last item).
    const updated = (getState().collections.find(c => c.id === collectionId)?.items || []);
    const last = updated[updated.length - 1];
    if (last) {
      if (qty !== 1) storeActions.updateQty(collectionId, last.no, qty);
      if (note.trim()) storeActions.setItemNote(collectionId, last.no, note.trim());
    }
    window.__toast?.(`${selected.mpn} added to ${collection?.name || 'collection'}`, 'plus');
    // Stay open, ready for the next part — clear inputs but keep query so user knows where they were.
    setSelected(null); setQty(1); setNote(''); setQ(''); setResults([]); setPhase('idle');
    requestAnimationFrame(() => inputRef.current?.focus());
  };

  if (!open) return null;
  const accent = kind === 'development' ? 'var(--role-development, #059669)' : 'var(--role-designer, #7C3AED)';
