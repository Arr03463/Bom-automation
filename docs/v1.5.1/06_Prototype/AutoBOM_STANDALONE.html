    timers.current.forEach(clearTimeout); timers.current = [];
    setQuery(q); setSubmitted(q); setPhase('cache');
    timers.current.push(setTimeout(() => setPhase('live'), 520));
    timers.current.push(setTimeout(() => setPhase('done'), 1180));
  };
  const results = phase === 'done' ? findMatches(submitted) : [];

  return (
    <div className="page">
      <div className="page-head">
        <div className="ph-titles">
          <div className="display">Part Search</div>
          <div className="ph-sub">Search Mouser and DigiKey by MPN, partial MPN, or manufacturer. Save parts into a collection.</div>
        </div>
      </div>

      <div className="searchfield" style={{ height: 46, fontSize: 15, marginBottom: 18 }}>
        <Icon name="search" size={18} style={{ color: 'var(--text-muted)' }} />
        <input ref={inputRef} value={query} placeholder="Search by MPN, partial MPN (4+ chars), or manufacturer + MPN…"
          onChange={e => setQuery(e.target.value)}
          onKeyDown={e => { if (e.key === 'Enter' && query.trim()) run(query); }} />
        {query && <button className="icon-btn" style={{ width: 30, height: 30 }} onClick={() => { setQuery(''); setPhase('idle'); inputRef.current.focus(); }}><Icon name="x" size={16} /></button>}
        <button className="btn primary" disabled={!query.trim()} onClick={() => run(query)}>Search</button>
      </div>

      {/* IDLE */}
      {phase === 'idle' && (
        <EmptyState icon="search" title="Search by MPN, partial MPN (4+ chars), or Manufacturer + MPN."
          sub="Results show live stock and pricing from Mouser and DigiKey, plus the recommended supplier."
          actions={
            <div style={{ display: 'flex', gap: 8, flexWrap: 'wrap', justifyContent: 'center' }}>
              {RECENT_SEARCHES.map(s => (
                <button key={s} className="fchip" onClick={() => run(s)}><Icon name="history" size={13} /><span className="mono">{s}</span></button>
              ))}
            </div>} />
      )}

      {/* SEARCHING */}
      {(phase === 'cache' || phase === 'live') && (
        <div className="card" style={{ padding: '34px 24px', textAlign: 'center' }}>
          <div className="spinner" style={{ margin: '0 auto 14px' }} />
          <div style={{ fontWeight: 600 }}>{phase === 'cache' ? 'Searching cached sourcing data…' : 'Checking live with Mouser + DigiKey…'}</div>
          <div className="caption" style={{ marginTop: 4 }}>Query: <span className="mono">{submitted}</span></div>
          <div style={{ display: 'flex', gap: 18, justifyContent: 'center', marginTop: 14 }}>
            <span className="caption" style={{ display: 'flex', alignItems: 'center', gap: 6 }}><Icon name="check" size={13} style={{ color: 'var(--success)' }} />Cache</span>
            <span className="caption" style={{ display: 'flex', alignItems: 'center', gap: 6, color: phase === 'live' ? 'var(--info)' : undefined }}>
              {phase === 'live' ? <span className="spinner" style={{ width: 13, height: 13 }} /> : <Icon name="clock" size={13} />}Live suppliers</span>
          </div>
        </div>
      )}

      {/* RESULTS */}
      {phase === 'done' && results.length > 0 && (
        <div style={{ display: 'grid', gap: 14 }}>
          <div className="caption">{results.length} result{results.length > 1 ? 's' : ''} for <span className="mono">{submitted}</span></div>
          {results.map(c => <ResultCard key={c.mpn} c={c} onAdd={onAdd} />)}
        </div>
      )}

      {/* NOT FOUND */}
      {phase === 'done' && results.length === 0 && (
        <EmptyState icon="search" title={`No results for "${submitted}".`}
          sub="Try a partial MPN (4+ characters) or include the manufacturer name. Check for typos in the part number."
          actions={<button className="btn" onClick={() => { setQuery(''); setPhase('idle'); }}>Clear search</button>} />
      )}
    </div>
  );
}

Object.assign(window, { SearchScreen });

</script>
<script type="text/babel" data-source="screen_collections.jsx">
/* global React, Icon, StatusBadge, RoleDot, SupplierTag, EmptyState,
   useStore, PROJECTS, fmtUSD, fmtInt */
const { useState: useStateColl } = React;

const COLL_FILTERS = [
  { key: 'all', label: 'All' },
  { key: 'active', label: 'Active' },
  { key: 'order-requested', label: 'Order requested' },
  { key: 'rejected', label: 'Rejected' },
  { key: 'ordered', label: 'Ordered' },
];

function collSummary(c) {
  const review = c.items.filter(i => i.status === 'needs-review' || i.stale).length;
  const mouser = c.items.filter(i => i.supplier === 'mouser').length;
  const digikey = c.items.filter(i => i.supplier === 'digikey').length;
  const est = c.items.reduce((a, i) => a + (i.ext || 0), 0);
  return { review, mouser, digikey, est };
}

function CollectionListScreen({ go, demoEmpty }) {
  const [ls, setLs] = window.useListState('d.collections', { filter: 'all', q: '' });
  const filter = ls.filter, q = ls.q;
  const [showNew, setShowNew] = React.useState(false);
  const setFilter = (v) => setLs({ filter: v });
  const setQ = (v) => setLs({ q: v });
  const all = useStore(s => s.collections.filter(c => c.role === 'designer'));
  const programs = useStore(s => s.programs || []);
  const scopeName = (c) => (c.project && PROJECTS[c.project]) ? PROJECTS[c.project].name : ((programs.find(p => p.id === c.program_id) || {}).name || '—');
  const source = demoEmpty ? [] : all;

  let rows = source.filter(c => filter === 'all' ? true : c.state === filter);
  if (q.trim()) {
    const s = q.toLowerCase();
    rows = rows.filter(c => c.name.toLowerCase().includes(s) || scopeName(c).toLowerCase().includes(s));
  }

  const counts = {};
  COLL_FILTERS.forEach(f => counts[f.key] = f.key === 'all' ? source.length : source.filter(c => c.state === f.key).length);
  const attentionCount = source.filter(c => c.items.some(i => i.status === 'needs-review')).length;

  return (
    <div className="page">
      <div className="page-head">
        <div className="ph-titles">
          <div className="display">Collections</div>
          <div className="ph-sub">Your engineering research workspaces. Save parts here while you investigate, then request an order.</div>
        </div>
        <div className="ph-actions">
          <button className="btn" onClick={() => window.__openSearch('palette')}><Icon name="search" size={15} />Search a part <span className="kbd" style={{ marginLeft: 6 }}>⌘K</span></button>
          <button className="btn primary" onClick={() => setShowNew(true)}><Icon name="plus" size={15} />New Collection</button>
        </div>
      </div>

      {attentionCount > 0 && !demoEmpty && (
        <div style={{ display: 'flex', alignItems: 'center', gap: 9, padding: '9px 14px', background: 'var(--danger-soft)', border: '1px solid #f3c2c2', borderRadius: 8, color: '#9b2222', marginBottom: 16, fontSize: 13 }}>
          <Icon name="alert" size={16} />
          <span><strong>{attentionCount} collection{attentionCount > 1 ? 's' : ''}</strong> need your attention — exceptions flagged or a request was rejected.</span>
        </div>
      )}

      <div className="filterbar">
        {COLL_FILTERS.map(f => (
          <button key={f.key} className={`fchip${filter === f.key ? ' active' : ''}`} onClick={() => setFilter(f.key)}>
            {f.label}<span className="fc-n">{counts[f.key]}</span>
          </button>
        ))}
        <div className="searchfield" style={{ marginLeft: 'auto', minWidth: 240 }}>
          <Icon name="search" size={15} style={{ color: 'var(--text-muted)' }} />
          <input value={q} placeholder="Filter collections…" onChange={e => setQ(e.target.value)} />
        </div>
      </div>

      <div className="tbl-wrap" style={{ borderRadius: '0 0 10px 10px', borderTop: 0 }}>
        {rows.length === 0 ? (
          demoEmpty ? (
            <EmptyState icon="layers" title="You don't have any collections yet."
              sub="A collection is an open research space for parts you're investigating. Start by searching for a part."
              actions={<>
                <button className="btn primary" onClick={() => window.__openSearch('palette')}><Icon name="search" size={14} />Search a part</button>
                <button className="btn" onClick={() => setShowNew(true)}><Icon name="plus" size={14} />New Collection</button>
              </>} />
          ) : (
            <EmptyState icon="filter" title="No collections match this filter."
              sub="Try a different status filter or clear your search."
              actions={<button className="btn" onClick={() => { setFilter('all'); setQ(''); }}>Clear filters</button>} />
          )
        ) : rows.map(c => {
          const s = collSummary(c);
          const flagged = c.items.some(i => i.status === 'needs-review');
          return (
            <div key={c.id} className="lrow" onClick={() => go({ screen: 'd.collectionDetail', id: c.id })}
              style={{ boxShadow: `inset 3px 0 0 ${flagged ? 'var(--danger)' : 'var(--role-designer)'}` }}>
              <div style={{ minWidth: 0 }}>
                <div className="lr-title" style={{ display: 'flex', alignItems: 'center', gap: 9, flexWrap: 'wrap' }}>
                  {window.DevKindGlyph && <window.DevKindGlyph kind="designer" size={13} />}
                  <span>{c.name}</span>
                  <StatusBadge status={c.state} />
                </div>
                <div className="lr-meta">
                  <span className="mono">{c.id}</span>
                  <span className="tr-sep" />
                  <span style={{ display: 'inline-flex', alignItems: 'center', gap: 5 }}><Icon name="folder" size={13} />{scopeName(c)}</span>
                  <span className="tr-sep" />
                  <span>{c.items.length} part{c.items.length !== 1 ? 's' : ''}</span>
                  <span className="tr-sep" />
                  <span>updated {c.updated}</span>
                  {s.review > 0 && <><span className="tr-sep" /><span style={{ color: 'var(--warning)', fontWeight: 600, display: 'inline-flex', alignItems: 'center', gap: 4 }}><Icon name="alert" size={12} />{s.review} need review</span></>}
                </div>
              </div>
              <div className="lr-right">
                <div className="lr-stats">
                  {s.mouser > 0 && <span style={{ display: 'inline-flex', alignItems: 'center', gap: 5 }}><span className="dot" style={{ background: 'var(--supplier-mouser)' }} /><b>{s.mouser}</b> Mouser</span>}
                  {s.digikey > 0 && <span style={{ display: 'inline-flex', alignItems: 'center', gap: 5 }}><span className="dot" style={{ background: 'var(--supplier-digikey)' }} /><b>{s.digikey}</b> DigiKey</span>}
                  {s.est > 0 && <span>est. <b className="mono">{fmtUSD(s.est)}</b></span>}
                </div>
              </div>
            </div>
          );
        })}
      </div>
      {showNew && <NewCollectionModal kind="designer" onClose={() => setShowNew(false)} onCreated={(id) => { setShowNew(false); go({ screen: 'd.collectionDetail', id }); }} />}
    </div>
  );
}

Object.assign(window, { CollectionListScreen });

</script>
<script type="text/babel" data-source="screen_collection_detail.jsx">
/* global React, Icon, StatusBadge, RoleTag, SupplierTag, Banner, EmptyState, Freshness,
   TraceabilityStrip, Popover, CommentThread, AddPartDrawer,
   useStore, storeActions, PROJECTS, fmtUSD, fmtInt */
const { useState: useStateCD, useRef: useRefCD, useEffect: useEffCD } = React;

/* ============================================================
   BomTable — used by Collections and BOM detail.
   editable      → qty cells become inline-editable
   onRemove(no)  → trash icon per row (with confirm). Activates "manage" col.
   onNote        → per-row note editor (collection edit mode)
   onRefresh(no) → refresh sourcing for that line
   ============================================================ */
const LINE_FILTERS = [
  { key: 'all', label: 'All' },
  { key: 'exception', label: 'Needs review', test: i => i.status === 'needs-review' || i.status === 'exception' },
  { key: 'check-wall', label: 'Check wall', test: i => i.status === 'check-wall' },
  { key: 'mouser', label: 'Mouser', test: i => i.supplier === 'mouser' },
  { key: 'digikey', label: 'DigiKey', test: i => i.supplier === 'digikey' },
];

function BomTable({ items, editable, onQty, onRemove, onNote, onRefresh, selectable, selected, onToggle, showSource, showCpn, sourceObj, defaultSort }) {
  const [filter, setFilter] = useStateCD('all');
  const [q, setQ] = useStateCD('');
  const [sort, setSort] = useStateCD(defaultSort || { col: 'no', dir: 1 });
  const [editing, setEditing] = useStateCD(null);
  const [draft, setDraft] = useStateCD('');
  const [editingNote, setEditingNote] = useStateCD(null);
  const [noteDraft, setNoteDraft] = useStateCD('');
  const [confirmRemove, setConfirmRemove] = useStateCD(null);
  const sel = selected || new Set();
  const showManage = !!(onRemove || onRefresh);

  const f = LINE_FILTERS.find(x => x.key === filter);
  let rows = items.filter(i => filter === 'all' ? true : (f.test ? f.test(i) : true));
  if (q.trim()) { const s = q.toLowerCase(); rows = rows.filter(i => (i.mpn + i.mfr + i.desc).toLowerCase().includes(s)); }
  const val = (i, c) => c === 'status' ? i.status : c === 'unit' ? (i.unit || 0) : c === 'ext' ? (i.ext || 0) : i[c];
  rows = [...rows].sort((a, b) => { const x = val(a, sort.col), y = val(b, sort.col); return (x > y ? 1 : x < y ? -1 : 0) * sort.dir; });
  const counts = {}; LINE_FILTERS.forEach(x => counts[x.key] = x.key === 'all' ? items.length : items.filter(x.test).length);

  const Th = ({ col, children, num }) => (
    <th className="sortable" style={num ? { textAlign: 'right' } : null}
      onClick={() => setSort(s => ({ col, dir: s.col === col ? -s.dir : 1 }))}>
      <span className="th-inner">{children}{sort.col === col && <Icon name="chevdown" size={12} style={{ transform: sort.dir < 0 ? 'rotate(180deg)' : 'none' }} />}</span>
    </th>
  );
  const commit = (i) => { const n = parseInt(draft, 10); if (!isNaN(n) && n > 0) onQty(i.no, n); setEditing(null); };
  const commitNote = (i) => { onNote && onNote(i.no, noteDraft); setEditingNote(null); };

  return (
    <>
      <div className="filterbar">
        {LINE_FILTERS.map(x => (
          <button key={x.key} className={`fchip${filter === x.key ? ' active' : ''}`} onClick={() => setFilter(x.key)}>
            {x.label}<span className="fc-n">{counts[x.key]}</span>
          </button>
        ))}
        <div className="searchfield" style={{ marginLeft: 'auto', minWidth: 230 }}>
          <Icon name="search" size={15} style={{ color: 'var(--text-muted)' }} />
          <input value={q} placeholder="Filter MPN, manufacturer, description…" onChange={e => setQ(e.target.value)} />
        </div>
      </div>
      <div className="tbl-wrap flow" style={{ borderRadius: '0 0 10px 10px', borderTop: 0 }}>
        <table className="bom">
          <thead><tr>
            {selectable && <th style={{ width: 34 }}></th>}
            <Th col="no" num>#</Th>
            <Th col="mpn">MPN</Th>
            <Th col="mfr">Manufacturer</Th>
            <th>Description</th>
            {showSource && <th>Source</th>}
            {showCpn && <th>CPN</th>}
            <Th col="qty" num>Qty</Th>
            <th>Supplier</th>
            <Th col="unit" num>Unit</Th>
            <Th col="ext" num>Ext.</Th>
            <Th col="status">Status</Th>
            {showManage && <th style={{ width: 96, textAlign: 'right' }}>Manage</th>}
          </tr></thead>
          <tbody>
            {rows.map((i, idx) => {
              const rowCls = i.status === 'needs-review' || i.status === 'exception' ? 'exception'
                : i.status === 'check-wall' || i.stale ? 'warn' : (sel.has(i.no) ? 'selected' : (idx % 2 ? 'alt' : ''));
              return (
                <React.Fragment key={i.no}>
                  <tr className={rowCls}>
                    {selectable && <td><input type="checkbox" checked={sel.has(i.no)} onChange={() => onToggle(i.no)} disabled={!(i.status === 'needs-review' || i.status === 'exception')} /></td>}
                    <td className="num muted">{i.no}</td>
                    <td className="mono" style={{ fontWeight: 600 }}>{i.mpn}{i.replacement && <span className="caption" style={{ display: 'block', color: 'var(--success)', fontFamily: 'var(--font-sans)' }}>↳ replaced {i.replacement.from}</span>}</td>
                    <td>{i.mfr}</td>
                    <td className="secondary" style={{ maxWidth: 230 }}>{i.desc}{i.exReason && <span className="caption" style={{ display: 'block', color: 'var(--danger)' }}>{i.exReason}</span>}</td>
                    {showSource && <td className="caption">{i.source ? <span title={`Selected by ${i.sourceBy || ''}`}><span className="mono">{i.source}</span></span> : <span className="muted">—</span>}</td>}
                    {showCpn && <td><span className="cpn-cell"><span className="mono caption" title="Customer Part Number — read-only">{window.cpnFor ? window.cpnFor(sourceObj, i) : (i.cpn || '—')}</span>{window.cpnScope && <span className={`scope-pill ${window.cpnScope(sourceObj)}`}>{window.cpnScope(sourceObj)}</span>}</span></td>}
                    <td className="num">
                      {editable ? (
                        editing === i.no
                          ? <input className="cell-edit" autoFocus value={draft} onChange={e => setDraft(e.target.value)}
                              onBlur={() => commit(i)} onKeyDown={e => { if (e.key === 'Enter') commit(i); if (e.key === 'Escape') setEditing(null); }} />
                          : <span className="cell-editable" onClick={() => { setEditing(i.no); setDraft(String(i.qty)); }}>{i.qty}</span>
                      ) : i.qty}
                    </td>
                    <td>{i.supplier ? <SupplierTag supplier={i.supplier} /> : <span className="muted">—</span>}</td>
                    <td className="num mono">{i.unit != null ? fmtUSD(i.unit) : '—'}</td>
                    <td className="num mono" style={{ fontWeight: 600 }}>{i.ext != null ? fmtUSD(i.ext) : '—'}</td>
                    <td><StatusBadge status={i.status} /></td>
                    {showManage && (
                      <td style={{ textAlign: 'right', whiteSpace: 'nowrap' }}>
                        {onRefresh && <button className="icon-btn" style={{ width: 28, height: 28 }} title="Refresh sourcing" onClick={() => onRefresh(i.no)}><Icon name="refresh" size={14} /></button>}
                        {onNote && <button className="icon-btn" style={{ width: 28, height: 28, color: i.note ? 'var(--action)' : undefined }} title={i.note ? `Note: ${i.note}` : 'Add note'} onClick={() => { setEditingNote(i.no); setNoteDraft(i.note || ''); }}><Icon name="comment" size={14} /></button>}
                        {onRemove && <button className="icon-btn" style={{ width: 28, height: 28, color: 'var(--danger)' }} title="Remove from collection" onClick={() => setConfirmRemove(i)}><Icon name="x" size={14} /></button>}
                      </td>
                    )}
                  </tr>
                  {editingNote === i.no && (
                    <tr className={rowCls}>
                      <td colSpan={99} style={{ padding: '8px 14px', background: 'var(--bg-raised)' }}>
                        <div style={{ display: 'flex', gap: 9, alignItems: 'center' }}>
                          <Icon name="comment" size={14} style={{ color: 'var(--text-muted)' }} />
                          <input className="input" autoFocus placeholder="Per-line note — observations, test conditions, why this part…" value={noteDraft} onChange={e => setNoteDraft(e.target.value)}
                            onKeyDown={e => { if (e.key === 'Enter') commitNote(i); if (e.key === 'Escape') setEditingNote(null); }}
                            style={{ flex: 1 }} />
                          <button className="btn sm" onClick={() => setEditingNote(null)}>Cancel</button>
                          <button className="btn sm primary" onClick={() => commitNote(i)}>Save note</button>
                        </div>
                      </td>
                    </tr>
                  )}
                  {!editing && i.note && editingNote !== i.no && (
                    <tr className={rowCls} style={{ background: 'var(--bg-raised)' }}>
                      <td colSpan={99} style={{ padding: '4px 14px 6px', fontSize: 12.5, color: 'var(--text-secondary)' }}>
                        <Icon name="comment" size={11} style={{ marginRight: 5, verticalAlign: -1 }} />
                        <em>Note:</em> {i.note}
                      </td>
                    </tr>
                  )}
                </React.Fragment>
              );
            })}
          </tbody>
        </table>
      </div>

      {confirmRemove && (
        <>
          <div className="scrim" onMouseDown={() => setConfirmRemove(null)} />
          <div className="modal-wrap"><div className="modal">
            <div className="modal-head"><div className="mh-title">Remove this part?</div></div>
            <div className="modal-body">
              <p><strong className="mono">{confirmRemove.mpn}</strong> ({confirmRemove.mfr}) will be removed from this collection. This action is recorded in the audit trail.</p>
            </div>
            <div className="modal-foot">
              <button className="btn" onClick={() => setConfirmRemove(null)}>Cancel</button>
              <button className="btn danger" onClick={() => { onRemove(confirmRemove.no); setConfirmRemove(null); }}><Icon name="x" size={14} />Remove part</button>
            </div>
          </div></div>
        </>
      )}
    </>
  );
}

function Totals({ items }) {
  const sum = sup => items.filter(i => i.supplier === sup).reduce((a, i) => a + (i.ext || 0), 0);
  const m = sum('mouser'), d = sum('digikey'), g = m + d;
  return (
    <div style={{ display: 'flex', gap: 26, justifyContent: 'flex-end', padding: '14px 16px', borderTop: '1px solid var(--border)', flexWrap: 'wrap' }}>
      <div style={{ textAlign: 'right' }}><div className="caption" style={{ display: 'flex', alignItems: 'center', gap: 5, justifyContent: 'flex-end' }}><span className="dot" style={{ background: 'var(--supplier-mouser)' }} />Mouser</div><div className="mono" style={{ fontWeight: 600 }}>{fmtUSD(m)}</div></div>
      <div style={{ textAlign: 'right' }}><div className="caption" style={{ display: 'flex', alignItems: 'center', gap: 5, justifyContent: 'flex-end' }}><span className="dot" style={{ background: 'var(--supplier-digikey)' }} />DigiKey</div><div className="mono" style={{ fontWeight: 600 }}>{fmtUSD(d)}</div></div>
      <div style={{ textAlign: 'right' }}><div className="caption">Estimated total</div><div className="mono" style={{ fontWeight: 700, fontSize: 17 }}>{fmtUSD(g)}</div></div>
    </div>
  );
}

function RequestToOrder({ collection, onClose, onConfirm }) {
  const programName = (() => { const st = window.getState && window.getState(); const pr = st && (st.programs || []).find(p => p.id === collection.program_id); return pr ? pr.name : (PROJECTS[collection.project] ? PROJECTS[collection.project].name : '—'); })();
  const total = collection.items.reduce((a, i) => a + (i.ext || 0), 0);
  return <SendToBucketPanel title="Send to purchasing bucket" sourceId={collection.id} items={collection.items}
    summaryRows={[['Collection', collection.name], ['Program', programName], ['Parts', collection.items.length], ['Estimated total', <span className="mono" style={{ fontWeight: 600 }}>{fmtUSD(total)}</span>]]}
    onClose={onClose} onConfirm={onConfirm} />;
}
function SendToBucketPanel({ title = 'Send to purchasing bucket', sourceId, items, summaryRows, allowRecheck = true, onClose, onConfirm }) {
  const [note, setNote] = useStateCD('');
  const [critical, setCritical] = useStateCD(false); // Critical flag — replaces Required By/Urgency entirely. Default off.
  const [staleChoice, setStaleChoice] = useStateCD(null); // null | 'rechecked' | 'proceed'
  const [rechecking, setRechecking] = useStateCD(false);
  const stale = allowRecheck && items.some(i => i.stale);
  const review = items.filter(i => i.status === 'needs-review').length;
  const total = items.reduce((a, i) => a + (i.ext || 0), 0);
  /* FR-D06 — Stale-data gate.
     If any item's sourcing is >24h old, the user MUST choose: Re-check now (refreshes
     stale items, clears the gate) or Proceed with current data (writes a note onto the
     request). Submit is disabled until one path is taken. We never silently submit stale. */
  const recheckNow = async () => {
    setRechecking(true);
    await new Promise(r => setTimeout(r, 1100));
    window.storeActions.refreshSourcing(sourceId, null);
    setRechecking(false);
    setStaleChoice('rechecked');
  };
  const proceedAnyway = () => setStaleChoice('proceed');
  const gateBlocking = (stale && !staleChoice); // Critical flag defaults off; nothing else is mandatory
  const submitNote = staleChoice === 'proceed'
    ? `${note ? note + '\n\n' : ''}[Submitted with stale sourcing data — designer acknowledged]`
    : note;
  return (
    <>
      <div className="scrim" onClick={onClose} />
      <div className="slideout" role="dialog" aria-label={title}>
        <div className="slideout-head">
          <Icon name="cart" size={18} /><span style={{ fontWeight: 700, fontSize: 16, flex: 1 }}>{title}</span>
          <button className="icon-btn" onClick={onClose}><Icon name="x" size={18} /></button>
        </div>
        <div className="slideout-body">
          {review > 0 && <Banner kind="warn" title={`${review} item${review > 1 ? 's' : ''} still need review`}>These lines aren't fully sourced yet. You can still send them to the bucket, but sourcing them first is recommended.</Banner>}
          {stale && !staleChoice && (
            <div className="card" style={{ padding: 14, border: '1px solid var(--warning)', background: 'rgba(217, 119, 6, .06)', marginBottom: 12 }}>
              <div style={{ display: 'flex', alignItems: 'flex-start', gap: 10 }}>
                <Icon name="alert" size={18} style={{ color: 'var(--warning)', flex: 'none', marginTop: 2 }} />
                <div style={{ flex: 1 }}>
                  <div style={{ fontWeight: 700, marginBottom: 4 }}>Sourcing data is more than 24 hours old</div>
                  <p className="caption" style={{ margin: 0, lineHeight: 1.55 }}>Sending stale pricing to the bucket means the Daily Purchasing List may be out of date. Choose how to proceed before sending — you can't send without a decision.</p>
                  <div style={{ display: 'flex', gap: 8, marginTop: 12, flexWrap: 'wrap' }}>
                    <button className="btn sm primary" disabled={rechecking} onClick={recheckNow}>
                      {rechecking ? <><span className="spinner" style={{ width: 13, height: 13 }} />Re-checking…</> : <><Icon name="refresh" size={13} />Re-check now</>}
                    </button>
                    <button className="btn sm" onClick={proceedAnyway}><Icon name="arrow" size={13} />Proceed with current data</button>
                  </div>
                </div>
              </div>
            </div>
          )}
          {staleChoice === 'rechecked' && <Banner kind="info" icon="check" title="Sourcing re-checked">All supplier data was refreshed. Pricing and stock are now current.</Banner>}
          {staleChoice === 'proceed' && <Banner kind="warn" icon="alert" title="Sending with stale data">A note will be attached so the purchasing list shows the sourcing data was older than 24h when it entered the bucket.</Banner>}
          <dl className="kv" style={{ margin: '6px 0 16px' }}>
            {summaryRows.map(([label, node], i) => (<React.Fragment key={i}><dt>{label}</dt><dd style={i === 0 ? { fontWeight: 600 } : undefined}>{node}</dd></React.Fragment>))}
            <dt>Goes to</dt><dd>Shared purchasing bucket</dd>
          </dl>
          {/* Critical flag — replaces Required By / Urgency entirely (v2 bucket model).
             Per-line urgency is meaningless once items consolidate into 2 supplier carts.
             Default off → request enters the Main bucket. On → Critical bucket (faster batch cadence). */}
          <div className="crit-toggle">
            <button type="button" role="switch" aria-checked={critical} className={`switch${critical ? ' on' : ''}`} onClick={() => setCritical(c => !c)}><span className="knob" /></button>
            <div style={{ flex: 1 }}>
              <div style={{ fontWeight: 600, display: 'flex', alignItems: 'center', gap: 7 }}>Mark as Critical{critical && <span className="badge filled" style={{ background: 'var(--danger)' }}><Icon name="alert" size={11} />CRITICAL</span>}</div>
              <div className="caption" style={{ marginTop: 2 }}>{critical
                ? 'Enters the Critical bucket — batched to the purchasing list on the faster cadence.'
                : 'Off by default — enters the Main bucket on the normal batch cadence.'}</div>
            </div>
          </div>
          <label className="field" style={{ marginTop: 14 }}><span className="fl">Note to Purchasing <span className="muted">(optional)</span></span>
            <textarea className="textarea" placeholder="Add context for the purchasing team — budget code, R&D vs production…" value={note} onChange={e => setNote(e.target.value)} /></label>
          <div className="caption" style={{ marginTop: 12, display: 'flex', gap: 7, alignItems: 'flex-start' }}><Icon name="external" size={14} style={{ marginTop: 1, color: 'var(--success)' }} /><span>On submit, these rows pool into the shared purchasing bucket and are batched to the live <strong>Daily Purchasing List</strong> on the next {critical ? 'Critical' : 'Main'} timer — no export, no manual handoff.</span></div>
          <div className="caption" style={{ marginTop: 8, display: 'flex', gap: 7, alignItems: 'flex-start' }}><Icon name="lock" size={14} style={{ marginTop: 1 }} />Sending locks these lines so they stay stable in the bucket. You can still view and comment.</div>
        </div>
        <div className="slideout-foot">
          <button className="btn" onClick={onClose}>Cancel</button>
          <button className="btn primary" disabled={gateBlocking} onClick={() => onConfirm(submitNote, critical)} title={gateBlocking ? 'Resolve the stale-data warning above first' : ''}><Icon name="send" size={15} />Send to purchasing bucket</button>
        </div>
      </div>
    </>
  );
}

/* Inline-editable title and description.
   The title behaves like a normal heading until clicked/focused.
   Edits commit on blur; Esc reverts. */
function InlineTitle({ value, onChange, disabled }) {
  const [text, setText] = useStateCD(value);
  useEffCD(() => setText(value), [value]);
  return (
    <input className="inline-edit-title" value={text} disabled={disabled}
      onChange={e => setText(e.target.value)}
      onBlur={() => { if (text.trim() && text !== value) onChange(text.trim()); else setText(value); }}
      onKeyDown={e => { if (e.key === 'Enter') e.target.blur(); if (e.key === 'Escape') { setText(value); e.target.blur(); } }}
      aria-label="Collection name (click to edit)"
      title={disabled ? '' : 'Click to rename'} />
  );
}
function InlineDescription({ value, onChange, disabled, placeholder }) {
  const [text, setText] = useStateCD(value || '');
  useEffCD(() => setText(value || ''), [value]);
  return (
    <textarea className="inline-edit-desc" rows={1} value={text} disabled={disabled} placeholder={placeholder || 'Click to add a description…'}
      onChange={e => setText(e.target.value)}
      onBlur={() => { if (text !== (value || '')) onChange(text); }}
      onKeyDown={e => { if (e.key === 'Escape') { setText(value || ''); e.target.blur(); } }} />
  );
}

function CollectionDetailScreen({ collection, go, onSubmitOrder }) {
  const [panel, setPanel] = useStateCD(false);
  const [addOpen, setAddOpen] = useStateCD(false);
  const [projectDraft, setProjectDraft] = useStateCD(null);
  const c = collection;
  const projects = useStore(s => Object.values(s.projects));
  const programs = useStore(s => s.programs || []);
  if (!c) return <div className="page"><EmptyState icon="layers" title="Collection not found." /></div>;

  const editable = c.state === 'active' || c.state === 'draft';
  const proj = PROJECTS[c.project];
  const program = programs.find(p => p.id === c.program_id);
  const scopeLabel = proj ? proj.name : (program ? program.name : '—');
  const stale = c.items.some(i => i.stale);

  return (
    <div className="page page-wide">
      <div className="page-head" style={{ marginBottom: 4 }}>
        <div className="ph-titles" style={{ minWidth: 0, flex: 1 }}>
          <button className="btn-link" style={{ marginBottom: 8, display: 'inline-flex', alignItems: 'center', gap: 5 }} onClick={() => go({ screen: 'd.collections' })}><Icon name="chevright" size={14} style={{ transform: 'rotate(180deg)' }} />Collections</button>
          <InlineTitle value={c.name} disabled={!editable} onChange={(v) => storeActions.renameCollection(c.id, v)} />
        </div>
        <div className="ph-actions">
          {c.items.length > 0 && <button className="btn" onClick={() => storeActions.refreshSourcing(c.id, null)} title="Re-check Mouser + DigiKey for every line"><Icon name="refresh" size={15} />Run Sourcing</button>}
          {editable && <button className="btn" onClick={() => setAddOpen(true)}><Icon name="plus" size={15} />Add parts</button>}
          {c.state === 'active' && <button className="btn primary" onClick={() => setPanel(true)} disabled={c.items.length === 0}><Icon name="cart" size={15} />Send to Purchasing</button>}
          {c.state === 'ordered' && c.poId && <button className="btn" onClick={() => go({ screen: 'purchasingEmbed', tab: c.reqId })}><Icon name="cart" size={15} />View in Purchasing <span className="mono" style={{ marginLeft: 4 }}>{c.poId}</span></button>}
        </div>
      </div>

      <TraceabilityStrip name={c.name} status={c.state} creator={c.creator} role={c.role}
        project={scopeLabel} updated={c.updated} updatedBy={c.updatedBy} recordId={c.reqId || c.id}
        onProject={() => go({ screen: proj ? 'projects' : 'programs' })} />

      {/* Inline description + project association */}
      <div style={{ margin: '10px 0 6px', maxWidth: 820 }}>
        <InlineDescription value={c.desc} disabled={!editable} onChange={(v) => storeActions.setCollectionDescription(c.id, v)} placeholder="Add a description for this collection…" />
      </div>
      {editable && (
        <div style={{ display: 'flex', alignItems: 'center', gap: 9, marginTop: 4, marginBottom: 8 }}>
          <span className="caption">Program:</span>
          <select className="select" style={{ width: 'auto', padding: '4px 8px', fontSize: 12.5 }} value={c.program_id || ''}
            onChange={(e) => storeActions.setCollectionProgram(c.id, e.target.value)}>
            {!c.program_id && <option value="">Select a program…</option>}
            {programs.map(p => <option key={p.id} value={p.id}>{(p.identifier || p.code)} · {p.name}</option>)}
          </select>
          <span className="caption">· Changes save automatically</span>
        </div>
      )}

      {/* State banners */}
      {c.state === 'order-requested' && (
        <Banner kind="lock" title="This collection is in the shared purchasing bucket"
          actions={<button className="btn sm" onClick={() => go({ screen: 'purchasingEmbed', tab: c.reqId })}>View in bucket</button>}>
          Its lines are pooling toward the next batch on the Daily Purchasing List. Parts are locked while it's in the bucket — you can still view and comment. Request <span className="mono">{c.reqId}</span>.
        </Banner>
      )}
      {c.state === 'ordered' && (
        <Banner kind="info" icon="check" title="This collection has been ordered"
          actions={<button className="btn sm" onClick={() => go({ screen: 'purchasingEmbed', tab: c.reqId })}>View in Purchasing</button>}>
          All content is read-only. Order <span className="mono">{c.poId}</span> · request <span className="mono">{c.reqId}</span>.
        </Banner>
      )}
      {stale && editable && (
        <Banner kind="warn" title="Some supplier data is stale" actions={<button className="btn sm" onClick={() => storeActions.refreshSourcing(c.id, null)}><Icon name="refresh" size={13} />Refresh now</button>}>
          One or more parts have sourcing data older than 24h. Refresh before requesting an order so Purchasing sees current stock and pricing.
        </Banner>
      )}

      <div style={{ marginTop: 16 }}>
        {c.items.length === 0 ? (
          <div className="card"><EmptyState icon="search" title="This collection is empty."
            sub="Search for a part and add it to your collection. You can keep adding without leaving this page."
            actions={<button className="btn primary" onClick={() => setAddOpen(true)}><Icon name="plus" size={14} />Add a part</button>} /></div>
        ) : (
          <>
            <BomTable
              items={c.items}
              editable={editable}
              onQty={(no, qty) => storeActions.updateQty(c.id, no, qty)}
              onRemove={editable ? (no) => storeActions.removeFromCollection(c.id, no) : null}
              onNote={editable ? (no, note) => storeActions.setItemNote(c.id, no, note) : null}
              onRefresh={editable ? (no) => storeActions.refreshSourcing(c.id, no) : null}
            />
            <div className="tbl-wrap" style={{ borderTop: 0, borderRadius: 0, marginTop: -1 }}><Totals items={c.items} /></div>
          </>
        )}
      </div>

      {/* Comments — permanent record, shown on every collection */}
      <div style={{ marginTop: 26 }}>
        <CommentThread entityId={c.id} />
      </div>

      {panel && <RequestToOrder collection={c} onClose={() => setPanel(false)} onConfirm={(note, critical) => { setPanel(false); onSubmitOrder(c.id, note, critical); }} />}
      <AddPartDrawer open={addOpen} onClose={() => setAddOpen(false)} collectionId={c.id} kind={c.kind || c.role} />
    </div>
  );
}

Object.assign(window, { CollectionDetailScreen, BomTable, Totals, SendToBucketPanel });

</script>
<script type="text/babel" data-source="screen_production.jsx">
/* global React, Icon, StatusBadge, RoleTag, SupplierTag, Banner, EmptyState, Avatar, NeedsAttention,
   useStore, storeActions, PROJECTS, BOM_BADGE, fmtUSD, fmtInt */
const { useState: useStateProd, useRef: useRefProd } = React;

function bomMeta(b) {
  const exceptions = b.items.filter(i => i.status === 'needs-review' || i.status === 'exception').length;
  const sourced = b.items.filter(i => i.supplier).length;
  const total = b.items.reduce((a, i) => a + (i.ext || 0), 0);
  return { exceptions, sourced, total, lines: b.items.length };
}

/* action a Production user can take on a BOM, given its state */
function bomAction(b) {
  const m = bomMeta(b);
  switch (b.state) {
    case 'validated': return { verb: 'Run sourcing', go: { screen: 'p.sourcing', id: b.id }, kind: 'primary' };
    case 'normalised': return { verb: 'Re-run sourcing', go: { screen: 'p.sourcing', id: b.id }, kind: 'primary', note: 'Replacements received' };
    case 'results': return m.exceptions > 0
      ? { verb: 'Resolve exceptions', go: { screen: 'p.results', id: b.id }, kind: 'danger', note: `${m.exceptions} need review` }
      : { verb: 'Create package', go: { screen: 'p.procurement', id: b.id }, kind: 'primary', note: 'All sourced' };
    case 'exceptions': return { verb: 'View', go: { screen: 'p.bomOverview', id: b.id }, kind: 'ghost', note: 'Waiting on designer' };
    case 'submitted': return { verb: 'Track', go: { screen: 'p.bomOverview', id: b.id }, kind: 'ghost', note: 'In purchasing bucket' };
    default: return { verb: 'Open', go: { screen: 'p.bomOverview', id: b.id }, kind: 'ghost' };
  }
}

function ProductionDashboard({ go, flashId }) {
  const [demo, setDemo] = useStateProd('default');
  const boms = useStore(s => s.boms.filter(b => b.state !== 'draft'));
  const sourcingActive = false; // toggled by demo
  const list = demo === 'empty' ? [] : boms;

  const inQueue = boms.filter(b => !['submitted', 'ordered'].includes(b.state)).length;
  const exceptionsOpen = boms.filter(b => b.state === 'exceptions').length;
  const readyProc = boms.filter(b => b.state === 'results' && bomMeta(b).exceptions === 0).length;
  const activeSourcing = demo === 'sourcing' ? 1 : 0;

  return (
    <div className="page">
      <div className="page-head">
        <div className="ph-titles"><div className="display">Production workspace</div>
          <div className="ph-sub">Validate, source, and package BOMs for purchasing. You own sourcing readiness.</div></div>
        <div className="ph-actions">
          <div style={{ display: 'inline-flex', border: '1px solid var(--border)', borderRadius: 7, overflow: 'hidden', marginRight: 4 }}>
            {[['default', 'Default'], ['sourcing', 'Active sourcing'], ['empty', 'Empty queue']].map(([v, l], i) => (
              <button key={v} onClick={() => setDemo(v)} style={{ border: 0, padding: '6px 11px', fontSize: 12.5, fontWeight: 600, cursor: 'pointer', background: demo === v ? 'var(--info-soft)' : 'var(--bg-surface)', color: demo === v ? 'var(--info)' : 'var(--text-secondary)', borderRight: i < 2 ? '1px solid var(--border)' : 0 }}>{l}</button>
            ))}
          </div>
          <button className="btn primary" onClick={() => go({ screen: 'p.upload' })}><Icon name="upload" size={15} />Upload BOM</button>
        </div>
      </div>

      {demo === 'sourcing' && (
        <div className="panel" style={{ marginBottom: 16, borderColor: 'var(--info)' }}>
          <div className="panel-head" style={{ background: 'var(--info-soft)' }}>
            <span className="spinner" style={{ borderTopColor: 'var(--info)' }} /><span className="ph-title" style={{ color: 'var(--info)' }}>Sourcing run in progress — Sensor Board Rev A</span>
            <button className="btn-link" style={{ marginLeft: 'auto' }} onClick={() => go({ screen: 'p.sourcing', id: 'BOM-055' })}>Open live view</button>
          </div>
          <div style={{ padding: '14px 16px' }}>
            <div className="progress"><i style={{ width: '64%' }} /></div>
            <div className="caption" style={{ marginTop: 7, display: 'flex', gap: 16 }}><span>16 of 25 lines</span><span>64%</span><span>~40s remaining</span></div>
          </div>
        </div>
      )}

      <div className="na-mount" style={{ marginBottom: 18 }}><NeedsAttention role="production" go={go} flashId={flashId} /></div>

      <div className="stat-row" style={{ marginBottom: 18 }}>
        <div className="stat"><div className="st-label"><Icon name="boms" size={13} /> BOMs in queue</div><div className="st-num">{demo === 'empty' ? 0 : inQueue}</div><div className="st-sub">in pipeline</div></div>
        <div className="stat"><div className="st-label"><Icon name="refresh" size={13} style={{ color: 'var(--info)' }} /> Active sourcing</div><div className="st-num">{activeSourcing}</div><div className="st-sub">running now</div></div>
        <div className="stat"><div className="st-label"><Icon name="alert" size={13} style={{ color: 'var(--danger)' }} /> Open exceptions</div><div className="st-num" style={{ color: exceptionsOpen ? 'var(--danger)' : undefined }}>{demo === 'empty' ? 0 : exceptionsOpen}</div><div className="st-sub">with designers</div></div>
        <div className="stat"><div className="st-label"><Icon name="check" size={13} style={{ color: 'var(--success)' }} /> Ready for procurement</div><div className="st-num">{demo === 'empty' ? 0 : readyProc}</div><div className="st-sub">to package</div></div>
      </div>

      <div className="panel">
        <div className="panel-head"><Icon name="boms" size={16} /><span className="ph-title">BOM Queue</span>
          <button className="btn-link" style={{ marginLeft: 'auto' }} onClick={() => go({ screen: 'projects' })}>View all</button></div>
        {list.length === 0 ? <EmptyState icon="boms" title="No BOMs in your queue." sub="Upload a BOM file to start the validation and sourcing pipeline."
          actions={<button className="btn primary sm" onClick={() => go({ screen: 'p.upload' })}><Icon name="upload" size={14} />Upload BOM</button>} />
        : list.map(b => { const m = bomMeta(b); return (
          <div key={b.id} className="attn-item" style={{ cursor: 'pointer' }} onClick={() => go({ screen: 'p.bomOverview', id: b.id })}>
            <div className="attn-main"><div style={{ display: 'flex', alignItems: 'center', gap: 9 }}><span style={{ fontWeight: 600, fontSize: 14 }}>{b.name}</span><StatusBadge status={BOM_BADGE[b.state]} /></div>
              <div className="am-meta">{PROJECTS[b.project].name} · build {fmtInt(b.buildQty)} · {m.lines} lines · updated {b.updated}</div></div>
            <Icon name="chevright" size={16} style={{ color: 'var(--text-muted)' }} />
          </div>
        ); })}
      </div>
    </div>
  );
}

const BOM_LIST_FILTERS = [
  { key: 'all', label: 'All' }, { key: 'validated', label: 'Validated' }, { key: 'results', label: 'Sourced' },
  { key: 'exceptions', label: 'Exceptions' }, { key: 'submitted', label: 'Submitted' },
];
function BomListScreen({ go }) {
  const [ls, setLs] = window.useListState('p.boms', { filter: 'all' });
  const filter = ls.filter; const setFilter = (v) => setLs({ filter: v });
  const boms = useStore(s => s.boms.filter(b => b.state !== 'draft'));
  const rows = boms.filter(b => filter === 'all' ? true : b.state === filter);
  const counts = {}; BOM_LIST_FILTERS.forEach(f => counts[f.key] = f.key === 'all' ? boms.length : boms.filter(b => b.state === f.key).length);
  return (
    <div className="page">
      <div className="page-head">
        <div className="ph-titles"><div className="display">BOMs</div><div className="ph-sub">Every BOM in the production pipeline. Upload, validate, source, and package for purchasing.</div></div>
        <div className="ph-actions"><button className="btn primary" onClick={() => go({ screen: 'p.upload' })}><Icon name="upload" size={15} />Upload BOM</button></div>
      </div>
      <div className="filterbar">
        {BOM_LIST_FILTERS.map(f => <button key={f.key} className={`fchip${filter === f.key ? ' active' : ''}`} onClick={() => setFilter(f.key)}>{f.label}<span className="fc-n">{counts[f.key]}</span></button>)}
      </div>
      <div className="tbl-wrap" style={{ borderRadius: '0 0 10px 10px', borderTop: 0 }}>
        {rows.length === 0 ? <EmptyState icon="boms" title="No BOMs match this filter." sub="Try a different state or upload a new BOM." actions={<button className="btn" onClick={() => setFilter('all')}>Clear filter</button>} />
        : rows.map(b => { const m = bomMeta(b); return (
          <div key={b.id} className="lrow" onClick={() => go({ screen: 'p.bomOverview', id: b.id })} style={m.exceptions > 0 ? { boxShadow: 'inset 3px 0 0 var(--danger)' } : undefined}>
            <div style={{ minWidth: 0 }}>
              <div className="lr-title">{b.name}<StatusBadge status={BOM_BADGE[b.state]} /></div>
              <div className="lr-meta"><span className="mono">{b.id}</span><span className="tr-sep" /><span style={{ display: 'inline-flex', alignItems: 'center', gap: 5 }}><Icon name="folder" size={13} />{PROJECTS[b.project].name}</span>
                <span className="tr-sep" /><span>build {fmtInt(b.buildQty)} +{b.overage}%</span><span className="tr-sep" /><span>{m.lines} lines</span>
                {m.exceptions > 0 && <><span className="tr-sep" /><span style={{ color: 'var(--danger)', fontWeight: 600, display: 'inline-flex', alignItems: 'center', gap: 4 }}><Icon name="alert" size={12} />{m.exceptions} exceptions</span></>}</div>
            </div>
            <div className="lr-right"><div className="lr-stats"><span>updated {b.updated}</span>{m.total > 0 && <span>est. <b className="mono">{fmtUSD(m.total)}</b></span>}</div></div>
          </div>
        ); })}
      </div>
    </div>
  );
}

function BomUploadScreen({ go, preProject }) {
  const availableProjects = useStore(s => Object.values(s.projects).filter(p => !s.boms.some(b => b.project === p.id && b.state !== 'draft')));
  const backTo = preProject ? { screen: 'projectDetail', id: preProject } : { screen: 'projects' };
  const [phase, setPhase] = useStateProd('idle'); // idle | selected | error
  const [form, setForm] = useStateProd({ name: '', project: preProject || (availableProjects[0] && availableProjects[0].id) || '', buildQty: '', overage: '10' });
  const [touched, setTouched] = useStateProd(false);
  const fileName = 'sensor_board_rev_a.xlsx';
  const errs = { name: !form.name.trim(), buildQty: !form.buildQty || +form.buildQty <= 0, project: !form.project };
  const hasErr = errs.name || errs.buildQty || errs.project;

  const submit = () => {
    setTouched(true); if (hasErr) return;
    const id = storeActions.createBom({ name: form.name, project: form.project, buildQty: +form.buildQty, overage: +form.overage });
    if (id) go({ screen: 'p.validate', id });
  };

  return (
    <div className="page">
      <div className="page-head"><div className="ph-titles">
        <button className="btn-link" style={{ marginBottom: 8 }} onClick={() => go(backTo)}>← {preProject ? 'PCB Project' : 'PCB Projects'}</button>
        <div className="h1">Upload BOM</div><div className="ph-sub">Upload a CSV or XLSX. Validation runs automatically after upload.</div></div></div>

      <div style={{ display: 'grid', gridTemplateColumns: '1.3fr 1fr', gap: 22, alignItems: 'start', maxWidth: 980 }}>
        <div>
          {phase === 'idle' && (
            <div className="dropzone" onClick={() => setPhase('selected')}>
              <div className="em-icon" style={{ margin: '0 auto 14px' }}><Icon name="upload" size={24} /></div>
              <div style={{ fontWeight: 700, fontSize: 16 }}>Drop a BOM file here, or click to browse</div>
              <div className="caption" style={{ marginTop: 6 }}>CSV or XLSX · up to 5,000 lines · first row treated as headers</div>
              <div style={{ display: 'flex', gap: 8, justifyContent: 'center', marginTop: 16 }}>
                <button className="btn" onClick={(e) => { e.stopPropagation(); setPhase('selected'); }}>Browse files</button>
                <button className="btn ghost" onClick={(e) => { e.stopPropagation(); setPhase('error'); }}>Simulate bad file</button>
              </div>
            </div>
          )}
          {phase === 'error' && (
            <div className="dropzone error">
              <div className="em-icon" style={{ margin: '0 auto 14px', background: 'var(--danger-soft)', color: 'var(--danger)' }}><Icon name="x" size={24} /></div>
              <div style={{ fontWeight: 700, fontSize: 16, color: 'var(--danger)' }}>Couldn't read that file</div>
              <div className="caption" style={{ marginTop: 6, maxWidth: 360, marginInline: 'auto' }}>The file appears to be a PDF, not a spreadsheet. Export your BOM as CSV or XLSX and try again.</div>
              <button className="btn" style={{ marginTop: 16 }} onClick={() => setPhase('idle')}>Try another file</button>
            </div>
          )}
          {phase === 'selected' && (
            <div className="card" style={{ padding: 16 }}>
              <div style={{ display: 'flex', alignItems: 'center', gap: 12 }}>
                <div className="attn-icon" style={{ background: 'var(--success-soft)', color: 'var(--success)' }}><Icon name="check" size={18} /></div>
                <div style={{ flex: 1 }}><div style={{ fontWeight: 600 }} className="mono">{fileName}</div><div className="caption">44 rows detected · 9 columns · headers in row 1</div></div>
                <button className="btn ghost sm" onClick={() => setPhase('idle')}><Icon name="x" size={15} />Remove</button>
              </div>
              <div className="divider" />
              <div className="caption" style={{ marginBottom: 8, fontWeight: 600, color: 'var(--text-secondary)' }}>Column mapping (auto-detected)</div>
              <div style={{ display: 'grid', gridTemplateColumns: 'repeat(3,1fr)', gap: 8 }}>
                {[['MPN', 'Part Number'], ['Manufacturer', 'Mfr'], ['Qty', 'Quantity'], ['Description', 'Desc'], ['Reference', 'RefDes'], ['—', 'Notes']].map(([k, v]) => (
                  <div key={k} className="map-chip"><span className="caption">{v}</span><Icon name="arrow" size={12} /><span style={{ fontWeight: 600 }}>{k}</span></div>
                ))}
              </div>
            </div>
          )}
        </div>

        <div className="card" style={{ padding: 16 }}>
          <div className="h2" style={{ marginBottom: 12 }}>BOM details</div>
          <label className="field" style={{ marginBottom: 12 }}><span className="fl">BOM name</span>
            <input className="input" value={form.name} placeholder="e.g. Sensor Board Rev A" onChange={e => setForm({ ...form, name: e.target.value })} />
            {touched && errs.name && <span className="err-msg"><Icon name="alert" size={12} />Name is required</span>}</label>
          <label className="field" style={{ marginBottom: 12 }}><span className="fl">PCB Project</span>
            <select className="select" value={form.project} onChange={e => setForm({ ...form, project: e.target.value })}>
              {availableProjects.length === 0 && <option value="">No PCB Projects without a BOM</option>}
              {availableProjects.map(p => <option key={p.id} value={p.id}>{p.name}</option>)}</select>
            <span className="caption" style={{ marginTop: 3 }}>One BOM per PCB — only PCB Projects without a BOM are listed.</span>
            {touched && errs.project && <span className="err-msg"><Icon name="alert" size={12} />Pick a PCB Project</span>}</label>
          <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: 12, marginBottom: 12 }}>
            <label className="field"><span className="fl">Build quantity</span>
              <input className="input" type="number" value={form.buildQty} placeholder="25" onChange={e => setForm({ ...form, buildQty: e.target.value })} />
              {touched && errs.buildQty && <span className="err-msg"><Icon name="alert" size={12} />Required</span>}</label>
            <label className="field"><span className="fl">Overage %</span>
              <input className="input" type="number" value={form.overage} onChange={e => setForm({ ...form, overage: e.target.value })} /></label>
          </div>
          <div className="caption" style={{ marginBottom: 14, display: 'flex', gap: 6, alignItems: 'flex-start' }}><Icon name="info" size={14} style={{ marginTop: 1 }} />Overage adds buffer stock on top of build quantity to cover assembly loss.</div>
          <button className="btn primary lg" style={{ width: '100%' }} disabled={phase !== 'selected'} onClick={submit}><Icon name="check" size={16} />Validate BOM</button>
          {phase !== 'selected' && <div className="caption" style={{ textAlign: 'center', marginTop: 8 }}>Select a file to continue</div>}
        </div>
      </div>
    </div>
  );
}

Object.assign(window, { ProductionDashboard, BomListScreen, BomUploadScreen, bomMeta, bomAction });

</script>
<script type="text/babel" data-source="screen_production_pipeline.jsx">
/* global React, Icon, StatusBadge, RoleTag, SupplierTag, Banner, EmptyState, TraceabilityStrip,
   BomTable, Totals, useStore, storeActions, getState, PROJECTS, CATALOG, BOM_BADGE, fmtUSD, fmtInt, bomMeta */
const { useState: useStatePB, useRef: useRefPB, useEffect: useEffPB } = React;

function bomById(id) { return useStore(s => s.boms.find(b => b.id === id)); }

function PipelineHeader({ b, go, stage }) {
  const stages = ['Upload', 'Validate', 'Source', 'Resolve', 'Package', 'Submit'];
  const idx = { upload: 0, validate: 1, sourcing: 2, results: 3, procurement: 4, submit: 5 }[stage] ?? 1;
  return (
    <>
      <div className="page-head" style={{ marginBottom: 4 }}>
        <div className="ph-titles">
          <button className="btn-link" style={{ marginBottom: 8 }} onClick={() => go({ screen: 'p.bomOverview', id: b.id })}>← {b.name}</button>
          <div className="h1">{b.name}</div>
        </div>
      </div>
      <TraceabilityStrip name={b.name} status={BOM_BADGE[b.state]} creator={b.creator} role="production"
        project={PROJECTS[b.project].name} updated={b.updated} updatedBy={b.updatedBy} recordId={b.id}
        onProject={() => go({ screen: 'projects' })} />
      <div className="pipeline-rail">
        {stages.map((s, i) => (
          <div key={s} className={`pl-node${i < idx ? ' done' : i === idx ? ' active' : ''}`}>
            <span className="pl-dot">{i < idx ? <Icon name="check" size={12} /> : i + 1}</span>
            <span className="pl-label">{s}</span>
          </div>
        ))}
      </div>
    </>
  );
}

/* ---- Validation Review ---- */
function BomValidationScreen({ id, go }) {
  const b = bomById(id);
  if (!b) return <div className="page"><EmptyState icon="boms" title="BOM not found." /></div>;
  const v = b.validation || { errors: 0, warnings: 0, notes: [] };
  const blocked = v.errors > 0;
  return (
    <div className="page page-wide">
      <PipelineHeader b={b} go={go} stage="validate" />
      <div style={{ marginTop: 16 }}>
        {blocked ? (
          <Banner kind="danger" icon="x" title={`${v.errors} validation error${v.errors > 1 ? 's' : ''} — sourcing blocked`}>
            Fix the highlighted lines (missing MPN or manufacturer) before this BOM can be sourced. You can edit inline or push the BOM back to the designer.
          </Banner>
        ) : v.warnings > 0 ? (
          <Banner kind="warn" title={`Validation passed with ${v.warnings} warning${v.warnings > 1 ? 's' : ''}`}>
            <ul style={{ margin: '4px 0 0', paddingLeft: 18 }}>{v.notes.map((n, i) => <li key={i}>{n}</li>)}</ul>
          </Banner>
        ) : (
          <Banner kind="info" icon="check" title="Validation passed — no errors or warnings">This BOM is clean and ready to source.</Banner>
        )}
      </div>
      <div style={{ marginTop: 14 }}>
        <BomTable items={b.items} editable={true} showSource onQty={(no, qty) => storeActions.updateQty(b.id, no, qty)} />
      </div>
      <div style={{ display: 'flex', gap: 10, justifyContent: 'flex-end', marginTop: 18 }}>
        <button className="btn"><Icon name="arrow" size={15} style={{ transform: 'rotate(180deg)' }} />Push back to designer</button>
        <button className="btn primary" disabled={blocked} onClick={() => go({ screen: 'p.sourcing', id: b.id })}><Icon name="refresh" size={15} />Run Sourcing</button>
      </div>
    </div>
  );
}

/* ---- Sourcing Progress (live) ---- */
const LOG_LINES = [
  { t: '00:00', m: 'Sourcing run started — 25 lines queued', c: '' },
  { t: '00:01', m: 'STM32G431CBT6 → Mouser 980 @ $4.12 ✓', c: 'ok' },
  { t: '00:03', m: 'GRM188R71H104KA93D → DigiKey 720k @ $0.011 ✓', c: 'ok' },
  { t: '00:05', m: 'ERJ-3EKF1002V → Mouser 940k @ $0.004 ✓', c: 'ok' },
  { t: '00:07', m: 'Rate limit on DigiKey — waiting 4s', c: 'warn' },
  { t: '00:12', m: 'BAT54S-7-F → DigiKey 120k @ $0.05 ✓', c: 'ok' },
  { t: '00:14', m: 'TPS54560DDAR → Mouser 1,890 @ $2.41 ✓', c: 'ok' },
];
function SourcingProgressScreen({ id, go }) {
  const b = bomById(id);
  const [pct, setPct] = useStatePB(b && b.state === 'normalised' ? 40 : 12);
  const [running, setRunning] = useStatePB(true);
  const [phase, setPhase] = useStatePB('run'); // run | ratelimit | done | cancelled
  const timer = useRefPB(null);
  useEffPB(() => {
    if (!running) return;
    timer.current = setInterval(() => setPct(p => {
      const np = Math.min(100, p + 6);
      if (np >= 100) { clearInterval(timer.current); setRunning(false); setPhase('done'); }
      else if (np >= 52 && np < 64) setPhase('ratelimit'); else setPhase('run');
      return np;
    }), 420);
    return () => clearInterval(timer.current);
  }, [running]);
  if (!b) return <div className="page"><EmptyState icon="boms" title="BOM not found." /></div>;
  const total = b.items.length, done = Math.round(total * pct / 100);
  const counts = { mouser: Math.round(done * 0.5), digikey: Math.round(done * 0.35), wall: Math.max(0, Math.round(done * 0.08)), review: phase === 'done' ? b.items.filter(i => i.exReason).length : 0, pending: total - done };

  return (
    <div className="page page-wide">
      <PipelineHeader b={b} go={go} stage="sourcing" />
      <div className="panel" style={{ marginTop: 16 }}>
        <div className="panel-head" style={{ background: phase === 'done' ? 'var(--success-soft)' : 'var(--info-soft)' }}>
          {phase === 'done' ? <Icon name="check" size={17} style={{ color: 'var(--success)' }} /> : <span className="spinner" style={{ borderTopColor: 'var(--info)' }} />}
          <span className="ph-title" style={{ color: phase === 'done' ? 'var(--success)' : 'var(--info)' }}>
            {phase === 'done' ? 'Sourcing complete' : phase === 'ratelimit' ? 'Rate-limit wait — DigiKey' : phase === 'cancelled' ? 'Sourcing cancelled' : 'Sourcing in progress'}</span>
          <span className="ph-meta">{done} of {total} lines · {pct}%{phase !== 'done' ? ` · ~${Math.max(1, Math.round((100 - pct) / 6 * 0.42))}s remaining` : ''}</span>
        </div>
        <div className="panel-body">
          <div className="progress" style={{ height: 10 }}><i style={{ width: pct + '%', background: phase === 'done' ? 'var(--success)' : phase === 'ratelimit' ? 'var(--warning)' : 'var(--action)' }} /></div>
          <div className="sourcing-grid" style={{ marginTop: 16 }}>
            <div className="scount"><div className="sc-n" style={{ color: 'var(--supplier-mouser)' }}>{counts.mouser}</div><div className="sc-l"><span className="dot" style={{ background: 'var(--supplier-mouser)' }} />Mouser</div></div>
            <div className="scount"><div className="sc-n" style={{ color: 'var(--supplier-digikey)' }}>{counts.digikey}</div><div className="sc-l"><span className="dot" style={{ background: 'var(--supplier-digikey)' }} />DigiKey</div></div>
            <div className="scount"><div className="sc-n" style={{ color: 'var(--warning)' }}>{counts.wall}</div><div className="sc-l"><Icon name="alert" size={12} style={{ color: 'var(--warning)' }} />Check wall</div></div>
            <div className="scount"><div className="sc-n" style={{ color: 'var(--danger)' }}>{counts.review}</div><div className="sc-l"><Icon name="alert" size={12} style={{ color: 'var(--danger)' }} />Needs review</div></div>
            <div className="scount"><div className="sc-n">{counts.pending}</div><div className="sc-l"><Icon name="clock" size={12} />Pending</div></div>
          </div>
          <div className="logbox" style={{ marginTop: 16 }}>
            {LOG_LINES.slice(0, Math.max(2, Math.round(done))).map((l, i) => (
              <div key={i} className={`lg ${l.c}`}><span className="lt">{l.t}</span><span>{l.m}</span></div>
            ))}
            {phase === 'ratelimit' && <div className="lg warn"><span className="lt">····</span><span>Backing off — DigiKey rate limit, retrying…</span></div>}
            {phase === 'done' && <div className="lg ok"><span className="lt">done</span><span>Run finished — {counts.review} line(s) need engineering review</span></div>}
          </div>
          <div style={{ display: 'flex', gap: 10, justifyContent: 'flex-end', marginTop: 16 }}>
            {phase !== 'done' ? (
              <button className="btn danger" onClick={() => { clearInterval(timer.current); setRunning(false); setPhase('cancelled'); }}><Icon name="x" size={15} />Cancel run</button>
            ) : (
              <button className="btn primary" onClick={() => { storeActions.completeSourcing(b.id); go({ screen: 'p.results', id: b.id }); }}>View results<Icon name="arrow" size={15} /></button>
            )}
            {phase === 'cancelled' && <button className="btn" onClick={() => { setPhase('run'); setRunning(true); }}><Icon name="refresh" size={15} />Re-run on unsourced lines</button>}
            {phase === 'cancelled' && <button className="btn primary" onClick={() => { storeActions.completeSourcing(b.id); go({ screen: 'p.results', id: b.id }); }}>View partial results<Icon name="arrow" size={15} /></button>}
          </div>
          {phase === 'cancelled' && (
            /* FR-P05 — Cancel sourcing preserves completed lines. BOM returns to NORMALISED.
               User can re-run sourcing on the remaining unsourced lines only, or proceed
               with what we have. We never lose work already done. */
            <Banner kind="info" icon="check" title="Partial results preserved"
              actions={<button className="btn sm" onClick={() => { setPhase('run'); setRunning(true); }}><Icon name="refresh" size={13} />Re-run unsourced lines</button>}>
              {Math.max(0, Math.round(done))} of {LOG_LINES.length} lines sourced. The remaining lines are unsourced — re-run sourcing on just those, or proceed to results with partial data.
            </Banner>
          )}
        </div>
      </div>
    </div>
  );
}

Object.assign(window, { BomValidationScreen, SourcingProgressScreen, PipelineHeader, bomById });

</script>
<script type="text/babel" data-source="screen_production_results.jsx">
/* global React, Icon, StatusBadge, RoleTag, SupplierTag, Banner, EmptyState, TraceabilityStrip,
   BomTable, Totals, PipelineHeader, bomById, useStore, storeActions, PROJECTS, CATALOG, BOM_BADGE, fmtUSD, fmtInt, bomMeta */
const { useState: useStateRes, useRef: useRefRes } = React;

/* ---- Push-Back Composer (modal) ---- structured: reason + urgency + flagged lines,
     or a missing-component request (a part the master BOM doesn't have). ---- */
function ExceptionComposer({ bom, lineNos, startMissing, onClose }) {
  const [reason, setReason] = useStateRes('unsourceable');
  const [urgency, setUrgency] = useStateRes('standard');
  const [note, setNote] = useStateRes('');
  const [missing, setMissing] = useStateRes(!!startMissing);
  const [acr, setAcr] = useStateRes({ mpn: '', description: '', characteristics: '', quantityPerBoard: 1, designator: '' });
  const [sent, setSent] = useStateRes(false);
  const lines = bom.items.filter(i => lineNos.has(i.no));
  const REASONS = [['obsolete', 'Obsolete'], ['eol', 'EOL'], ['unsourceable', 'Unsourceable'], ['zero-stock', 'Zero stock'], ['other', 'Other']];
  const canSend = missing ? acr.description.trim().length > 0 : lines.length > 0;
  const send = () => {
    if (missing) storeActions.sendPushback(bom.id, { reason: 'missing-component', urgency, note,
      addedComponentRequest: { mpn: acr.mpn.trim() || null, description: acr.description.trim(), characteristics: acr.characteristics.trim(), quantityPerBoard: +acr.quantityPerBoard || 1, designator: acr.designator.trim() || null } });
    else storeActions.sendPushback(bom.id, { lineNos: [...lineNos], reason, urgency, note });
    setSent(true);
  };
  const setA = (k, v) => setAcr(a => ({ ...a, [k]: v }));
  return (
    <div className="modal-wrap"><div className="scrim" onClick={onClose} />
      <div className="modal" style={{ width: 580, position: 'relative', zIndex: 95 }}>
        {!sent ? <>
          <div className="modal-head"><div className="mh-title" style={{ display: 'flex', alignItems: 'center', gap: 9 }}><Icon name="alert" size={18} style={{ color: 'var(--danger)' }} />Send Push-Back to {bom.creator}</div></div>
          <div className="modal-body">
            <div className="seg-toggle" style={{ marginBottom: 12 }}>
              <button className={!missing ? 'on' : ''} onClick={() => setMissing(false)}>Flagged lines{lines.length ? ` · ${lines.length}` : ''}</button>
              <button className={missing ? 'on' : ''} onClick={() => setMissing(true)}>Missing component</button>
            </div>
            <div style={{ display: 'flex', gap: 14, marginBottom: 12, flexWrap: 'wrap' }}>
              {!missing && <label className="field" style={{ flex: 1, minWidth: 180 }}><span className="fl">Reason</span>
                <select className="select" value={reason} onChange={e => setReason(e.target.value)}>{REASONS.map(([v, l]) => <option key={v} value={v}>{l}</option>)}</select></label>}
              <label className="field" style={{ flex: 1, minWidth: 180 }}><span className="fl">Urgency</span>
                <div className="seg-toggle"><button className={urgency === 'standard' ? 'on' : ''} onClick={() => setUrgency('standard')}>Standard</button><button className={urgency === 'blocking' ? 'on' : ''} onClick={() => setUrgency('blocking')}>Blocking</button></div></label>
            </div>
            {!missing ? <>
              <p style={{ marginTop: 0 }} className="secondary">These {lines.length} line{lines.length !== 1 ? 's' : ''} go to the Designer, who will <strong>recommend</strong> replacements via characteristic search. The BOM stays in EXCEPTIONS until Production applies them.</p>
              <div className="tbl-wrap" style={{ marginBottom: 14 }}><table className="bom"><thead><tr><th>MPN</th><th>Reason</th></tr></thead><tbody>
                {lines.map(l => <tr key={l.no} className="exception"><td className="mono" style={{ fontWeight: 600 }}>{l.mpn}</td><td className="secondary">{l.exReason || 'Needs engineering review'}</td></tr>)}
                {lines.length === 0 && <tr><td colSpan={2} className="caption">No lines selected — pick lines on the results table, or switch to Missing component.</td></tr>}
              </tbody></table></div>
            </> : <>
              <p style={{ marginTop: 0 }} className="secondary">Request a component the master BOM doesn't have. The Designer recommends a part to <strong>add</strong> as a new line; Production applies it.</p>
              <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: 10 }}>
                <label className="field"><span className="fl">MPN <span className="muted">(if known)</span></span><input className="input mono" value={acr.mpn} onChange={e => setA('mpn', e.target.value)} /></label>
                <label className="field"><span className="fl">Designator <span className="muted">(optional)</span></span><input className="input mono" value={acr.designator} onChange={e => setA('designator', e.target.value)} placeholder="e.g. C42" /></label>
                <label className="field" style={{ gridColumn: '1 / -1' }}><span className="fl">Description <span style={{ color: 'var(--danger)' }}>(required)</span></span><input className="input" value={acr.description} onChange={e => setA('description', e.target.value)} placeholder="e.g. Bulk cap, 47µF 25V, low ESR" /></label>
                <label className="field" style={{ gridColumn: '1 / -1' }}><span className="fl">Characteristics <span className="muted">(free text — seeds the Designer's search)</span></span><input className="input" value={acr.characteristics} onChange={e => setA('characteristics', e.target.value)} placeholder="47µF, 25V, X7R, 1206" /></label>
                <label className="field"><span className="fl">Qty / board</span><input className="input" type="number" min="1" value={acr.quantityPerBoard} onChange={e => setA('quantityPerBoard', e.target.value)} /></label>
              </div>
            </>}
            <label className="field" style={{ marginTop: 4 }}><span className="fl">Note to designer <span className="muted">(optional)</span></span>
              <textarea className="textarea" placeholder="e.g. IRFB4110PBF may be discontinued — please confirm or supply a replacement." value={note} onChange={e => setNote(e.target.value)} /></label>
          </div>
          <div className="modal-foot"><button className="btn" onClick={onClose}>Cancel</button><button className="btn danger" disabled={!canSend} onClick={send}><Icon name="send" size={15} />Send Push-Back</button></div>
        </> : <>
          <div className="modal-head"><div className="mh-title" style={{ display: 'flex', alignItems: 'center', gap: 9 }}><Icon name="check" size={18} style={{ color: 'var(--success)' }} />Push-Back sent</div></div>
          <div className="modal-body">A notification went to <strong>{bom.creator}</strong>. The Designer will recommend {missing ? 'a component to add' : 'replacements'} via characteristic search; you'll get a <strong>Replacements recommended</strong> card on your dashboard to Apply.</div>
          <div className="modal-foot"><button className="btn primary" onClick={onClose}>Done</button></div>
        </>}
      </div>
    </div>
  );
}

/* ---- Sourcing Results ---- */
function SourcingResultsScreen({ id, go }) {
  const b = bomById(id);
  const [sel, setSel] = useStateRes(new Set());
  const [composer, setComposer] = useStateRes(false);
  const [missingMode, setMissingMode] = useStateRes(false);
  if (!b) return <div className="page"><EmptyState icon="boms" title="BOM not found." /></div>;
  const m = bomMeta(b);
  const exceptions = b.items.filter(i => i.status === 'needs-review' || i.status === 'exception');
  const toggle = (no) => setSel(s => { const n = new Set(s); n.has(no) ? n.delete(no) : n.add(no); return n; });
  const score = { mouser: b.items.filter(i => i.supplier === 'mouser').length, digikey: b.items.filter(i => i.supplier === 'digikey').length, wall: b.items.filter(i => i.status === 'check-wall').length, review: exceptions.length };

  return (
    <div className="page page-wide">
      <PipelineHeader b={b} go={go} stage="results" />
      <div className="scorecard" style={{ marginTop: 16 }}>
        <div className="stat"><div className="st-label"><span className="dot" style={{ background: 'var(--supplier-mouser)' }} /> Sourced — Mouser</div><div className="st-num" style={{ color: 'var(--supplier-mouser)' }}>{score.mouser}</div></div>
        <div className="stat"><div className="st-label"><span className="dot" style={{ background: 'var(--supplier-digikey)' }} /> Sourced — DigiKey</div><div className="st-num" style={{ color: 'var(--supplier-digikey)' }}>{score.digikey}</div></div>
        <div className="stat"><div className="st-label"><Icon name="alert" size={13} style={{ color: 'var(--warning)' }} /> Check wall</div><div className="st-num" style={{ color: 'var(--warning)' }}>{score.wall}</div></div>
        <div className="stat"><div className="st-label"><Icon name="alert" size={13} style={{ color: 'var(--danger)' }} /> Needs review</div><div className="st-num" style={{ color: score.review ? 'var(--danger)' : 'var(--success)' }}>{score.review}</div></div>
      </div>

      <div style={{ marginTop: 16 }}>
        {score.review > 0 ? (
          <Banner kind="danger" icon="alert" title={`${score.review} line${score.review > 1 ? 's' : ''} could not be sourced`}
            actions={<button className="btn sm danger" disabled={sel.size === 0} onClick={() => setComposer(true)}><Icon name="send" size={14} />Send {sel.size || ''} to designer</button>}>
            Select the lines to push back to engineering, then send an exception report. The rest are ready to package.
          </Banner>
        ) : (
          <Banner kind="info" icon="check" title="All lines sourced — ready to package"
            actions={<button className="btn sm primary" onClick={() => go({ screen: 'p.procurement', id: b.id })}><Icon name="package" size={14} />Create package</button>}>
            Every line has a supplier assignment. Create the procurement package to hand off to Purchasing.
          </Banner>
        )}
      </div>

      <div style={{ marginTop: 14 }}>
        <BomTable items={b.items} editable={false} showSource selectable={score.review > 0} selected={sel} onToggle={toggle}
          defaultSort={{ col: 'ext', dir: -1 }} />
        <div className="tbl-wrap" style={{ borderTop: 0, borderRadius: 0, marginTop: -1 }}><Totals items={b.items} /></div>
      </div>

      <div style={{ display: 'flex', gap: 10, justifyContent: 'flex-end', marginTop: 18 }}>
        <button className="btn" onClick={() => { setMissingMode(true); setComposer(true); }}><Icon name="plus" size={15} />Request missing component</button>
        {score.review > 0 && <button className="btn danger" disabled={sel.size === 0} onClick={() => { setMissingMode(false); setComposer(true); }}><Icon name="send" size={15} />Send Push-Back to designer</button>}
        <button className="btn primary" disabled={score.review > 0} onClick={() => go({ screen: 'p.procurement', id: b.id })}><Icon name="package" size={15} />Create Procurement Package</button>
      </div>

      {composer && <ExceptionComposer bom={b} lineNos={sel} startMissing={missingMode} onClose={() => { setComposer(false); setMissingMode(false); setSel(new Set()); go({ screen: 'p.bomOverview', id: b.id }); }} />}
    </div>
  );
}

/* ---- Procurement Package ---- */
function ProcurementPackageScreen({ id, go }) {
  const b = bomById(id);
  const [pb, setPb] = useStateRes(b && b.partsbox ? 'created' : 'idle'); // idle | creating | created | failed
  const [note, setNote] = useStateRes('');
  const [sendOpen, setSendOpen] = useStateRes(false);
  if (!b) return <div className="page"><EmptyState icon="boms" title="BOM not found." /></div>;
  const m = bomMeta(b);
  const createPB = () => { setPb('creating'); setTimeout(() => { storeActions.createPackage(b.id); setPb('created'); }, 1100); };
  const submit = (n) => { storeActions.submitBomToPurchasing(b.id, n != null ? n : note); go({ screen: 'p.bomOverview', id: b.id }); };

  return (
    <div className="page page-wide">
      <PipelineHeader b={b} go={go} stage="procurement" />
      <div style={{ display: 'grid', gridTemplateColumns: '1.5fr 1fr', gap: 20, alignItems: 'start', marginTop: 16 }}>
        <div>
          <div className="panel" style={{ marginBottom: 16 }}>
            <div className="panel-head"><Icon name="package" size={16} /><span className="ph-title">PartsBox project</span></div>
            <div className="panel-body">
              {pb === 'idle' && <>
                <p style={{ marginTop: 0 }} className="secondary">Create a PartsBox project and import this BOM so Purchasing receives a structured, supplier-ready package.</p>
                <button className="btn primary" onClick={createPB}><Icon name="plus" size={15} />Create PartsBox project & import</button>
              </>}
              {pb === 'creating' && <div style={{ display: 'flex', alignItems: 'center', gap: 10 }}><span className="spinner" /><span>Creating PartsBox project and importing {m.lines} lines…</span></div>}
              {pb === 'created' && <div style={{ display: 'flex', alignItems: 'center', gap: 11 }}>
                <div className="attn-icon" style={{ background: 'var(--success-soft)', color: 'var(--success)' }}><Icon name="check" size={18} /></div>
                <div style={{ flex: 1 }}><div style={{ fontWeight: 600 }}>PartsBox project created</div><div className="caption mono">{b.partsbox || 'PB-' + b.id.replace('BOM-', '')} · {m.lines} lines imported</div></div>
                <a className="btn ghost sm" href="#" onClick={e => e.preventDefault()}><Icon name="external" size={14} />Open</a>
              </div>}
              {pb === 'failed' && <Banner kind="danger" icon="x" title="PartsBox import failed"
                actions={<button className="btn sm" onClick={createPB}>Retry</button>}>The PartsBox API returned an error (503). You can retry, or download the BOM as CSV and import manually.</Banner>}
              {pb !== 'failed' && pb !== 'idle' && <button className="btn-link" style={{ marginTop: 10 }} onClick={() => setPb('failed')}>Simulate failure</button>}
            </div>
          </div>
          <BomTable items={b.items} editable={false} showSource defaultSort={{ col: 'ext', dir: -1 }} maxHeight={360} />
