          <div className="tbl-wrap" style={{ borderTop: 0, borderRadius: 0, marginTop: -1 }}><Totals items={b.items} /></div>
        </div>

        <div className="card" style={{ padding: 16, position: 'sticky', top: 0 }}>
          <div className="h2" style={{ marginBottom: 12 }}>Submit to Purchasing</div>
          <dl className="kv" style={{ marginBottom: 14 }}>
            <dt>BOM</dt><dd style={{ fontWeight: 600 }}>{b.name}</dd>
            <dt>PCB Project</dt><dd>{PROJECTS[b.project].name}</dd>
            <dt>Build qty</dt><dd>{fmtInt(b.buildQty)} +{b.overage}%</dd>
            <dt>Lines</dt><dd>{m.lines}</dd>
            <dt>Est. total</dt><dd className="mono" style={{ fontWeight: 600 }}>{fmtUSD(m.total)}</dd>
            <dt>PartsBox</dt><dd>{pb === 'created' ? <span style={{ color: 'var(--success)' }}>Ready</span> : <span className="muted">Not created</span>}</dd>
          </dl>
          <button className="btn primary lg" style={{ width: '100%' }} disabled={pb === 'idle' || pb === 'creating'} onClick={() => setSendOpen(true)}><Icon name="send" size={16} />Send to purchasing bucket{pb === 'failed' && ' — flag PartsBox failure'}</button>
          {pb === 'idle' && <div className="caption" style={{ textAlign: 'center', marginTop: 8 }}>Create the PartsBox package first — or skip with [Retry] if the API is down</div>}
          {pb === 'failed' && <div className="caption" style={{ textAlign: 'center', marginTop: 8, color: 'var(--warning)' }}><Icon name="alert" size={13} /> Sending allowed — the lines will be flagged for Purchasing</div>}
          <div className="caption" style={{ marginTop: 12, display: 'flex', gap: 7, alignItems: 'flex-start' }}><Icon name="lock" size={14} style={{ marginTop: 1 }} />Sending locks this BOM. Engineering content becomes read-only while its lines pool toward the next purchasing batch.</div>
        </div>
      </div>
      {sendOpen && window.SendToBucketPanel && <window.SendToBucketPanel title="Send to purchasing bucket" sourceId={b.id} items={b.items} allowRecheck={false}
        summaryRows={[['BOM', b.name], ['PCB Project', PROJECTS[b.project].name], ['Build qty', `${fmtInt(b.buildQty)} +${b.overage}%`], ['Lines', m.lines], ['Est. total', <span className="mono" style={{ fontWeight: 600 }}>{fmtUSD(m.total)}</span>]]}
        onClose={() => setSendOpen(false)} onConfirm={(n) => { setSendOpen(false); submit(n); }} />}
    </div>
  );
}

Object.assign(window, { SourcingResultsScreen, ProcurementPackageScreen, ExceptionComposer });

</script>
<script type="text/babel" data-source="screen_bom_overview.jsx">
/* global React, Icon, StatusBadge, RoleTag, SupplierTag, Banner, EmptyState, TraceabilityStrip,
   BomTable, Totals, bomById, useStore, storeActions, lockFor, PROJECTS, CATALOG, BOM_BADGE, fmtUSD, fmtInt, bomMeta */
const { useState: useStateBO } = React;

function BomOverviewScreen({ id, go, tab }) {
  const b = bomById(id);
  const activeRole = useStore(s => s.activeRole);
  const audit = useStore(s => s.audit.filter(a => a.entity === id));
  const curTab = tab || 'overview';
  const setTab = (t) => go({ screen: 'p.bomOverview', id, tab: t });
  if (!b) return <div className="page"><EmptyState icon="boms" title="BOM not found." /></div>;
  const m = bomMeta(b);
  const lock = lockFor('bom', b.state, activeRole);
  const isProd = activeRole === 'production';
  const editable = isProd && ['validated', 'normalised'].includes(b.state);

  // action bar (production only) — Run Sourcing is a constant; a state-specific next-step sits beside it.
  let action = null;
  if (isProd) {
    if (b.state === 'results' && m.exceptions > 0) action = { label: 'Resolve exceptions', icon: 'alert', go: { screen: 'p.results', id }, kind: 'danger' };
    else if (b.state === 'results') action = { label: 'Create package', icon: 'package', go: { screen: 'p.procurement', id }, kind: 'primary' };

  }

  return (
    <div className="page page-wide">
      <div className="page-head" style={{ marginBottom: 4 }}>
        <div className="ph-titles">
          <button className="btn-link" style={{ marginBottom: 8 }} onClick={() => go(isProd ? { screen: 'projectDetail', id: b.project } : { screen: 'projects' })}>← {isProd ? 'PCB Project' : 'BOMs'}</button>
          <div className="h1">{b.name}</div>
        </div>
        <div className="ph-actions">
          {isProd && <button className={`btn ${action ? '' : 'primary'}`} onClick={() => go({ screen: 'p.sourcing', id })}><Icon name="refresh" size={15} />Run Sourcing</button>}
          {action && <button className={`btn ${action.kind === 'danger' ? 'danger' : 'primary'}`} onClick={() => go(action.go)}><Icon name={action.icon} size={15} />{action.label}</button>}
        </div>
      </div>
      <TraceabilityStrip name={b.name} status={BOM_BADGE[b.state]} creator={b.creator} role="production"
        project={PROJECTS[b.project].name} updated={b.updated} updatedBy={b.updatedBy} recordId={b.reqId || b.id}
        onProject={() => go({ screen: 'projectDetail', id: b.project })} />

      {window.RelatedLinks && <window.RelatedLinks items={[
        { kind: 'PCB Project', label: PROJECTS[b.project].name, icon: 'folder', onClick: () => go({ screen: 'projectDetail', id: b.project }) },
        b.sourceCollection && { kind: 'Source Collection', label: b.sourceCollection, icon: 'layers', onClick: () => go({ screen: 'd.collectionDetail', id: b.sourceCollection }) },
        b.reqId && { kind: 'Request', label: b.reqId, icon: 'inbox', onClick: () => go({ screen: 'purchasingEmbed', tab: b.reqId }) },
      ]} />}

      {lock && <Banner kind="lock" title={lock.title}>{lock.body} Next action owned by <RoleTag role={lock.owner} />. You can still: {lock.canDo}.</Banner>}
      {b.state === 'exceptions' && b.pushback && (
        <Banner kind="warn" icon="alert" title={b.pushback.recommendation ? `Replacements recommended by ${b.pushback.recommendation.by} — awaiting Production Apply` : `Push-Back sent to ${b.pushback.to} · loop ${b.pushback.loop} of ${3}`}>
          {b.pushback.note}<div className="caption" style={{ marginTop: 4 }}>{b.pushback.recommendation ? 'Production applies the recommendation to commit it to the master BOM.' : 'Waiting for engineering recommendations — Designer resolves on their dashboard.'} {b.pushback.loop >= 3 && <strong style={{ color: 'var(--danger)' }}>Escalation threshold reached.</strong>}</div>
        </Banner>
      )}

      <div className="tabs" style={{ marginTop: 16 }}>
        {[['overview', 'Overview'], ['lines', `Lines · ${m.lines}`], ['history', 'History'], ['comments', `Comments · ${(useStore(s => s.comments[b.id]) || []).length}`]].map(([k, l]) => (
          <div key={k} className={`tab${curTab === k ? ' active' : ''}`} onClick={() => setTab(k)}>{l}</div>
        ))}
      </div>

      {curTab === 'overview' && (
        <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: 20, alignItems: 'start' }}>
          <div className="card" style={{ padding: 18 }}>
            <div className="h2" style={{ marginBottom: 12 }}>Details</div>
            <dl className="kv">
              <dt>Status</dt><dd><StatusBadge status={BOM_BADGE[b.state]} /></dd>
              <dt>PCB Project</dt><dd>{PROJECTS[b.project].name}</dd>
              <dt>Build quantity</dt><dd>{fmtInt(b.buildQty)} units +{b.overage}% overage</dd>
              <dt>Created by</dt><dd>{b.creator}</dd>
              <dt>Source</dt><dd>{b.sourceCollection ? <span className="mono" style={{ color: 'var(--action)', cursor: 'pointer' }} onClick={() => go({ screen: 'd.collectionDetail', id: b.sourceCollection })}>{b.sourceCollection}</span> : <span className="muted">Manual upload</span>}</dd>
              <dt>PartsBox</dt><dd>{b.partsbox ? <span className="mono">{b.partsbox}</span> : <span className="muted">Not created</span>}</dd>
              {b.reqId && <><dt>Request</dt><dd className="mono" style={{ color: 'var(--action)', cursor: 'pointer' }} onClick={() => go({ screen: 'purchasingEmbed', tab: b.reqId })}>{b.reqId}</dd></>}
            </dl>
          </div>
          <div className="card" style={{ padding: 18 }}>
            <div className="h2" style={{ marginBottom: 12 }}>Sourcing scorecard</div>
            <div className="scorecard" style={{ gridTemplateColumns: '1fr 1fr' }}>
              <div className="stat"><div className="st-label"><span className="dot" style={{ background: 'var(--supplier-mouser)' }} /> Mouser</div><div className="st-num" style={{ fontSize: 22, color: 'var(--supplier-mouser)' }}>{b.items.filter(i => i.supplier === 'mouser').length}</div></div>
              <div className="stat"><div className="st-label"><span className="dot" style={{ background: 'var(--supplier-digikey)' }} /> DigiKey</div><div className="st-num" style={{ fontSize: 22, color: 'var(--supplier-digikey)' }}>{b.items.filter(i => i.supplier === 'digikey').length}</div></div>
              <div className="stat"><div className="st-label"><Icon name="alert" size={13} style={{ color: 'var(--danger)' }} /> Needs review</div><div className="st-num" style={{ fontSize: 22, color: m.exceptions ? 'var(--danger)' : 'var(--success)' }}>{m.exceptions}</div></div>
              <div className="stat"><div className="st-label"><Icon name="dollar" size={13} /> Est. total</div><div className="st-num mono" style={{ fontSize: 20 }}>{fmtUSD(m.total)}</div></div>
            </div>
          </div>
        </div>
      )}

      {curTab === 'lines' && (<>
        {editable ? <ProdBomLines bom={b} /> : <BomTable items={b.items} editable={false} showSource defaultSort={{ col: 'no', dir: 1 }} />}
        <div className="tbl-wrap" style={{ borderTop: 0, borderRadius: 0, marginTop: -1 }}><Totals items={b.items} /></div>
      </>)}

      {curTab === 'history' && (
        <div className="tbl-wrap flow">
          {audit.length === 0 ? <EmptyState icon="history" title="No history yet for this item." />
          : <table className="bom"><thead><tr><th>When</th><th>User</th><th>Role</th><th>Action</th><th>Before</th><th>After</th></tr></thead><tbody>
            {audit.map((a, i) => <tr key={a.id} className={i % 2 ? 'alt' : ''}><td className="caption">{a.ts}</td><td>{a.user}</td><td><RoleTag role={a.role} /></td><td>{a.action}</td><td className="mono caption">{a.before}</td><td className="mono caption" style={{ fontWeight: 600 }}>{a.after}</td></tr>)}
          </tbody></table>}

      )}

      {curTab === 'comments' && (
        <div style={{ marginTop: 10 }}><CommentThread entityId={b.id} /></div>
      )}

}

/* ---- Production inline-edit table (v4) — non-structural free edit + MPN characteristic-match check ---- */
function ProdBomLines({ bom }) {
  return (
    <>
      <div className="banner info" style={{ marginBottom: 8 }}>
        <Icon name="info" size={16} />
        <div style={{ flex: 1 }}>
          <div className="bn-title">Inline editing{bom.version ? ` · master BOM v${bom.version}` : ''}</div>
          <div className="bn-body">Notes, description, and designator edit freely. Changing an <strong>MPN</strong> runs a characteristic-match check: an equivalent part swaps silently (version bumps); a mismatch offers <em>Send to Designer</em> or <em>Continue as override</em>.</div>
        </div>
      </div>
      <div className="tbl-wrap flow"><table className="bom">
        <thead><tr><th>#</th><th>MPN</th><th>Manufacturer</th><th>Description</th><th>Designator</th><th className="num">Qty</th><th>Status</th></tr></thead>
        <tbody>{bom.items.map(i => <ProdBomRow key={i.no} bom={bom} item={i} />)}</tbody>
      </table></div>
    </>
  );
}

function ProdBomRow({ bom, item }) {
  const [edit, setEdit] = useStateBO(null);
  const [draft, setDraft] = useStateBO('');
  const [flag, setFlag] = useStateBO(null);   // { newMpn, newMfr, diffs, unknown }
  const [mode, setMode] = useStateBO(null);   // 'override' → reason entry
  const [reason, setReason] = useStateBO('');

  const begin = (field, cur) => { setEdit(field); setDraft(cur == null ? '' : String(cur)); };
  const commitMeta = (field) => { const v = draft.trim(); setEdit(null); if (v !== (item[field] == null ? '' : String(item[field]))) storeActions.editBomLineField(bom.id, item.no, field, v); };
  const commitQty = () => { const n = parseInt(draft, 10); setEdit(null); if (!isNaN(n) && n > 0) storeActions.updateQty(bom.id, item.no, n); };
  const commitMpn = () => {
    const newMpn = draft.trim(); setEdit(null);
    if (!newMpn || newMpn === item.mpn) return;
    const res = window.characteristicMatch((window.CATALOG[item.mpn] && window.CATALOG[item.mpn].desc) || item.desc, newMpn);
    if (res.ok) storeActions.commitEquivalentSwap(bom.id, item.no, newMpn, res.candMfr, 'spec-matched');
    else setFlag({ newMpn, newMfr: res.candMfr, diffs: res.diffs, unknown: res.unknown });
  };

  const Cell = ({ field, structural, onCommit, val }) => edit === field
    ? <input className="cell-edit" autoFocus value={draft} onChange={e => setDraft(e.target.value)} onBlur={onCommit} onKeyDown={e => { if (e.key === 'Enter') onCommit(); if (e.key === 'Escape') setEdit(null); }} />
    : <span className="cell-editable" style={structural ? { borderBottom: '1px dashed var(--action)' } : undefined} onClick={() => begin(field, val)} title={structural ? 'Structural — runs a characteristic-match check' : 'Click to edit'}>{val == null || val === '' ? '—' : val}</span>;

  const rowCls = flag ? 'warn' : (item.status === 'needs-review' || item.status === 'exception' ? 'exception' : '');
  return (
    <>
      <tr className={rowCls}>
        <td className="num muted">{item.no}</td>
        <td className="mono" style={{ fontWeight: 600 }}><Cell field="mpn" structural val={item.mpn} onCommit={commitMpn} />{item.replacement && <span className="caption" style={{ display: 'block', color: 'var(--success)', fontFamily: 'var(--font-sans)' }}>↳ was {item.replacement.from}</span>}</td>
        <td><Cell field="mfr" val={item.mfr} onCommit={() => commitMeta('mfr')} /></td>
        <td className="secondary" style={{ maxWidth: 240 }}><Cell field="desc" val={item.desc} onCommit={() => commitMeta('desc')} /></td>
        <td className="mono caption"><Cell field="designator" val={item.designator} onCommit={() => commitMeta('designator')} /></td>
        <td className="num"><Cell field="qty" val={item.qty} onCommit={commitQty} /></td>
        <td><StatusBadge status={item.status} /></td>
      </tr>
      {flag && (
        <tr className="warn"><td colSpan={7} style={{ padding: '10px 14px', background: 'var(--warning-soft)' }}>
          <div style={{ display: 'flex', alignItems: 'flex-start', gap: 10 }}>
            <Icon name="alert" size={18} style={{ color: 'var(--warning)', marginTop: 2 }} />
            <div style={{ flex: 1 }}>
              <div style={{ fontWeight: 700 }}>{flag.unknown ? `Can't verify ${flag.newMpn} against suppliers` : `This differs from the original in ${flag.diffs.join(', ')}`}</div>
              <div className="caption" style={{ marginTop: 2 }}><span className="mono">{item.mpn}</span> → <span className="mono">{flag.newMpn}</span>{flag.newMfr ? ` · ${flag.newMfr}` : ''}. Send it to Designer for engineering judgment, or continue as an override (the edit is not committed until you choose).</div>
              {mode === 'override' ? (
                <div style={{ marginTop: 8 }}>
                  <textarea className="input" style={{ minHeight: 44 }} placeholder="Audit reason (required, min 10 chars)…" value={reason} onChange={e => setReason(e.target.value)} />
                  <div style={{ display: 'flex', gap: 8, justifyContent: 'flex-end', marginTop: 6 }}>
                    <button className="btn sm ghost" onClick={() => { setMode(null); setReason(''); }}>Back</button>
                    <button className="btn sm danger" disabled={reason.trim().length < 10} onClick={() => { storeActions.commitOverride(bom.id, item.no, flag.newMpn, flag.newMfr, reason.trim()); setFlag(null); setMode(null); setReason(''); }}>Commit override &amp; log</button>
                  </div>
                </div>
              ) : (
                <div style={{ display: 'flex', gap: 8, marginTop: 8, flexWrap: 'wrap' }}>
                  <button className="btn sm ghost" onClick={() => setFlag(null)}>Cancel</button>
                  <button className="btn sm" onClick={() => { storeActions.pushbackFromEdit(bom.id, item.no, flag.newMpn, flag.diffs); setFlag(null); }}><Icon name="send" size={13} />Send to Designer</button>
                  <button className="btn sm primary" onClick={() => setMode('override')}>Continue as override</button>
                </div>
              )}
            </div>
          </div>
        </td></tr>
      )}
    </>
  );
}

Object.assign(window, { BomOverviewScreen });

</script>
<script type="text/babel" data-source="screen_embedded.jsx">
/* global React, Icon, StatusBadge, RoleTag, SupplierTag, Banner, EmptyState, useStore, storeActions,
   getState, PROJECTS, fmtUSD */
/* AutoBOM — Embedded surfaces (Purchasing v4 + Inventory/Receiving/Programs shells).
   Purchasing and Inventory are NOT login roles. They are surfaces embedded inside the
   Designer and Production workspaces, reachable from those sidebars. */
const { useState: useStateEmb, useEffect: useEffEmb } = React;

/* CPN is generated by the canonical window.cpnFor (data.jsx) — sigil format, read-only. */

/* Flatten requests → part rows carrying request context + sigil CPN. */
function partRows(requests) {
  const out = [];
  for (const r of requests) {
    (r.items || []).forEach((i, idx) => out.push({
      key: `${r.id}:${i.no ?? idx}`, reqId: r.id, project: r.project, from: r.from, fromRole: r.fromRole,
      submitted: r.submitted, critical: r.critical, bucketState: r.bucketState, sourceId: r.sourceId, sourceLabel: r.title,
      mpn: i.mpn, mfr: i.mfr, desc: i.desc, supplier: i.supplier, qty: i.qty, ext: i.ext, cpn: window.cpnFor(r, i), scope: window.cpnScope ? window.cpnScope(r) : 'project',
    }));
  }
  return out;
}

const fmtC = (m) => m >= 60 ? `${Math.floor(m / 60)}h ${m % 60}m` : `${m}m`;

/* ============================================================
   Embedded Purchasing view (v4) — Full / My submissions toggle.
   ============================================================ */
function EmbeddedPurchasing({ go, focusReq }) {
  const requests = useStore(s => s.requests);
  const batch = useStore(s => s.system.batch);
  const me = useStore(s => s.users.find(u => u.id === s.currentUserId));
  const activeRole = useStore(s => s.activeRole);
  // Admin opens Purchasing in Full mode by default; Designer/Production see their own submissions.
  const [mode, setMode] = useStateEmb(() => sessionStorage.getItem('autobom.purchasing.mode') || (activeRole === 'admin' ? 'full' : 'filtered'));
  const focusReqObj = focusReq ? requests.find(r => r.id === focusReq) : null;
  const focusInArchive = !!focusReqObj && (focusReqObj.bucketState === 'WRITTEN' || focusReqObj.bucketState === 'PURCHASED');
  const [tab, setTab] = useStateEmb(() => focusInArchive ? 'archive' : 'buckets');
  const setModeP = (m) => { setMode(m); sessionStorage.setItem('autobom.purchasing.mode', m); };

  const mine = (r) => r.from === (me && me.name);
  const inFlight = requests;
  const scoped = mode === 'filtered' ? inFlight.filter(mine) : inFlight;

  const preBatch = scoped.filter(r => r.bucketState === 'QUEUED_CRITICAL' || r.bucketState === 'QUEUED_MAIN');
  const criticalParts = partRows(preBatch.filter(r => r.bucketState === 'QUEUED_CRITICAL' || r.critical));
  const mainParts = partRows(preBatch.filter(r => !(r.bucketState === 'QUEUED_CRITICAL' || r.critical)));

  // Sent-to-sheet archive — batches that have been written (mocked from WRITTEN/PURCHASED requests).
  const written = scoped.filter(r => r.bucketState === 'WRITTEN' || r.bucketState === 'PURCHASED');
  const batches = buildArchive(written, mode, me);

  return (
    <div className="page">
      <div className="page-head">
        <div className="ph-titles">
          <div className="display" style={{ display: 'flex', alignItems: 'center', gap: 12 }}><Icon name="cart" size={24} />Purchasing</div>
          <div className="ph-sub">A shared view of what's queued and what's been sent to the Daily Purchasing List. Purchasing is not a role — it's a window anyone can look through.</div>
        </div>
        <div className="ph-actions">
          <div className="seg-toggle">
            <button className={mode === 'full' ? 'on' : ''} onClick={() => setModeP('full')}>Full</button>
            <button className={mode === 'filtered' ? 'on' : ''} onClick={() => setModeP('filtered')}>My submissions</button>
          </div>
        </div>
      </div>

      <div className="onedrive-banner">
        <span className="od-dot" /><Icon name="external" size={15} />
        <div style={{ flex: 1 }}>
          <div style={{ fontWeight: 600 }}>Live integration — Daily Purchasing List (OneDrive)</div>
          <div className="caption">Critical batches every {fmtC(batch.critical.intervalMin)} · Main every {fmtC(batch.main.intervalMin)} · atomic writes · 12-column sheet unchanged, no CPN column.</div>
        </div>
      </div>

      <div className="tabs" style={{ margin: '4px 0 14px' }}>
        {[['buckets', 'Live buckets'], ['archive', 'Sent to sheet']].map(([k, l]) => (
          <div key={k} className={`tab${tab === k ? ' active' : ''}`} onClick={() => setTab(k)}>{l}</div>
        ))}
      </div>

      {tab === 'buckets' ? (
        <>
          <BucketSection critical parts={criticalParts} cfg={batch.critical} mode={mode} flashReq={focusReq} />
          <BucketSection parts={mainParts} cfg={batch.main} mode={mode} flashReq={focusReq} />
        </>
      ) : (
        <ArchiveSection batches={batches} mode={mode} flashReq={focusReq} />
      )}
    </div>
  );
}

function BucketSection({ critical, parts, cfg, mode, flashReq }) {
  const HEADERS = <tr><th>Part</th><th>CPN</th><th>Project</th>{mode === 'full' && <th>Requester</th>}<th>Supplier</th><th className="num">Qty</th><th className="num">Est. cost</th><th>Submitted</th></tr>;
  return (
    <div className="obs-section">
      <div className={`bucket-head${critical ? ' critical' : ''}`}>
        <span className="bucket-flag"><Icon name={critical ? 'alert' : 'layers'} size={14} />{critical ? 'CRITICAL' : 'MAIN BUCKET'}</span>
        <span className="bucket-count">{parts.length} part{parts.length === 1 ? '' : 's'}</span>
        <span className="batch-timer"><Icon name="clock" size={13} />next batch in {fmtC(cfg.nextRunMin)}</span>
      </div>
      {parts.length === 0 ? (
        <div className={`bucket-empty${critical ? ' critical' : ''}`}>No parts in {critical ? 'Critical' : 'Main'} bucket. Next batch in {fmtC(cfg.nextRunMin)}.</div>
      ) : (
        <div className="tbl-wrap flow"><table className="bom"><thead>{HEADERS}</thead><tbody>
          {parts.map(p => (
            <tr key={p.key} style={flashReq && p.reqId === flashReq ? { background: 'var(--action-soft)' } : undefined}>
              <td><div className="mono" style={{ fontWeight: 600 }}>{p.mpn}</div><div className="caption">{p.mfr}{p.desc && p.desc !== '—' ? ` · ${p.desc}` : ''}</div></td>
              <td><span className="cpn-cell"><span className="mono caption" title="Customer Part Number — read-only">{p.cpn}</span><span className={`scope-pill ${p.scope}`}>{p.scope}</span></span></td>
              <td className="secondary">{PROJECTS[p.project].name}</td>
              {mode === 'full' && <td><RoleTag role={p.fromRole} /> <span className="caption">{p.from}</span></td>}
              <td>{p.supplier ? <SupplierTag supplier={p.supplier} /> : <span className="muted">—</span>}</td>
              <td className="num">{p.qty}</td>
              <td className="num mono">{p.ext != null ? fmtUSD(p.ext) : '—'}</td>
              <td className="caption">{p.submitted}</td>
            </tr>
          ))}
        </tbody></table></div>
      )}
    </div>
  );
}

/* Build sent-to-sheet archive batches. Each batch = one atomic write event. */
function buildArchive(written, mode, me) {
  if (written.length === 0) return [];
  // Group into two mock batches by critical flag for demonstration.
  const groups = { Critical: [], Main: [] };
  written.forEach(r => (r.critical ? groups.Critical : groups.Main).push(r));
  const batches = [];
  Object.entries(groups).forEach(([type, reqs]) => {
    if (reqs.length === 0) return;
    const lines = partRows(reqs);
    const received = lines.filter(l => l.bucketState === 'PURCHASED').length;
    batches.push({
      id: `BATCH-${type}-01`, type, when: type === 'Critical' ? 'Today 14:00' : 'Today 12:00',
      lines, total: lines.reduce((a, l) => a + (l.ext || 0), 0),
      received, count: lines.length,
    });
  });
  return batches;
}

function ArchiveSection({ batches, mode, flashReq }) {
  if (batches.length === 0) return <div className="card"><EmptyState icon="check" title="No batches sent yet." sub="When a batch timer fires, its rows are written to the Daily Purchasing List and appear here." /></div>;
  return <div style={{ display: 'flex', flexDirection: 'column', gap: 12 }}>{batches.map(b => <ArchiveBatch key={b.id} batch={b} mode={mode} flashReq={flashReq} />)}</div>;
}

function ArchiveBatch({ batch, mode, flashReq }) {
  const [open, setOpen] = useStateEmb(() => !!flashReq && batch.lines.some(l => l.reqId === flashReq));
  const pct = batch.count ? Math.round(batch.received / batch.count * 100) : 0;
  return (
    <div className="card" style={{ padding: 0, overflow: 'hidden' }}>
      <div className="panel-head" style={{ cursor: 'pointer' }} onClick={() => setOpen(o => !o)}>
        <Icon name={open ? 'chevdown' : 'chevright'} size={15} />
        <span className="ph-title">{batch.type} batch</span>
        <span className="mono caption">{batch.id}</span>
        <span className="ph-meta" style={{ marginLeft: 'auto', display: 'flex', gap: 14, alignItems: 'center' }}>
          <span>{batch.when}</span><span>{batch.count} rows</span>
          <span style={{ display: 'inline-flex', alignItems: 'center', gap: 6 }}>{batch.received}/{batch.count} received
            <span className="mini-progress"><i style={{ width: pct + '%' }} /></span></span>
          <span className="mono" style={{ fontWeight: 700 }}>{fmtUSD(batch.total)}</span>
        </span>
      </div>
      {open && (
        <div className="tbl-wrap flow" style={{ border: 0 }}><table className="bom">
          <thead><tr><th>CPN</th><th>Part</th><th className="num">Qty</th><th>Supplier</th><th>Destination</th><th>Urgency</th><th>Fulfillment</th></tr></thead>
          <tbody>{batch.lines.map(l => {
            const state = l.bucketState === 'PURCHASED' ? 'full' : 'none';
            return (
              <tr key={l.key} style={flashReq && l.reqId === flashReq ? { background: 'var(--action-soft)' } : undefined}>
                <td><span className="cpn-cell"><span className="mono caption">{l.cpn}</span><span className={`scope-pill ${l.scope || 'project'}`}>{l.scope || 'project'}</span></span></td>
                <td className="mono" style={{ fontWeight: 600 }}>{l.mpn}</td>
                <td className="num">{l.qty}</td>
                <td>{l.supplier ? <SupplierTag supplier={l.supplier} /> : '—'}</td>
                <td className="secondary">{l.scope === 'wall' ? 'Wall' : PROJECTS[l.project].name}</td>
                <td className="caption">{batch.type === 'Critical' ? 'Next Day' : '2-Day'}</td>
                <td>{state === 'full'
                  ? <span className="badge filled" style={{ background: 'var(--success)' }}><Icon name="check" size={11} />Fully received</span>
                  : <span className="badge outlined" style={{ color: 'var(--text-muted)' }}><Icon name="circle" size={10} />Not received</span>}</td>
              </tr>
            );
          })}</tbody>
        </table></div>
      )}
    </div>
  );
}

/* ============================================================
   Embedded Inventory / Receiving / Programs — shells (full build in next layer)
   ============================================================ */
function EmbeddedInventory({ go }) {
  const parts = useStore(s => s.inventory || []);
  const [q, setQ] = useStateEmb('');
  const [kind, setKind] = useStateEmb('all');
  const [cat, setCat] = useStateEmb('all');
  const stats = window.PARTSBOX_STATS || { totalParts: parts.length, totalUnits: parts.reduce((a, p) => a + (p.onHand || 0), 0), distinctBins: 0 };
  const cats = ['all', ...[...new Set(parts.map(p => p.cat).filter(Boolean))].sort()];
  const rows = parts.filter(p => {
    if (kind === 'project' && !p.locations.some(l => l.kind === 'project')) return false;
    if (kind === 'wall' && !p.locations.some(l => l.kind === 'wall')) return false;
    if (cat !== 'all' && p.cat !== cat) return false;
    if (q && !(`${p.mpn} ${p.mfr} ${p.desc}`.toLowerCase().includes(q.toLowerCase()))) return false;
    return true;
  });
  return (
    <div className="page">
      <div className="page-head">
        <div className="ph-titles"><div className="display" style={{ display: 'flex', alignItems: 'center', gap: 12 }}><Icon name="box" size={24} />Inventory</div>
          <div className="ph-sub">A transparent, live library of every electrical component on hand — backed by PartsBox. Same view for everyone.</div></div>
        <div className="ph-actions"><button className="btn primary" onClick={() => go({ screen: 'receiving' })}><Icon name="box" size={15} />Start receiving</button></div>
      </div>
      <div className="stat-row" style={{ marginBottom: 12 }}>
        <div className="stat"><div className="st-label"><Icon name="box" size={13} /> Distinct parts</div><div className="st-num">{stats.totalParts}</div><div className="st-sub">in the library</div></div>
        <div className="stat"><div className="st-label"><Icon name="layers" size={13} /> Units on hand</div><div className="st-num">{stats.totalUnits.toLocaleString()}</div><div className="st-sub">across all storage</div></div>
        <div className="stat"><div className="st-label"><Icon name="folder" size={13} /> Storage locations</div><div className="st-num">{stats.distinctBins}</div><div className="st-sub">wall bins + project boxes</div></div>
      </div>
      <div className="sync-bar"><span className="od-dot" /> Live · last synced just now <button className="btn sm ghost" style={{ marginLeft: 8 }}><Icon name="refresh" size={13} />Refresh</button>
        <span className="caption" style={{ marginLeft: 'auto' }}>PartsBox is the source of truth · every part links out</span></div>
      <div className="filterbar" style={{ margin: '12px 0', gap: 10, flexWrap: 'wrap' }}>
        <div className="seg-toggle">
          {[['all', 'All'], ['project', 'Project boxes'], ['wall', 'Development wall']].map(([k, l]) => (
            <button key={k} className={kind === k ? 'on' : ''} onClick={() => setKind(k)}>{l}</button>
          ))}
        </div>
        <select className="select" value={cat} onChange={e => setCat(e.target.value)}>{cats.map(c => <option key={c} value={c}>{c === 'all' ? 'All categories' : c}</option>)}</select>
        <div className="searchfield" style={{ minWidth: 220 }}><Icon name="search" size={14} style={{ color: 'var(--text-muted)' }} /><input value={q} placeholder="Search MPN, description…" onChange={e => setQ(e.target.value)} /></div>
        <span className="caption" style={{ marginLeft: 'auto', alignSelf: 'center' }}>{rows.length} of {parts.length} parts</span>
      </div>
      {rows.length === 0 ? <div className="card"><EmptyState icon="box" title="No parts match." /></div> : (
        <div className="tbl-wrap flow"><table className="bom">
          <thead><tr><th>Part</th><th className="num">On hand</th><th>Storage</th><th>Tags</th><th></th></tr></thead>
          <tbody>{rows.map(p => (
            <tr key={p.mpn}>
              <td><div className="mono" style={{ fontWeight: 600 }}>{p.mpn}{p.low && <span className="badge filled" style={{ background: 'var(--danger)', marginLeft: 8 }}><Icon name="alert" size={10} />LOW</span>}</div><div className="caption">{p.desc}{p.fp ? ` · ${p.fp}` : ''}</div></td>
              <td className="num" style={{ fontWeight: 600 }}>{p.onHand}</td>
              <td><div style={{ display: 'flex', gap: 6, flexWrap: 'wrap' }}>{p.locations.map((l, i) => <button key={i} className={`loc-chip ${l.kind}`} style={{ cursor: 'pointer', border: 0 }} onClick={() => go({ screen: 'storageDetail', id: l.name })} title="Open storage location">{l.name} · {l.qty}</button>)}</div></td>
              <td><div style={{ display: 'flex', gap: 5, flexWrap: 'wrap' }}>{(p.tags || []).map(t => <span key={t} className="tag-chip">{t}</span>)}</div></td>
              <td style={{ textAlign: 'right' }}><a className="btn sm ghost" href="#" onClick={e => e.preventDefault()}>Open in PartsBox ↗</a></td>
            </tr>
          ))}</tbody>
        </table></div>
      )}
    </div>
  );
}

function ReceivingScreen({ go }) {
  return (
    <div className="page">
      <div className="page-head"><div className="ph-titles">
        <button className="btn-link" style={{ marginBottom: 8 }} onClick={() => go({ screen: 'inventoryEmbed' })}>← Inventory</button>
        <div className="display" style={{ display: 'flex', alignItems: 'center', gap: 12 }}><Icon name="box" size={24} />Receiving</div>
        <div className="ph-sub">Scanner-first. Scan any bag from any project or general stock, in any order — routing is automatic.</div></div></div>
      <div className="card" style={{ padding: 28, textAlign: 'center', maxWidth: 620, margin: '10px auto' }}>
        <div style={{ width: 56, height: 56, borderRadius: 14, background: 'var(--action-soft)', display: 'grid', placeItems: 'center', margin: '0 auto 14px', color: 'var(--action)' }}><Icon name="box" size={26} /></div>
        <div className="h2">Ready to scan</div>
        <p className="secondary" style={{ marginTop: 6 }}>Point the USB scanner at a bag's QR label. AutoBOM parses the CPN, checks for duplicates, routes by sigil, and writes stock to PartsBox.</p>
        <input className="input mono" style={{ marginTop: 14, textAlign: 'center' }} placeholder="Scanner input appears here…" autoFocus />
        <div className="caption" style={{ marginTop: 16 }}>Full receiving flow — scan cards, wall-bin disambiguation, duplicate detection — arrives in the Inventory Activation build.</div>
      </div>
    </div>
  );
}

/* ============================================================
   Programs (v4 — top-level org layer above Project)
   ============================================================ */
function ProgramsScreen({ go }) {
  const programs = useStore(s => s.programs || []);
  const projects = useStore(s => s.projects);
  const [showNew, setShowNew] = useStateEmb(false);
  return (
    <div className="page">
      <div className="page-head"><div className="ph-titles">
        <div className="display" style={{ display: 'flex', alignItems: 'center', gap: 12 }}><Icon name="folder" size={24} />Programs</div>
        <div className="ph-sub">The top of the hierarchy. A Program groups the Projects, Collections, and BOMs of one contract or product line.</div></div>
        <div className="ph-actions"><button className="btn primary" onClick={() => setShowNew(true)}><Icon name="plus" size={15} />New Program</button></div></div>
      <div className="prog-grid">
        {programs.map(p => (
          <button key={p.id} className="prog-card" onClick={() => go({ screen: 'programDetail', id: p.id })}>
            <div className="prog-card-head">
              <span className="prog-code">{p.identifier || p.code}</span>
              <span className={`badge outlined`} style={{ color: 'var(--success)', borderColor: 'var(--success)' }}>{p.status}</span>
            </div>
            <div className="prog-name">{p.name}</div>
            <div className="caption" style={{ margin: '4px 0 10px' }}>{p.desc}</div>
            <div className="prog-meta">
              <span><Icon name="user" size={12} /> {p.owner}</span>
              <span><Icon name="folder" size={12} /> {p.projects.length} project{p.projects.length === 1 ? '' : 's'}</span>
              {p.customer && <span><Icon name="sparkle" size={12} /> {p.customer}</span>}
            </div>
          </button>
        ))}
      </div>
      {showNew && <window.CreateProgramModal go={go} onClose={() => setShowNew(false)} />}
    </div>
  );
}

function ProgramDetailScreen({ id, go }) {
  const program = useStore(s => (s.programs || []).find(p => p.id === id));
  const activeRole = useStore(s => s.activeRole);
  const projects = useStore(s => s.projects);
  const collections = useStore(s => s.collections);
  const boms = useStore(s => s.boms);
  const [newColl, setNewColl] = useStateEmb(false);
  if (!program) return <div className="page"><EmptyState icon="folder" title="Program not found." actions={<button className="btn primary" onClick={() => go({ screen: 'programs' })}>All programs</button>} /></div>;
  const projRows = program.projects.map(pid => projects[pid]).filter(Boolean);
  const progCollections = collections.filter(c => (c.program_id === program.id || program.projects.includes(c.project)) && c.role === 'designer');

  return (
    <div className="page">
      <div className="page-head"><div className="ph-titles">
        <button className="btn-link" style={{ marginBottom: 8 }} onClick={() => go({ screen: 'programs' })}>← Programs</button>
        <div className="display" style={{ display: 'flex', alignItems: 'center', gap: 12 }}><span className="prog-code lg">{program.code}</span>{program.name}</div>
        <div className="ph-sub">{program.desc}</div>
      </div></div>

      <div className="stat-row" style={{ marginBottom: 18 }}>
        <div className="stat"><div className="st-label"><Icon name="user" size={13} /> Owner</div><div className="st-num" style={{ fontSize: 18 }}>{program.owner}</div><div className="st-sub">{program.status}</div></div>
        <div className="stat"><div className="st-label"><Icon name="folder" size={13} /> PCB Projects</div><div className="st-num">{projRows.length}</div><div className="st-sub">under this program</div></div>
        <div className="stat"><div className="st-label"><Icon name="layers" size={13} /> Collections</div><div className="st-num">{progCollections.length}</div><div className="st-sub">exploration</div></div>
      </div>

      {activeRole === 'admin' && (
        <div className="card" style={{ padding: 14, marginBottom: 16, display: 'flex', alignItems: 'center', gap: 12 }}>
          <Icon name="bell" size={16} style={{ color: 'var(--text-muted)' }} />
          <div style={{ flex: 1 }}>
            <div style={{ fontWeight: 600 }}>Notify Program owner of equivalent-part swaps</div>
            <div className="caption">When on, Production's silent characteristic-match swaps on this Program's linked Projects send an FYI to {program.owner}. Override notifications always fire regardless.</div>
          </div>
          <button type="button" role="switch" aria-checked={program.notifyOnEquivalentSwap !== false} className={`switch${program.notifyOnEquivalentSwap !== false ? ' on' : ''}`} onClick={() => storeActions.setProgramNotify(program.id, !(program.notifyOnEquivalentSwap !== false))}><span className="knob" /></button>
        </div>
      )}

      <div className="panel">
        <div className="panel-head"><Icon name="folder" size={15} /><span className="ph-title">PCB Projects</span><span className="ph-meta" style={{ marginLeft: 'auto' }}>Read-only references · Production owns Projects</span></div>
        <div className="tbl-wrap flow" style={{ border: 0 }}><table className="bom">
          <thead><tr><th>Reference</th><th>Name</th><th>Status</th><th>Lead</th></tr></thead>
          <tbody>{projRows.map(pr => (
            <tr key={pr.id} style={{ cursor: 'pointer' }} onClick={() => go({ screen: 'projectDetail', id: pr.id })}>
              <td className="mono" style={{ fontWeight: 600 }}>{(program.identifier || program.code)}-{pr.identifier || pr.id.slice(0, 4).toUpperCase()}</td>
              <td>{pr.name}</td>
              <td><span className="badge outlined" style={{ color: 'var(--success)' }}>{pr.status}</span></td>
              <td>{pr.lead}</td>
            </tr>
          ))}</tbody>
        </table></div>
      </div>

      <div className="panel" style={{ marginTop: 16 }}>
        <div className="panel-head"><Icon name="layers" size={15} style={{ color: 'var(--role-designer)' }} /><span className="ph-title">Collections at program level</span>
          <button className="btn sm primary" style={{ marginLeft: 'auto' }} onClick={() => setNewColl(true)}><Icon name="plus" size={14} />New Collection</button></div>
        {progCollections.length === 0 ? <EmptyState icon="layers" title="No collections yet." sub="Create a collection to gather candidate parts for this program." /> : (
          <div style={{ padding: 8 }}>{progCollections.map(c => (
            <div key={c.id} className="prog-coll-row" onClick={() => go({ screen: 'd.collectionDetail', id: c.id })}>
              <Icon name="layers" size={15} style={{ color: 'var(--role-designer)' }} />
              <span style={{ fontWeight: 600 }}>{c.name}</span>
              <span className="caption">{(c.project && projects[c.project]) ? projects[c.project].name : program.name} · {c.items.length} parts</span>
              <StatusBadge status={c.state} />
            </div>
          ))}</div>
        )}
      </div>
      {newColl && <window.NewCollectionModal kind="designer" defaultProgram={program.id} onClose={() => setNewColl(false)} onCreated={(cid) => { setNewColl(false); go({ screen: 'd.collectionDetail', id: cid }); }} />}
    </div>
  );
}

/* ============================================================
   Storage location detail (v4 — new build, first-class route)
   Inventory · Storage locations · <name>. Reads PartsBox contents live.
   ============================================================ */
function StorageDetailScreen({ id, go }) {
  const name = id;
  const inventory = useStore(s => s.inventory || []);
  const rows = [];
  let kind = 'wall';
  inventory.forEach(p => (p.locations || []).forEach(l => {
    if (l.name === name) { rows.push({ mpn: p.mpn, desc: p.desc, qty: l.qty, onHand: p.onHand, cat: p.cat, low: p.low }); if (l.kind === 'project') kind = 'project'; }
  }));
  const units = rows.reduce((a, r) => a + (r.qty || 0), 0);
  const tag = kind === 'project' ? 'production' : 'development';
  if (rows.length === 0) return <div className="page"><EmptyState icon="folder" title="Storage location not found." sub={name}
    actions={<button className="btn primary" onClick={() => go({ screen: 'inventoryEmbed' })}>Back to Inventory</button>} /></div>;
  return (
    <div className="page">
      <div className="page-head">
        <div className="ph-titles">
          <button className="btn-link" style={{ marginBottom: 8 }} onClick={() => go({ screen: 'inventoryEmbed' })}>← Inventory</button>
          <div className="display" style={{ display: 'flex', alignItems: 'center', gap: 12 }}><Icon name="folder" size={22} /><span className="mono">{name}</span></div>
          <div className="ph-sub">A PartsBox storage location. AutoBOM reads its contents live — this view never leaves the app.</div>
        </div>
        <div className="ph-actions" style={{ display: 'flex', gap: 8 }}>
          <button className="btn" onClick={() => go({ screen: 'receiving' })}><Icon name="plus" size={15} />Add stock</button>
          <button className="btn" onClick={() => window.__toast?.('Move parts arrives with the receiving rebuild.', 'box')}><Icon name="arrow" size={15} />Move parts</button>
        </div>
      </div>
      <div className="stat-row" style={{ marginBottom: 12 }}>
        <div className="stat"><div className="st-label"><Icon name="box" size={13} /> Distinct parts</div><div className="st-num">{rows.length}</div><div className="st-sub">stored here</div></div>
        <div className="stat"><div className="st-label"><Icon name="layers" size={13} /> Units on hand</div><div className="st-num">{units.toLocaleString()}</div><div className="st-sub">in this location</div></div>
        <div className="stat"><div className="st-label"><Icon name="tag" size={13} /> Storage kind</div><div className="st-num" style={{ fontSize: 17 }}>{kind === 'project' ? 'Project box' : 'Development wall'}</div><div className="st-sub"><span className={`loc-chip ${kind}`}>{tag}</span></div></div>
      </div>
      <div className="sync-bar"><span className="od-dot" /> Live · PartsBox is the source of truth<span className="caption" style={{ marginLeft: 'auto' }}>Every part links out to its PartsBox record</span></div>
      <div className="tbl-wrap flow" style={{ marginTop: 12 }}><table className="bom">
        <thead><tr><th>Part</th><th className="num">Qty here</th><th className="num">Total on hand</th><th>Category</th><th></th></tr></thead>
        <tbody>{rows.map(r => (
          <tr key={r.mpn}>
            <td><div className="mono" style={{ fontWeight: 600 }}>{r.mpn}{r.low && <span className="badge filled" style={{ background: 'var(--danger)', marginLeft: 8 }}><Icon name="alert" size={10} />LOW</span>}</div><div className="caption">{r.desc}</div></td>
            <td className="num" style={{ fontWeight: 600 }}>{r.qty}</td>
            <td className="num">{r.onHand}</td>
            <td className="caption">{r.cat || '—'}</td>
            <td style={{ textAlign: 'right' }}><a className="btn sm ghost" href="#" onClick={e => e.preventDefault()}>Open in PartsBox ↗</a></td>
          </tr>
        ))}</tbody>
      </table></div>
    </div>
  );
}

Object.assign(window, { EmbeddedPurchasing, EmbeddedInventory, ReceivingScreen, StorageDetailScreen, ProgramsScreen, ProgramDetailScreen });

</script>
<script type="text/babel" data-source="screen_admin.jsx">
/* global React, Icon, StatusBadge, RoleTag, RoleDot, Banner, EmptyState, Avatar, Popover, NeedsAttention,
   useStore, storeActions, ROLE_META, CAPS, fmtUSD, fmtInt */
const { useState: useStateAdm, useRef: useRefAdm } = React;

const ALL_ROLES_FULL = ['designer', 'production', 'development', 'manager', 'executive', 'readonly', 'admin'];
/* v1.1: Development deferred — Admin can't assign it until the flag flips back on. */
const ALL_ROLES = ALL_ROLES_FULL.filter(r => r !== 'development' || window.DEV_ROLE_ENABLED);
const CAP_GROUPS_FULL = window.CAP_CATALOG;
/* Hide the Development capability group from the user-permission grid in MVP. */
const CAP_GROUPS = window.DEV_ROLE_ENABLED ? CAP_GROUPS_FULL : CAP_GROUPS_FULL.filter(g => g.group !== 'Development');

function StatusDot({ state }) {
  const c = { green: 'var(--success)', amber: 'var(--warning)', red: 'var(--danger)' }[state];
  return <span className="dot" style={{ background: c, width: 9, height: 9, boxShadow: `0 0 0 3px ${c}22` }} />;
}

/* ---- Admin Dashboard ---- */
function AdminDashboard({ go, flashId }) {
  const users = useStore(s => s.users);
  const system = useStore(s => s.system);
  const audit = useStore(s => s.audit);
  const [override, setOverride] = useStateAdm(false);
  const active = users.filter(u => u.active).length;
  const warn = system.status.filter(s => s.state !== 'green').length;

  return (
    <div className="page page-wide">
      <div className="page-head">
        <div className="ph-titles"><div className="display">Administration</div>
          <div className="ph-sub">Users, roles, permissions, suppliers, and system health. You own system recovery and configuration.</div></div>
        <div className="ph-actions"><button className="btn danger" onClick={() => setOverride(true)}><Icon name="alert" size={15} />Admin override</button></div>
      </div>

      <div className="na-mount" style={{ marginBottom: 18 }}><NeedsAttention role="admin" go={go} flashId={flashId} /></div>

      <div className="stat-row" style={{ marginBottom: 18 }}>
        <div className="stat"><div className="st-label"><Icon name="user" size={13} /> Active users</div><div className="st-num">{active}</div><div className="st-sub">of {users.length} total</div></div>
        <div className="stat"><div className="st-label"><Icon name="lock" size={13} /> Role assignments</div><div className="st-num">{users.reduce((a, u) => a + u.roles.length, 0)}</div><div className="st-sub">across all users</div></div>
        <div className="stat"><div className="st-label"><StatusDot state={warn ? 'amber' : 'green'} /> System health</div><div className="st-num" style={{ color: warn ? 'var(--warning)' : 'var(--success)' }}>{warn ? `${warn} warning` : 'All green'}</div><div className="st-sub">{system.status.length} services</div></div>
        <div className="stat"><div className="st-label"><Icon name="history" size={13} /> Audit events today</div><div className="st-num">{audit.length}</div><div className="st-sub">logged</div></div>
      </div>

      <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: 18, alignItems: 'start' }}>
        <div className="panel">
          <div className="panel-head"><Icon name="chart" size={16} /><span className="ph-title">System status</span>
            <button className="btn-link" style={{ marginLeft: 'auto' }} onClick={() => go({ screen: 'a.configuration', tab: 'system' })}>Configuration</button></div>
          {system.status.map(s => (
            <div key={s.id} className="attn-item" style={{ padding: '11px 16px' }}>
              <StatusDot state={s.state} />
              <div style={{ flex: 1, minWidth: 0 }}>
                <div style={{ fontWeight: 600 }}>{s.label}</div>
                <div className="caption">{s.detail}</div>
              </div>
              {s.action === 'refresh-digikey' && (
                <button className="btn sm" onClick={() => window.__toast?.('DigiKey OAuth token refreshed — valid 24h', 'check')}><Icon name="refresh" size={13} />Refresh</button>
              )}
            </div>
          ))}
        </div>
        <div className="panel">
          <div className="panel-head"><Icon name="history" size={16} /><span className="ph-title">Recent activity</span>
            <button className="btn-link" style={{ marginLeft: 'auto' }} onClick={() => go({ screen: 'a.audit' })}>Full log</button></div>
          {audit.slice(0, 6).map(a => (
            <div key={a.id} className="attn-item" style={{ padding: '11px 16px' }}>
              <div className="attn-main"><div style={{ fontWeight: 600, fontSize: 13.5 }}>{a.action}</div>
                <div className="am-meta">{a.user} · <RoleTag role={a.role} /> · <span className="mono">{a.entity}</span> · {a.ts}</div></div>
            </div>
          ))}
        </div>
      </div>
      {override && <AdminOverrideModal onClose={() => setOverride(false)} />}
    </div>
  );
}

function AdminOverrideModal({ onClose }) {
  const [entity, setEntity] = useStateAdm('');
  const [target, setTarget] = useStateAdm('');

function EditRolesModal({ user, onClose }) {
  const [roles, setRoles] = useStateAdm([...user.roles]);
  const [overrides, setOverrides] = useStateAdm([...(user.overrides || [])]);
  const [tab, setTab] = useStateAdm('roles');
  const toggleRole = (r) => setRoles(rs => rs.includes(r) ? rs.filter(x => x !== r) : [...rs, r]);
  const toggleCap = (c) => setOverrides(os => os.includes(c) ? os.filter(x => x !== c) : [...os, c]);
  // capabilities the chosen roles already grant
  const baseCaps = new Set(); roles.forEach(r => (window.CAPS[r] || new Set()).forEach(c => baseCaps.add(c)));
  const effective = new Set([...baseCaps, ...overrides]);
  const overrideCount = overrides.filter(c => !baseCaps.has(c)).length;
  return (
    <div className="modal-wrap"><div className="scrim" onClick={onClose} />
      <div className="modal" style={{ position: 'relative', zIndex: 95, width: 720, maxWidth: '94vw' }}>
        <div className="modal-head"><div className="mh-title">Permissions — {user.name}</div>
          <div className="caption" style={{ marginTop: 4 }}>Base role grants the standard capability set. Per-user overrides add extra capabilities on top — for hybrid users without inventing a new role.</div></div>
        <div className="tabs" style={{ margin: '0 20px', borderBottom: '1px solid var(--border)' }}>
          {[['roles', `Base roles · ${roles.length}`], ['caps', `Capability overrides · ${overrideCount}`]].map(([k, l]) => (
            <div key={k} className={`tab${tab === k ? ' active' : ''}`} onClick={() => setTab(k)}>{l}</div>
          ))}
        </div>
        <div className="modal-body" style={{ maxHeight: '58vh', overflowY: 'auto' }}>
          {tab === 'roles' && (<>
            <p style={{ marginTop: 0 }} className="secondary">A user with no roles is Read-Only. Multiple roles enable the role switcher in their sidebar.</p>
            <div style={{ display: 'grid', gap: 6 }}>
              {ALL_ROLES.map(r => (
                <label key={r} className="role-row" style={{ borderColor: roles.includes(r) ? window.ROLE_META[r].color : 'var(--border-soft)', background: roles.includes(r) ? window.ROLE_META[r].color + '0e' : 'var(--bg-surface)' }}>
                  <input type="checkbox" checked={roles.includes(r)} onChange={() => toggleRole(r)} />
                  <RoleDot role={r} size={9} /><span style={{ fontWeight: 600, flex: 1 }}>{window.ROLE_META[r].label}</span>
                  <span className="caption">{window.ROLE_META[r].owns}</span>
                </label>
              ))}
            </div>
          </>)}
          {tab === 'caps' && (<>
            <p style={{ marginTop: 0 }} className="secondary">Capabilities granted by the user's base role are shown ticked and locked. Toggle additional capabilities below to grant them as user-level overrides.</p>
            {CAP_GROUPS.map(g => (
              <div key={g.group} className="cap-group">
                <div className="cap-group-label">{g.group}</div>
                {g.items.map(([cap, label]) => {
                  const inBase = baseCaps.has(cap);
                  const isOverride = overrides.includes(cap);
                  const on = inBase || isOverride;
                  return (
                    <label key={cap} className={`cap-row${inBase ? ' base' : ''}${isOverride && !inBase ? ' override' : ''}`}>
                      <input type="checkbox" checked={on} disabled={inBase} onChange={() => toggleCap(cap)} />
                      <span style={{ fontWeight: 500, flex: 1 }}>{label}</span>
                      {inBase ? <span className="caption" style={{ fontWeight: 600 }}>From base role</span>
                        : isOverride ? <span className="badge filled" style={{ background: 'var(--warning)' }}><Icon name="sparkle" size={11} />OVERRIDE — NOT IN BASE</span>
                          : <span className="caption">—</span>}
                    </label>
                  );
                })}
              </div>
            ))}
          </>)}
        </div>
        <div className="modal-foot">
          <span className="caption" style={{ marginRight: 'auto' }}>{effective.size} capabilities effective ({roles.length} role{roles.length !== 1 ? 's' : ''} + {overrideCount} override{overrideCount !== 1 ? 's' : ''})</span>
          <button className="btn" onClick={onClose}>Cancel</button>
          <button className="btn primary" onClick={() => {
            const newRoles = roles.length ? roles : ['readonly'];
            storeActions.setUserRoles(user.id, newRoles);
            const newCaps = new Set(); newRoles.forEach(r => (window.CAPS[r] || new Set()).forEach(c => newCaps.add(c)));
            const trimmedOverrides = overrides.filter(c => !newCaps.has(c));
            storeActions.setUserOverrides(user.id, trimmedOverrides);
            onClose();
          }}>Save</button>
        </div>
      </div>
    </div>
  );
}

              <td className="caption" style={{ whiteSpace: 'nowrap' }}>{a.ts}</td><td>{a.user}</td><td><RoleTag role={a.role} /></td>
              <td style={{ fontWeight: 600, color: 'var(--danger)' }}>{a.action}</td>
              <td className="mono caption">{a.entity}</td><td className="mono caption">{a.before}</td><td className="mono caption" style={{ fontWeight: 600 }}>{a.after}</td>
            </tr>
          ))}</tbody></table>}</div>
    </div>
  );
}

Object.assign(window, { AdminDashboard, UserManagement, RolesPermissions, WorkflowConfig, SupplierConfig, SystemSettings, AuditLog, AdminConfiguration, ForceWaiversLog });

</script>
<script type="text/babel" data-source="screen_development.jsx">
/* global React, Icon, StatusBadge, RoleTag, RoleDot, Avatar, Banner, EmptyState, TraceabilityStrip,
   RelatedLinks, useStore, storeActions, PROJECTS, fmtUSD, fmtInt */
const { useState: useStateV, useRef: useRefV } = React;

/* Map a dev-object state → badge key for the unified StatusBadge */
const DEV_BADGE = {
  investigation: { open: 'inv-open', analysis: 'inv-analysis', findings: 'inv-findings', closed: 'inv-closed' },
  recommendation: { draft: 'rec-draft', pushed: 'rec-pushed', accepted: 'rec-accepted', rejected: 'rec-rejected', investigating: 'rec-investigating' },
  rework: { draft: 'rw-draft', pushed: 'rw-pushed', inprogress: 'rw-inprogress', validated: 'rw-validated', returned: 'rw-returned' },
  firmware: { draft: 'fw-draft', released: 'fw-released', validating: 'fw-validating', validated: 'fw-validated' },
};
const DEV_KIND_META = {
  investigation: { label: 'Investigation', icon: 'search', listScreen: 'v.investigations', detailScreen: 'v.investigationDetail' },
  recommendation: { label: 'Improvement Recommendation', icon: 'sparkle', listScreen: 'v.recommendations', detailScreen: 'v.recommendationDetail' },
  rework: { label: 'Rework Package', icon: 'refresh', listScreen: 'v.rework', detailScreen: 'v.reworkDetail' },
  firmware: { label: 'Firmware Release', icon: 'upload', listScreen: 'v.firmware', detailScreen: 'v.firmwareDetail' },
};

function findObj(state, kind, id) {
  const map = { investigation: 'investigations', recommendation: 'recommendations', rework: 'reworks', firmware: 'firmwares' };
  return state[map[kind]].find(x => x.id === id);
}

/* ---------- Development Dashboard ---------- */
function DevelopmentDashboard({ go }) {
  const investigations = useStore(s => s.investigations);
  const recommendations = useStore(s => s.recommendations);
  const reworks = useStore(s => s.reworks);
  const firmwares = useStore(s => s.firmwares);
  const devCols = useStore(s => s.collections.filter(c => c.role === 'development'));

  const colsActive = devCols.filter(c => c.state === 'active');
  const colsAwaiting = devCols.filter(c => c.state === 'recommendation-sent');
  const colsRecent = [...devCols].sort((a, b) => (a.updated > b.updated ? -1 : 1)).slice(0, 4);

  // Handshakes awaiting action by another team
  const handshakes = [
    ...recommendations.filter(r => r.state === 'pushed').map(r => ({ kind: 'recommendation', obj: r, dir: 'out', team: 'Designer', actor: 'Designer' })),
    ...recommendations.filter(r => r.state === 'investigating').map(r => ({ kind: 'recommendation', obj: r, dir: 'in', team: 'Designer', actor: r.response?.by || 'Designer' })),
    ...reworks.filter(r => r.state === 'pushed' || r.state === 'inprogress').map(r => ({ kind: 'rework', obj: r, dir: 'out', team: 'Production', actor: 'Production' })),
    ...reworks.filter(r => r.state === 'returned').map(r => ({ kind: 'rework', obj: r, dir: 'in', team: 'Production', actor: r.results?.returnedBy })),
    ...firmwares.filter(f => f.state === 'validating').map(f => ({ kind: 'firmware', obj: f, dir: 'out', team: 'Production', actor: 'Production' })),
    ...investigations.filter(i => i.pushedFrom && i.state !== 'closed').map(i => ({ kind: 'investigation', obj: i, dir: 'in', team: i.pushedFrom.role, actor: i.pushedFrom.by })),
  ];

  const stats = [
    { label: 'Active Collections', n: colsActive.length, icon: 'layers' },
    { label: 'Awaiting Review', n: colsAwaiting.length, icon: 'send' },
    { label: 'Investigations in progress', n: investigations.filter(i => i.state !== 'closed').length, icon: 'search' },
    { label: 'Recs / Rework / FW open', n: recommendations.filter(r => r.state === 'pushed' || r.state === 'investigating').length + reworks.filter(r => r.state === 'pushed' || r.state === 'inprogress').length + firmwares.filter(f => f.state === 'validating').length, icon: 'refresh' },
  ];

  return (
    <div className="page">
      <div className="page-head">
        <div className="ph-titles"><div className="display">Development workspace</div>
          <div className="ph-sub">Investigate, improve, rework, release. You close the loop on every product.</div></div>
        <div className="ph-actions">
          <button className="btn" onClick={() => go({ screen: 'v.collections' })}><Icon name="layers" size={15} />New Development Collection</button>
          <button className="btn primary" style={{ background: 'var(--role-development)', borderColor: 'var(--role-development)' }} onClick={() => go({ screen: 'v.collections' })}><Icon name="plus" size={15} />Start Investigation</button>
        </div>
      </div>

      <div className="stat-row" style={{ marginBottom: 18 }}>
        {stats.map((s, i) => (
          <div key={i} className="stat"><div className="st-label"><Icon name={s.icon} size={13} style={{ color: 'var(--role-development)' }} /> {s.label}</div><div className="st-num" style={{ color: 'var(--role-development)' }}>{s.n}</div></div>
        ))}
      </div>

      {/* My Development Collections — card strip, most recently modified */}
      <div className="panel" style={{ marginBottom: 18 }}>
        <div className="panel-head"><Icon name="layers" size={16} style={{ color: 'var(--role-development)' }} /><span className="ph-title">My Development Collections</span>
          <button className="btn-link" style={{ marginLeft: 'auto' }} onClick={() => go({ screen: 'v.collections' })}>View all →</button></div>
        {colsRecent.length === 0 ? <EmptyState icon="layers" title="No development collections yet." sub="Start by creating a collection to investigate a question."
          actions={<button className="btn primary sm" onClick={() => go({ screen: 'v.collections' })}><Icon name="plus" size={14} />New collection</button>} />
        : <div style={{ display: 'grid', gridTemplateColumns: 'repeat(auto-fill, minmax(260px, 1fr))', gap: 12, padding: 14 }}>
          {colsRecent.map(c => (
            <div key={c.id} className="card" style={{ padding: 14, cursor: 'pointer', borderLeft: '3px solid var(--role-development)' }} onClick={() => go({ screen: 'v.collectionDetail', id: c.id })}>
              <div style={{ display: 'flex', alignItems: 'center', gap: 7, marginBottom: 7 }}>
                {window.DevKindGlyph && <window.DevKindGlyph kind="development" size={13} />}
                <span style={{ fontWeight: 600, fontSize: 14, flex: 1, minWidth: 0, overflow: 'hidden', textOverflow: 'ellipsis', whiteSpace: 'nowrap' }}>{c.name}</span>
              </div>
              <div style={{ display: 'flex', flexWrap: 'wrap', gap: 6, marginBottom: 8 }}>
                <StatusBadge status={window.DC_BADGE[c.state]} />
                {window.CategoryChip && <window.CategoryChip category={c.category} />}
              </div>
              <div className="caption">{PROJECTS[c.project].name} · {c.items.length} candidate{c.items.length !== 1 ? 's' : ''} · {c.updated}</div>
            </div>
          ))}
        </div>}
      </div>

      <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: 18, alignItems: 'start', marginBottom: 18 }}>
        {/* Active investigations (collections) */}
        <div className="panel">
          <div className="panel-head"><Icon name="search" size={16} style={{ color: 'var(--role-development)' }} /><span className="ph-title">Active Investigations</span></div>
          {colsActive.length === 0 ? <EmptyState icon="search" title="No active investigations." />
          : colsActive.map(c => (
            <div key={c.id} className="attn-item" style={{ cursor: 'pointer' }} onClick={() => go({ screen: 'v.collectionDetail', id: c.id })}>
              <div className="attn-main">
                <div style={{ display: 'flex', alignItems: 'center', gap: 9 }}><span style={{ fontWeight: 600, fontSize: 14 }}>{c.name}</span>{window.CategoryChip && <window.CategoryChip category={c.category} />}</div>
                <div className="am-meta">{PROJECTS[c.project].name} · {c.items.length} candidate{c.items.length !== 1 ? 's' : ''} · updated {c.updated}</div>
              </div>
              <Icon name="chevright" size={16} style={{ color: 'var(--text-muted)' }} />
            </div>
          ))}
        </div>

        {/* Recommendations awaiting review (collections that generated an outcome and are pending response) */}
        <div className="panel">
          <div className="panel-head"><Icon name="send" size={16} style={{ color: 'var(--role-development)' }} /><span className="ph-title">Recommendations Awaiting Review</span></div>
          {colsAwaiting.length === 0 ? <EmptyState icon="check" title="No outcomes awaiting response." />
          : colsAwaiting.map(c => {
            const o = c.outcomes && c.outcomes[0];
            return (
              <div key={c.id} className="attn-item" style={{ cursor: 'pointer' }} onClick={() => go({ screen: 'v.collectionDetail', id: c.id })}>
                <div className="attn-main">
                  <div style={{ display: 'flex', alignItems: 'center', gap: 9, flexWrap: 'wrap' }}>
                    <span style={{ fontWeight: 600, fontSize: 14 }}>{c.name}</span>
                    {o && <span className="mono caption">{o.linkedId}</span>}
                  </div>
                  <div className="am-meta">{o ? <>{o.label} → <RoleTag role={o.targetRole} /> · {o.when}</> : 'Awaiting'}</div>
                </div>
                <Icon name="chevright" size={16} style={{ color: 'var(--text-muted)' }} />
              </div>
            );
          })}
        </div>
      </div>

      {/* Cross-team handshakes (unchanged behaviour) */}
      <div className="panel">
        <div className="panel-head"><Icon name="link" size={16} style={{ color: 'var(--role-development)' }} /><span className="ph-title">Cross-team Handshakes</span><span className="ph-meta">{handshakes.length} active</span></div>
        {handshakes.length === 0 ? <EmptyState icon="check" title="No active handshakes." />
        : handshakes.map(({ kind, obj, dir, team }) => (
          <div key={kind + obj.id} className="attn-item" style={{ cursor: 'pointer' }} onClick={() => go({ screen: DEV_KIND_META[kind].detailScreen, id: obj.id })}>
            <div className="attn-icon" style={{ background: dir === 'out' ? 'var(--success-soft)' : 'var(--info-soft)', color: dir === 'out' ? 'var(--role-development)' : 'var(--info)' }}><Icon name={dir === 'out' ? 'send' : 'inbox'} size={18} /></div>
            <div className="attn-main">
              <div style={{ display: 'flex', alignItems: 'center', gap: 9, flexWrap: 'wrap' }}>
                <span className="caption" style={{ fontWeight: 700, color: 'var(--role-development)', textTransform: 'uppercase', fontSize: 10.5, letterSpacing: '.04em' }}>{dir === 'out' ? `Awaiting ${team}` : `From ${team}`}</span>
                <span className="mono caption">{obj.id}</span>
              </div>
              <div className="am-title">{obj.title}</div>
              <div className="am-meta">{DEV_KIND_META[kind].label} · {PROJECTS[obj.project].name} · updated {obj.updated}</div>
            </div>
            <div className="am-action"><StatusBadge status={DEV_BADGE[kind][obj.state]} /></div>
          </div>
        ))}
      </div>
    </div>
  );
}

function DevList({ title, icon, items, kind, go }) {
  return (
    <div className="panel">
      <div className="panel-head"><Icon name={icon} size={16} /><span className="ph-title">{title}</span></div>
      {items.length === 0 ? <EmptyState icon={icon} title={`No ${DEV_KIND_META[kind].label.toLowerCase()}s active.`} />
      : items.slice(0, 5).map(it => (
        <div key={it.id} className="attn-item" style={{ cursor: 'pointer' }} onClick={() => go({ screen: DEV_KIND_META[kind].detailScreen, id: it.id })}>
          <div className="attn-main">
            <div style={{ display: 'flex', alignItems: 'center', gap: 9 }}><span style={{ fontWeight: 600, fontSize: 14 }}>{it.title}</span><StatusBadge status={DEV_BADGE[kind][it.state]} /></div>
            <div className="am-meta">{PROJECTS[it.project].name} · {it.assignee} · updated {it.updated}</div>
          </div>
          <Icon name="chevright" size={16} style={{ color: 'var(--text-muted)' }} />
        </div>
      ))}
    </div>
  );
}

/* ---------- Generic list (used by all four dev object types) ---------- */
const FILTERS_BY_KIND = {
  investigation: [['all', 'All'], ['open', 'Open'], ['analysis', 'Analysis'], ['findings', 'Findings'], ['closed', 'Closed']],
  recommendation: [['all', 'All'], ['draft', 'Draft'], ['pushed', 'Awaiting designer'], ['investigating', 'Investigating'], ['accepted', 'Accepted'], ['rejected', 'Rejected']],
  rework: [['all', 'All'], ['draft', 'Draft'], ['pushed', 'Awaiting prod'], ['inprogress', 'In progress'], ['returned', 'Returned'], ['validated', 'Validated']],
  firmware: [['all', 'All'], ['draft', 'Draft'], ['released', 'Released'], ['validating', 'Validating'], ['validated', 'Validated']],
};
function DevListScreen({ kind, go }) {
  const map = { investigation: 'investigations', recommendation: 'recommendations', rework: 'reworks', firmware: 'firmwares' };
  const items = useStore(s => s[map[kind]]);
  const [ls, setLs] = window.useListState(`v.${kind}.list`, { filter: 'all' });
  const filter = ls.filter; const setFilter = (v) => setLs({ filter: v });
  const rows = filter === 'all' ? items : items.filter(x => x.state === filter);
  const counts = {}; FILTERS_BY_KIND[kind].forEach(([k]) => counts[k] = k === 'all' ? items.length : items.filter(x => x.state === k).length);
  const heading = { investigation: 'Investigations', recommendation: 'Improvement Recommendations', rework: 'Rework Packages', firmware: 'Firmware Releases' }[kind];
  const subhead = { investigation: 'Technical analysis you own — your discoveries, your root causes.', recommendation: 'Improvements pushed to Designer. Each one awaits an Accept / Reject / Investigate response.', rework: 'Rework procedures pushed to Production. Track progress and receive validated results.', firmware: 'Firmware releases pushed to Production for validation.' }[kind];

  return (
    <div className="page">
      <div className="page-head">
        <div className="ph-titles"><div className="display">{heading}</div><div className="ph-sub">{subhead}</div></div>
      </div>
      <div className="filterbar">
        {FILTERS_BY_KIND[kind].map(([k, l]) => <button key={k} className={`fchip${filter === k ? ' active' : ''}`} onClick={() => setFilter(k)}>{l}<span className="fc-n">{counts[k]}</span></button>)}
      </div>
      <div className="tbl-wrap flow" style={{ borderRadius: '0 0 10px 10px', borderTop: 0 }}>
        {rows.length === 0 ? <EmptyState icon={DEV_KIND_META[kind].icon} title={`No ${heading.toLowerCase()} in this filter.`} />
        : rows.map(it => (
          <div key={it.id} className="lrow" onClick={() => go({ screen: DEV_KIND_META[kind].detailScreen, id: it.id })}>
            <div style={{ minWidth: 0 }}>
              <div className="lr-title">{it.title}<StatusBadge status={DEV_BADGE[kind][it.state]} />{it.priority === 'high' && <span className="badge filled" style={{ background: 'var(--danger)' }}>HIGH</span>}</div>
              <div className="lr-meta">
                <span className="mono">{it.id}</span><span className="tr-sep" />
                <span style={{ display: 'inline-flex', alignItems: 'center', gap: 5 }}><Icon name="folder" size={13} />{PROJECTS[it.project].name}</span>
                <span className="tr-sep" /><span>{it.assignee}</span><span className="tr-sep" /><span>updated {it.updated}</span>
                {kind === 'rework' && it.boards && <><span className="tr-sep" /><span>{it.boards} units</span></>}
                {kind === 'firmware' && it.version && <><span className="tr-sep" /><span className="mono">v{it.version}</span></>}
              </div>
            </div>
          </div>
        ))}
      </div>
    </div>
  );
}

/* ---------- Handshake panel: the recurring UI on every dev detail ---------- */
function HandshakePanel({ obj, kind, go }) {
  const isPushedOut = ['pushed', 'investigating', 'inprogress', 'validating'].includes(obj.state);
  const isResolved = ['accepted', 'rejected', 'validated', 'returned', 'closed', 'findings'].includes(obj.state);
  const isIncoming = !!obj.pushedFrom;

  if (isIncoming && (obj.state === 'open' || obj.state === 'analysis')) {
    return (
      <Banner kind="info" icon="inbox" title={`Handshake from ${obj.pushedFrom.role} · ${obj.pushedFrom.by} · ${obj.pushedFrom.when}`}>
        {obj.pushedFrom.note}
      </Banner>
    );
  }
  if (isPushedOut && obj.pushedTo) {
    return (
      <Banner kind="info" icon="send" title={`Pushed to ${obj.pushedTo.role} · ${obj.pushedTo.when}`}>
        Awaiting response. {kind === 'recommendation' && 'Designer reviews and replies Accept / Reject / Investigate.'}
        {kind === 'rework' && 'Production executes the procedure and returns results.'}
        {kind === 'firmware' && 'Production validates the build and reports back.'}
      </Banner>
    );
  }
  if (kind === 'recommendation' && obj.response) {
    const colors = { accepted: 'info', rejected: 'danger', investigating: 'warn' };
    return (
      <Banner kind={colors[obj.response.decision]} icon={obj.response.decision === 'rejected' ? 'x' : 'check'} title={`${obj.response.decision.toUpperCase()} by ${obj.response.by} · ${obj.response.when}`}>
        {obj.response.note}
      </Banner>
    );
  }
  if (kind === 'rework' && obj.results) {
    return (
      <Banner kind="info" icon="check" title={`Returned by ${obj.results.returnedBy} · ${obj.results.returnedWhen}`}>
        {obj.results.note}
      </Banner>
    );
  }
  if (kind === 'firmware' && obj.results) {
    return (
      <Banner kind="info" icon="check" title={`Validated by ${obj.results.by} · ${obj.results.when}`}>
        {obj.results.note}
      </Banner>
    );
  }
  return null;
}

/* ---------- Detail screens ---------- */
function DevDetailShell({ kind, id, go, action, children }) {
  const obj = useStore(s => findObj(s, kind, id));
  if (!obj) return <div className="page"><EmptyState icon={DEV_KIND_META[kind].icon} title="Not found." /></div>;
  return (
    <div className="page page-wide">
      <div className="page-head" style={{ marginBottom: 4 }}>
        <div className="ph-titles">
          <button className="btn-link" style={{ marginBottom: 8 }} onClick={() => go({ screen: DEV_KIND_META[kind].listScreen })}>← {DEV_KIND_META[kind].label}s</button>
          <div className="h1">{obj.title}</div>
        </div>
        <div className="ph-actions">
          {action}
        </div>
      </div>
      <TraceabilityStrip name={obj.id} status={DEV_BADGE[kind][obj.state]} creator={obj.owner} role="development"
        project={PROJECTS[obj.project].name} updated={obj.updated} recordId={obj.id} onProject={() => go({ screen: 'projectDetail', id: obj.project })} />
      <RelatedLinks items={[
        { kind: 'PCB Project', label: PROJECTS[obj.project].name, icon: 'folder', onClick: () => go({ screen: 'projectDetail', id: obj.project }) },
        obj.relatedBom && { kind: 'BOM', label: obj.relatedBom, icon: 'boms', onClick: () => go({ screen: 'p.bomOverview', id: obj.relatedBom }) },
        obj.relatedCollection && { kind: 'Collection', label: obj.relatedCollection, icon: 'layers', onClick: () => go({ screen: 'd.collectionDetail', id: obj.relatedCollection }) },
      ]} />
      <HandshakePanel obj={obj} kind={kind} go={go} />
      <p className="secondary" style={{ margin: '10px 0 0', maxWidth: 760 }}>{obj.desc}</p>
      <div style={{ marginTop: 18 }}>{children(obj)}</div>
      <div style={{ marginTop: 26 }}><CommentThread entityId={obj.id} /></div>
    </div>
  );
}

function InvestigationDetail({ id, go }) {
  return <DevDetailShell kind="investigation" id={id} go={go}
    action={<button className="btn primary"><Icon name="check" size={15} />Post findings</button>}>
    {(obj) => (
      <div className="card" style={{ padding: 18 }}>
        <div className="h2" style={{ marginBottom: 10 }}>Findings</div>
        {obj.findings.length === 0 ? <p className="muted">No findings logged yet.</p>
          : <ul style={{ margin: 0, paddingLeft: 18 }}>{obj.findings.map((f, i) => <li key={i} style={{ marginBottom: 6 }}>{f}</li>)}</ul>}
      </div>
    )}
  </DevDetailShell>;
}

function RecommendationDetail({ id, go }) {
  const obj = useStore(s => s.recommendations.find(x => x.id === id));
  const [respond, setRespond] = useStateV(null); // 'accepted' | 'rejected' | 'investigating'
  const [note, setNote] = useStateV('');
  const activeRole = useStore(s => s.activeRole);
  const canRespond = activeRole === 'designer' && obj && (obj.state === 'pushed' || obj.state === 'investigating');
  const canPush = activeRole === 'development' && obj && obj.state === 'draft';

  return <DevDetailShell kind="recommendation" id={id} go={go}
    action={canRespond ? (
      <>
        <button className="btn danger" onClick={() => setRespond('rejected')}><Icon name="x" size={15} />Reject</button>
        <button className="btn" onClick={() => setRespond('investigating')}><Icon name="search" size={15} />Investigate</button>
        <button className="btn primary" onClick={() => setRespond('accepted')}><Icon name="check" size={15} />Accept</button>
      </>
    ) : canPush ? <button className="btn primary" onClick={() => storeActions.pushRecommendation(id)}><Icon name="send" size={15} />Push to Designer</button> : null}>
    {(obj) => (
      <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: 16 }}>
        <div className="card" style={{ padding: 16 }}>
          <div className="caption" style={{ fontWeight: 700, color: 'var(--danger)', textTransform: 'uppercase', fontSize: 10.5, letterSpacing: '.04em' }}>Current</div>
          <div className="mono" style={{ fontWeight: 700, fontSize: 18, marginTop: 4 }}>{obj.currentMpn || '—'}</div>
        </div>
        <div className="card" style={{ padding: 16 }}>
          <div className="caption" style={{ fontWeight: 700, color: 'var(--success)', textTransform: 'uppercase', fontSize: 10.5, letterSpacing: '.04em' }}>Proposed</div>
          <div className="mono" style={{ fontWeight: 700, fontSize: 18, marginTop: 4, color: 'var(--role-development)' }}>{obj.proposedMpn || '—'}</div>
        </div>
        {respond && <div className="modal-wrap"><div className="scrim" onClick={() => setRespond(null)} />
          <div className="modal" style={{ position: 'relative', zIndex: 95 }}>
            <div className="modal-head"><div className="mh-title">{respond[0].toUpperCase() + respond.slice(1)} recommendation</div></div>
            <div className="modal-body">
              <p style={{ marginTop: 0 }} className="secondary">A response is sent back to {obj.owner}. {respond === 'rejected' && 'A reason is required.'}</p>
              <textarea className="textarea" placeholder="Add a note for Development…" value={note} onChange={e => setNote(e.target.value)} />
            </div>
            <div className="modal-foot">
              <button className="btn" onClick={() => setRespond(null)}>Cancel</button>
