<script type="text/babel" data-source="store.jsx">
/* global React, seedState, uid, line, CATALOG */
/* AutoBOM — shared workflow store. A single connected state with actions that
   mutate global state and propagate notifications + audit across every role. */
const { useSyncExternalStore } = React;

let STATE = seedState();

const listeners = new Set();
function emit() { STATE = { ...STATE }; listeners.forEach(l => l()); }
function subscribe(l) { listeners.add(l); return () => listeners.delete(l); }
function getState() { return STATE; }

const actorName = () => 'Aaron Jones';

function pushNotif(n) {
  // Derive the new-shape fields when callers haven't set them yet.
  // This keeps existing call sites working while new ones can pass routes{} + actionLabel + verb directly.
  const v = (n.verb || 'View').trim();
  const isFyi = n.kind === 'fyi' || /^(view|track|open)/i.test(v);
  const forRoles = n.forRoles || (n.routes ? Object.keys(n.routes) : []);
  const sourceRole = n.sourceRole || n.actorRole || null;
  // Resolver-ready destination per role. If caller gave routes{}, trust it;
  // otherwise fall back to the legacy single `go` for every forRoles member.
  const routes = n.routes || (n.go ? Object.fromEntries(forRoles.map(r => [r, n.go])) : {});
  const targetRole = n.targetRole || forRoles[0] || null;
  STATE.notifications = [{
    id: uid('n'), group: 'Today', unread: true, when: 'just now',
    kind: isFyi ? 'fyi' : 'action', actionLabel: n.actionLabel || null,
    sourceRole, targetRole, routes, ...n,
  }, ...STATE.notifications];
}

/* Resolve where a clicked notification should take the viewer.
   Spec: route to where THE USER can act, in THEIR workspace — never the originator.
   - Prefer the route keyed by the user's currently-active role.
   - Else, if the user holds the targetRole, return that route + switchTo so the
     app can switch context with a sticky "Switched to X" banner (Option A).
   - Else, return any route the user can reach (any role they hold), no switch.
   - Else (no role match — happens for FYI notifs the user shouldn't see), pick
     the first route as a last resort and don't switch.

   Returns { route, switchTo } where switchTo is the role to switch TO (or null). */
function resolveNotificationRoute(notif, user, activeRole) {
  const routes = (notif && notif.routes) || {};
  const userRoles = (user && user.roles) || [];
  // 1. Currently-active role wins outright.
  if (routes[activeRole]) return { route: routes[activeRole], switchTo: null };
  // 2. Target role the user actually holds → auto-switch.
  if (notif.targetRole && userRoles.includes(notif.targetRole) && routes[notif.targetRole])
    return { route: routes[notif.targetRole], switchTo: notif.targetRole };
  // 3. Any other role the user holds.
  for (const r of userRoles) if (routes[r]) return { route: routes[r], switchTo: r };
  // 4. Last resort.
  const k = Object.keys(routes)[0];
  return k ? { route: routes[k], switchTo: null } : { route: { screen: 'notifications' }, switchTo: null };
}
function pushAudit(a) {
  const ts = 'Today ' + new Date().toLocaleTimeString('en-US', { hour: '2-digit', minute: '2-digit', hour12: false });
  STATE.audit = [{ id: uid('au'), ts, user: actorName(), role: STATE.activeRole, ...a }, ...STATE.audit];
}

const sum = (items, sup) => items.filter(i => i.supplier === sup).reduce((a, i) => a + (i.ext || 0), 0);
const grand = (items) => items.reduce((a, i) => a + (i.ext || 0), 0);

/* ---------------- ACTIONS ---------------- */
const ROLE_PREFIX = { designer: 'd', production: 'p', purchasing: 'b', development: 'v', admin: 'a' };
const actions = {
  setRole(role) {
    STATE.activeRole = role;
    emit();
  },

  /* DESIGNER */
  addToCollection(mpn, collectionId, newName) {
    let col = STATE.collections.find(c => c.id === collectionId);
    if (!col && newName) {
      col = { id: 'COL-0' + (STATE.seq.col++), name: newName, project: 'tvca-rev2', state: 'active',
        creator: actorName(), ownerId: (STATE.currentUserId || "u-aaron"), role: 'designer', updated: 'just now', updatedBy: actorName(), created: 'Today', desc: '', items: [] };
      STATE.collections = [col, ...STATE.collections];
    }
    if (!col) return;
    const c = CATALOG[mpn];
    const no = col.items.length + 1;
    const rec = c && c.recommend;
    col.items = [...col.items, line(no, mpn, 1, rec ? 'sourced-' + rec : 'needs-review')];
    col.updated = 'just now'; col.updatedBy = actorName();
    pushAudit({ action: 'Part added to collection', entity: col.id, before: `${no - 1} parts`, after: `${no} parts` });
    emit();
    return col;
  },
  updateQty(collectionId, no, qty) {
    const col = STATE.collections.find(c => c.id === collectionId); if (!col) return;
    col.items = col.items.map(i => i.no === no ? { ...i, qty, ext: i.unit != null ? +(i.unit * qty).toFixed(2) : null } : i);
    col.updated = 'just now'; emit();
  },
  requestToOrder(collectionId, note, critical) {
    const col = STATE.collections.find(c => c.id === collectionId); if (!col) return;
    const reqId = 'REQ-0' + (STATE.seq.req++);
    col.state = 'order-requested'; col.reqId = reqId; col.updated = 'just now'; col.updatedBy = actorName();
    STATE.requests = [{ id: reqId, title: col.name, kind: 'collection', sourceId: col.id, project: col.project,
      from: actorName(), fromRole: 'designer', submitted: 'just now', age: 0, critical: !!critical, bucketState: critical ? 'QUEUED_CRITICAL' : 'QUEUED_MAIN', note: note || '', resubmit: !!col.rejection, items: col.items }, ...STATE.requests];
    // Dropping a request into the bucket is NOT a request for Purchasing's permission —
    // Purchasing doesn't approve/reject/review. No action notification is sent to Purchasing.
    // (The bucket view is the surface; an item simply appears there.)
    pushAudit({ action: 'Collection submitted to Purchasing', entity: col.id, before: 'ACTIVE', after: 'ORDER REQUESTED' });
    emit(); return reqId;
  },
  /* Designer resolves a Push-Back — produces a RECOMMENDATION, never mutates the master BOM.
     Production applies it from their Dashboard (applyPushbackRecommendation). */
  resolvePushback(bomId, { recommendations, note }) {
    const bom = STATE.boms.find(b => b.id === bomId); if (!bom || !bom.pushback) return;
    bom.pushback.recommendation = {
      by: actorName(), when: 'just now', note: note || '',
      picks: (recommendations || []).map(r => ({ lineNo: r.lineNo != null ? r.lineNo : null, added: !!r.added,
        mpn: r.candidate.mpn, mfr: r.candidate.mfr || '', desc: r.candidate.desc || '', section: r.candidate.section || 'supplier',
        location: r.candidate.location || null, datasheet: r.candidate.datasheet || null, request: r.request || null })),
    };
    bom.pushback.recommendation.picks.forEach(p => actions.attachDatasheet(p.mpn, p.datasheet)); // datasheet on user-action
    bom.updated = 'just now'; bom.updatedBy = actorName();
    const n = bom.pushback.recommendation.picks.length;
    pushNotif({ forRoles: ['production'], targetRole: 'production', sourceRole: 'designer', kind: 'action',
      type: 'REPLACEMENTS RECOMMENDED', actorRole: 'designer',
      actionLabel: 'Apply replacements', verb: 'Resolve',
      body: `${bom.name} · ${n} replacement${n > 1 ? 's' : ''} recommended by ${actorName()} — review and Apply to the master BOM.`,
      who: actorName(), entity: bom.id,
      routes: { production: { screen: 'p.dashboard' }, designer: { screen: 'p.bomOverview', id: bom.id } } });
    pushAudit({ action: 'Push-Back resolved — recommendations sent', entity: bom.id, before: 'EXCEPTIONS', after: 'EXCEPTIONS (recommended)' });
    emit();
  },
  /* Production commits Designer's recommendation to the master BOM (version increments). */
  applyPushbackRecommendation(bomId) {
    const bom = STATE.boms.find(b => b.id === bomId); if (!bom || !bom.pushback || !bom.pushback.recommendation) return;
    const rec = bom.pushback.recommendation;
    rec.picks.forEach(p => {
      if (p.added) {
        const no = bom.items.length + 1; const c = CATALOG[p.mpn] || {};
        bom.items = [...bom.items, line(no, p.mpn, (p.request && p.request.quantityPerBoard) || 1, c.recommend ? 'sourced-' + c.recommend : 'needs-review')];
      } else {
        bom.items = bom.items.map(i => {
          if (i.no !== p.lineNo) return i; const c = CATALOG[p.mpn] || {};
          return { ...i, mpn: p.mpn, mfr: p.mfr || c.mfr || i.mfr, desc: c.desc || p.desc || i.desc, status: 'validated', exReason: null, replacement: { from: i.mpn, by: rec.by } };
        });
      }
      actions.attachDatasheet(p.mpn, p.datasheet);
    });
    bom.version = (bom.version || 1) + 1;
    bom.state = 'normalised'; bom.updated = 'just now'; bom.updatedBy = actorName();
    bom.pushback.appliedBy = actorName(); bom.pushback.appliedWhen = 'just now';
    pushNotif({ forRoles: ['production'], targetRole: 'production', sourceRole: 'production', kind: 'action',
      type: 'REPLACEMENTS APPLIED', actorRole: 'production', actionLabel: 'Re-run sourcing', verb: 'Resolve',
      body: `${bom.name} · recommendations applied to master BOM v${bom.version} — ready for re-sourcing.`, who: actorName(), entity: bom.id,
      routes: { production: { screen: 'p.sourcing', id: bom.id }, designer: { screen: 'p.bomOverview', id: bom.id } } });
    pushAudit({ action: `Recommendations applied to master BOM (v${bom.version})`, entity: bom.id, before: 'EXCEPTIONS', after: 'NORMALISED' });
    emit();
  },
  /* Datasheet lifecycle — attach to PartsBox on user-action; skip if already attached.
     Background op; a real failure would surface to Admin diagnostics (not modelled here). */
  attachDatasheet(mpn, url) {
    if (!mpn || !url) return;
    STATE.datasheets = STATE.datasheets || {};
    if (STATE.datasheets[mpn]) return; // already attached
    STATE.datasheets[mpn] = url;
    pushAudit({ action: 'Datasheet attached to PartsBox', entity: mpn, before: '—', after: 'attachment/type=datasheet' });
  },
  /* Push-Back secondary paths (Production Alignment v1.1.1). */
  commentPushback(bomId, text) {
    const bom = STATE.boms.find(b => b.id === bomId); if (!bom || !bom.pushback) return;
    bom.pushback.comments = [...(bom.pushback.comments || []), { by: actorName(), when: 'just now', body: text }];
    pushAudit({ action: 'Push-Back comment', entity: bom.id, before: '—', after: text.slice(0, 60) });
    emit();
  },
  deferPushback(bomId, reason) {
    const bom = STATE.boms.find(b => b.id === bomId); if (!bom || !bom.pushback) return;
    bom.pushback.deferred = { by: actorName(), when: 'just now', reason };
    pushAudit({ action: 'Push-Back deferred', entity: bom.id, before: '—', after: reason.slice(0, 60) });
    emit();
  },
  reassignPushback(bomId, note) {
    const bom = STATE.boms.find(b => b.id === bomId); if (!bom || !bom.pushback) return;
    bom.pushback.reassignedNote = note;
    pushAudit({ action: 'Push-Back reassigned', entity: bom.id, before: '—', after: note.slice(0, 60) });
    emit();
  },
  /* PRODUCTION inline-edit (v4). Non-structural fields free-edit; structural MPN/mfr go
     through the characteristic-match check (commitEquivalentSwap on match, commitOverride
     after a mismatch the user chooses to override). */
  editBomLineField(bomId, no, field, value) {
    const bom = STATE.boms.find(b => b.id === bomId); if (!bom) return;
    bom.items = bom.items.map(i => i.no === no ? { ...i, [field]: value } : i);
    bom.updated = 'just now'; bom.updatedBy = actorName();
    pushAudit({ action: `BOM line ${no} ${field} edited`, entity: bom.id, before: '—', after: String(value).slice(0, 40) });
    emit();
  },
  commitEquivalentSwap(bomId, no, newMpn, newMfr, delta) {
    const bom = STATE.boms.find(b => b.id === bomId); if (!bom) return;
    let oldMpn = '';
    bom.items = bom.items.map(i => { if (i.no !== no) return i; oldMpn = i.mpn; const c = CATALOG[newMpn] || {}; return { ...i, mpn: newMpn, mfr: newMfr || c.mfr || i.mfr, desc: c.desc || i.desc, replacement: { from: i.mpn, by: actorName() } }; });
    bom.version = (bom.version || 1) + 1; bom.updated = 'just now'; bom.updatedBy = actorName();
    pushAudit({ action: `Characteristic-match equivalent swap: ${oldMpn} → ${newMpn}${delta ? ' · ' + delta : ''}`, entity: bom.id, before: oldMpn, after: newMpn });
    actions._fyiEquivalentSwap(bom, oldMpn, newMpn, false);
    emit();
  },
  commitOverride(bomId, no, newMpn, newMfr, reason) {
    const bom = STATE.boms.find(b => b.id === bomId); if (!bom) return;
    let oldMpn = '';
    bom.items = bom.items.map(i => { if (i.no !== no) return i; oldMpn = i.mpn; const c = CATALOG[newMpn] || {}; return { ...i, mpn: newMpn, mfr: newMfr || c.mfr || i.mfr, desc: c.desc || i.desc, replacement: { from: i.mpn, by: actorName() } }; });
    bom.version = (bom.version || 1) + 1; bom.updated = 'just now'; bom.updatedBy = actorName();
    pushAudit({ action: `Characteristic-match OVERRIDE: ${oldMpn} → ${newMpn} — ${reason}`, entity: bom.id, before: oldMpn, after: newMpn });
    actions._fyiEquivalentSwap(bom, oldMpn, newMpn, true, reason);
    emit();
  },
  /* Send a mismatch to Designer as a structured Push-Back with the intended replacement as context. */
  pushbackFromEdit(bomId, no, newMpn, diffs) {
    const bom = STATE.boms.find(b => b.id === bomId); if (!bom) return;
    const item = bom.items.find(i => i.no === no) || {};
    actions.sendPushback(bomId, { lineNos: [no], reason: 'other', urgency: 'standard',
      note: `Production attempted an inline swap ${item.mpn} → ${newMpn}; characteristic-match failed on ${(diffs || []).join(', ')}. Please advise or recommend a replacement.`,
      perLineComments: { [no]: `Intended replacement: ${newMpn}` } });
  },
  _fyiEquivalentSwap(bom, oldMpn, newMpn, isOverride, reason) {
    const proj = STATE.projects[bom.project];
    const prog = proj && proj.program_id ? (STATE.programs || []).find(p => p.id === proj.program_id) : null;
    if (!prog) return;                                   // standalone Project → no Program owner Designer
    if (!isOverride && !prog.notifyOnEquivalentSwap) return; // Admin per-Program opt-out (equivalent swaps only)
    pushNotif({ forRoles: ['designer'], targetRole: 'designer', sourceRole: 'production', kind: 'fyi',
      type: isOverride ? 'CHARACTERISTIC OVERRIDE' : 'EQUIVALENT SWAP', actorRole: 'production',
      actionLabel: isOverride ? 'Override applied' : 'Equivalent swap', verb: 'View',
      body: isOverride
        ? `Production overrode characteristic-match on ${oldMpn} → ${newMpn} (${bom.name}), reason: ${reason}.`
        : `Production swapped ${oldMpn} → ${newMpn} on ${bom.name} — both spec-matched.`,
      who: actorName(), entity: bom.id,
      routes: { designer: { screen: 'p.bomOverview', id: bom.id }, production: { screen: 'p.bomOverview', id: bom.id } } });
  },

    pushAudit({ action: `Program FYI-on-equivalent-swap ${val ? 'enabled' : 'disabled'}`, entity: programId, before: String(before), after: String(!!val) });
    emit();

    bom.items = bom.items.map((i, k) => i.status === 'needs-review' ? i : { ...i, status: k % 2 ? 'sourced-digikey' : 'sourced-mouser', supplier: k % 2 ? 'digikey' : 'mouser' });
    const hasEx = bom.items.some(i => i.status === 'needs-review');

  sendPushback(bomId, opts) {
    const { lineNos = [], reason = 'other', urgency = 'standard', note = '', perLineComments = {}, addedComponentRequest = null } = opts || {};
    const bom = STATE.boms.find(b => b.id === bomId); if (!bom) return;
    bom.state = 'exceptions';
    const flaggedLines = lineNos.map(no => ({ lineNo: no, exReason: (bom.items.find(i => i.no === no) || {}).exReason || 'Needs engineering review', comments: perLineComments[no] ? [{ by: actorName(), when: 'just now', body: perLineComments[no] }] : [] }));
    bom.pushback = { by: actorName(), when: 'just now', to: bom.creator, reason, urgency, note, loop: (bom.pushback?.loop || 0) + 1, flaggedLines, addedComponentRequest, recommendation: null, comments: [] };
    if (flaggedLines.length) bom.items = bom.items.map(i => flaggedLines.find(f => f.lineNo === i.no) ? { ...i, status: 'needs-review' } : i);
    const count = flaggedLines.length + (addedComponentRequest ? 1 : 0);
    pushNotif({ forRoles: ['designer'], targetRole: 'designer', sourceRole: 'production', kind: 'action',

      body: `${bom.name} · ${reason === 'missing-component' ? 'missing component requested' : count + ' line' + (count > 1 ? 's' : '') + ' flagged'} for engineering review.`, who: actorName(), entity: bom.id,

  runBomSourcing(bomId) {

    const bom = STATE.boms.find(b => b.id === bomId); if (!bom) return;
    let n = 0;
    bom.items = bom.items.map((i, k) => {

  /* generateOutcome — pick an outcome type, create the linked Dev object, push handshake, record outcome on collection. */

      STATE.reworks = [{ id: linkedId, title: title || c.name, kind: 'rework', project: c.project,
        owner: actorName(), ownerId: (STATE.currentUserId || "u-aaron"), role: 'development', assignee: 'Maria Chen',

      pushNotif({ forRoles: ['production'], type: 'REWORK PACKAGE', actorRole: 'development', body: `${title || c.name} — ${boards || ''} units.`, who: actorName(), entity: linkedId, verb: 'Open', go: { screen: 'v.reworkDetail', id: linkedId } });
    } else if (kind === 'firmware') {
      linkedId = 'FW-' + (version || '1.x');
      targetRole = 'production'; label = 'Firmware Release';
      STATE.firmwares = [{ id: linkedId, title: title || c.name, kind: 'firmware', project: c.project,
        owner: actorName(), ownerId: (STATE.currentUserId || "u-aaron"), role: 'development', assignee: actorName(),
        state: 'validating', updated: 'just now', created: 'Today', version: version || '1.x', relatedBom: null, relatedDevCollection: c.id,
        desc: desc || c.desc, changelog: changelog || ['(see collection)'],
        pushedTo: { role: 'production', toUserId: 'u-maria', when: 'just now' }, results: null }, ...STATE.firmwares];
      pushNotif({ forRoles: ['production'], type: 'FIRMWARE FOR VALIDATION', actorRole: 'development', body: `${title || c.name} awaiting validation.`, who: actorName(), entity: linkedId, verb: 'Validate', go: { screen: 'v.firmwareDetail', id: linkedId } });
    } else if (kind === 'investigation-report') {
      linkedId = 'INV-0' + (STATE.seq.inv++);
      targetRole = 'designer'; label = 'Investigation Report';
      STATE.investigations = [{ id: linkedId, title: title || c.name, kind: 'investigation', project: c.project,
        owner: actorName(), ownerId: (STATE.currentUserId || "u-aaron"), role: 'development', assignee: actorName(),
        state: 'findings', updated: 'just now', created: 'Today', priority: 'medium',
        desc: desc || c.desc, relatedBom: null, relatedDevCollection: c.id,
        findings: (note || c.notes || '').split('\n').filter(Boolean), pushedFrom: null }, ...STATE.investigations];
      pushNotif({ forRoles: ['designer'], type: 'INVESTIGATION REPORT', actorRole: 'development', body: `${actorName()} posted findings: ${title || c.name}.`, who: actorName(), entity: linkedId, verb: 'View', go: { screen: 'v.investigationDetail', id: linkedId } });
    } else if (kind === 'eng-change') {
      // Engineering Change Recommendation — simplified as a recommendation flavor
      linkedId = 'REC-0' + (STATE.seq.rec++);
      targetRole = 'designer'; label = 'Engineering Change Recommendation';
      STATE.recommendations = [{ id: linkedId, title: title || c.name, kind: 'recommendation', project: c.project,
        owner: actorName(), ownerId: (STATE.currentUserId || "u-aaron"), role: 'development', assignee: actorName(),
        state: 'pushed', updated: 'just now', created: 'Today', desc: desc || c.desc,
        engineeringChange: true, relatedDevCollection: c.id,
        pushedTo: { role: 'designer', toUserId: 'u-aaron', when: 'just now' }, response: null }, ...STATE.recommendations];
      pushNotif({ forRoles: ['designer'], type: 'ENGINEERING CHANGE', actorRole: 'development', body: `${actorName()} requested engineering change: ${title || c.name}.`, who: actorName(), entity: linkedId, verb: 'Review', go: { screen: 'v.recommendationDetail', id: linkedId } });
    } else return null;

    c.outcomes = [{ id: 'OUT-0' + (Math.floor(Math.random() * 1000)), kind, label, targetRole, linkedId, when: 'just now', state: 'pushed' }, ...(c.outcomes || [])];
    c.state = 'recommendation-sent'; c.updated = 'just now'; c.updatedBy = actorName();
    pushAudit({ action: `Outcome generated: ${label} → ${targetRole}`, entity: c.id, before: 'READY', after: 'RECOMMENDATION SENT' });
    emit(); return linkedId;
  },

  markAllRead() { STATE.notifications = STATE.notifications.map(n => ({ ...n, unread: false })); emit(); },
  markRead(id) { const n = STATE.notifications.find(x => x.id === id); if (n) { n.unread = false; emit(); } },

  /* COMMENTS — every commentable object */
  addComment(entityId, body) {
    const text = (body || '').trim(); if (!text || !entityId) return null;
    const u = STATE.users.find(x => x.id === (STATE.currentUserId || "u-aaron"));
    const c = { id: uid('cmt'), userId: (STATE.currentUserId || "u-aaron"), name: u?.name || actorName(), role: STATE.activeRole, when: 'just now', body: text };
    STATE.comments = { ...STATE.comments, [entityId]: [...(STATE.comments[entityId] || []), c] };
    pushAudit({ action: 'Comment posted', entity: entityId, before: '—', after: text.length > 60 ? text.slice(0, 60) + '…' : text });
    emit(); return c.id;
  },

  /* PROGRAMS — Create (v4). Pure AutoBOM concept: no PartsBox side effect, no notifications. */
  createProgram({ identifier, name, owner, customer, description, tags }) {
    const id = 'prog-' + Math.random().toString(36).slice(2, 8);
    const idf = (identifier || '').trim();
    const prog = { id, identifier: idf, code: idf, name: (name || '').trim(), owner: owner || actorName(),
      customer: (customer || '').trim() || null, desc: (description || '').trim(), status: 'Active',
      started: 'Jul 2026', target: null, tags: tags || [], notifyOnEquivalentSwap: true, projects: [] };
    STATE.programs = [...(STATE.programs || []), prog];
    pushAudit({ action: 'Program created', entity: id, before: '—', after: `${idf} · ${prog.name}` });
    emit(); return id;
  },
  /* PROJECTS — Create (v4). program_id required (Standalone retired). Optional PartsBox create at save. */
  createProject({ identifier, name, lead, program_id, description, createPartsBoxNow }) {
    const id = 'proj-' + Math.random().toString(36).slice(2, 8);
    const proj = { id, identifier: (identifier || '').trim(), name: (name || '').trim(),
      lead: lead || actorName(), program_id, desc: (description || '').trim(), status: 'active', created: 'Today',
      partsbox: { created: false, pending: false, projectId: null, storageId: null } };
    if (createPartsBoxNow) actions._doPartsBoxSetup(proj);
    STATE.projects = { ...STATE.projects, [id]: proj };
    const prog = (STATE.programs || []).find(p => p.id === program_id);
    if (prog) prog.projects = [...(prog.projects || []), id];
    pushAudit({ action: 'Project created', entity: id, before: '—', after: `${proj.name} · PartsBox ${createPartsBoxNow ? 'requested' : 'deferred'}` });
    emit(); return id;
  },
  /* Idempotent PartsBox project + storage create (mirrors POC find-or-create). Used at save and via the detail affordance. */
  _doPartsBoxSetup(proj) {
    try {
      proj.partsbox = { created: true, pending: false, projectId: 'PB-' + proj.name.replace(/[^A-Za-z0-9]/g, '').slice(0, 8).toUpperCase(), storageId: 'PBS-' + proj.name.replace(/[^A-Za-z0-9]/g, '').slice(0, 8).toUpperCase() };
      pushAudit({ action: 'PartsBox project + storage location created', entity: proj.id, before: '—', after: proj.partsbox.projectId });
    } catch (e) {
      proj.partsbox = { created: false, pending: true, projectId: null, storageId: null };
      pushAudit({ action: 'PartsBox creation failed — pending retry', entity: proj.id, before: '—', after: 'PENDING' });
    }
  },
  createProjectPartsBox(projectId) {
    const proj = STATE.projects[projectId]; if (!proj || proj.partsbox?.created) return;
    actions._doPartsBoxSetup(proj); proj.updated = 'just now'; emit();
  },

  /* COLLECTIONS — live editing + creation (designer + development share the same shape) */
  createCollection({ kind, name, program_id, project, category, desc, notes, tags, priority, relatedBom, relatedDevTask }) {
    const isDev = kind === 'development';
    const id = (isDev ? 'DCOL-0' : 'COL-0') + String(STATE.seq.col++).padStart(2, '0');
    const c = { id, name: name.trim(), program_id: program_id || null, project: project || null, state: isDev ? 'draft' : 'active',
      role: isDev ? 'development' : 'designer', kind: isDev ? 'development' : 'designer',
      creator: actorName(), ownerId: (STATE.currentUserId || "u-aaron"),
      category: category || (isDev ? 'Investigation' : null),
      updated: 'just now', updatedBy: actorName(), created: 'Today',
      desc: desc || '', notes: notes || '',
      tags: tags || [], priority: priority || null, relatedBom: relatedBom || null, relatedDevTask: relatedDevTask || null,
      items: [], outcomes: isDev ? [] : undefined };
    STATE.collections = [c, ...STATE.collections];
    pushAudit({ action: `${isDev ? 'Development' : 'Designer'} Collection created`, entity: id, before: '—', after: 'DRAFT' });
    emit(); return id;
  },
  renameCollection(cid, name) {
    const c = STATE.collections.find(x => x.id === cid); if (!c) return;
    const before = c.name; const after = name.trim(); if (!after || after === before) return;
    c.name = after; c.updated = 'just now'; c.updatedBy = actorName();
    pushAudit({ action: 'Collection renamed', entity: cid, before, after });
    emit();
  },
  setCollectionDescription(cid, desc) {
    const c = STATE.collections.find(x => x.id === cid); if (!c) return;
    c.desc = desc; c.updated = 'just now'; c.updatedBy = actorName();
    pushAudit({ action: 'Collection description updated', entity: cid, before: '—', after: '—' });
    emit();
  },
  setCollectionProject(cid, project) {
    const c = STATE.collections.find(x => x.id === cid); if (!c) return;
    const before = c.project; c.project = project; c.updated = 'just now'; c.updatedBy = actorName();
    pushAudit({ action: 'Collection project changed', entity: cid, before, after: project });
    emit();
  },
  setCollectionProgram(cid, programId) {
    const c = STATE.collections.find(x => x.id === cid); if (!c) return;
    const before = c.program_id; c.program_id = programId; c.project = null; c.updated = 'just now'; c.updatedBy = actorName();
    pushAudit({ action: 'Collection program changed', entity: cid, before, after: programId });
    emit();
  },
  removeFromCollection(cid, no) {
    const c = STATE.collections.find(x => x.id === cid); if (!c) return;
    const gone = c.items.find(i => i.no === no);
    c.items = c.items.filter(i => i.no !== no).map((i, k) => ({ ...i, no: k + 1 }));
    c.updated = 'just now'; c.updatedBy = actorName();
    if (gone) pushAudit({ action: 'Part removed from collection', entity: cid, before: gone.mpn, after: '—' });
    emit();
  },
  setItemNote(cid, no, note) {
    const c = STATE.collections.find(x => x.id === cid); if (!c) return;
    c.items = c.items.map(i => i.no === no ? { ...i, note } : i);
    c.updated = 'just now'; c.updatedBy = actorName(); emit();
  },
  refreshSourcing(cid, no) {
    const c = STATE.collections.find(x => x.id === cid); if (!c) return;
    c.items = c.items.map(i => {
      if (no != null && i.no !== no) return i;
      const cat = CATALOG[i.mpn] || {};
      const sup = cat.recommend || (cat.mouser ? 'mouser' : 'digikey');
      const off = sup && cat[sup];
      const unit = off ? off.price : i.unit;
      return { ...i, status: sup ? 'sourced-' + sup : i.status, supplier: sup || i.supplier,
        supplierPn: off?.pn || i.supplierPn, unit, ext: unit != null ? +(unit * i.qty).toFixed(2) : null, stale: false, fresh: 'just now' };
    });
    c.updated = 'just now'; c.updatedBy = actorName();
    pushAudit({ action: no != null ? `Sourcing refreshed for line ${no}` : 'Sourcing refreshed for collection', entity: cid, before: '—', after: '—' });
    emit();
  },
};

function useStore(selector) {
  const state = useSyncExternalStore(subscribe, getState, getState);
  return selector ? selector(state) : state;
}

Object.assign(window, { useStore, storeActions: actions, getState, resolveNotificationRoute });

</script>
<script type="text/babel" data-source="nav.jsx">
/* global React, PROJECTS, ROLE_META */
/* AutoBOM — navigation: hash routing, breadcrumbs, and persistent list state.
   Internally a route is { screen, id?, tab? }. The URL is the source of truth so
   browser Back/Forward and deep links work everywhere. */
const { useState: useStateNav, useEffect: useEffNav, useRef: useRefNav } = React;

/* screen ↔ URL path. :id is the one path param; tab rides in ?tab=. */
const ROUTE_TABLE = [
  { screen: 'd.dashboard', path: 'designer' },
  { screen: 'd.collections', path: 'designer/collections' },
  { screen: 'd.collectionDetail', path: 'designer/collections/:id' },
  { screen: 'p.dashboard', path: 'production' },
  { screen: 'p.boms', path: 'production/boms' },
  { screen: 'p.upload', path: 'production/boms/upload' },
  { screen: 'p.validate', path: 'production/boms/:id/validate' },
  { screen: 'p.sourcing', path: 'production/boms/:id/sourcing' },
  { screen: 'p.results', path: 'production/boms/:id/results' },
  { screen: 'p.procurement', path: 'production/boms/:id/procurement' },
  { screen: 'p.bomOverview', path: 'production/boms/:id' },
  { screen: 'a.dashboard', path: 'admin' },
  { screen: 'a.users', path: 'admin/users' },
  { screen: 'a.configuration', path: 'admin/configuration' },
  { screen: 'a.forceWaivers', path: 'admin/force-waivers' },
  { screen: 'a.audit', path: 'admin/audit' },
  { screen: 'purchasingEmbed', path: 'purchasing-view' },
  { screen: 'inventoryEmbed', path: 'inventory' },
  { screen: 'receiving', path: 'inventory/receiving' },
  { screen: 'storageDetail', path: 'inventory/storage/:id' },
  { screen: 'programs', path: 'programs' },
  { screen: 'programDetail', path: 'programs/:id' },
  { screen: 'v.dashboard', path: 'development' },
  { screen: 'v.collections', path: 'development/collections' },
  { screen: 'v.collectionDetail', path: 'development/collections/:id' },
  { screen: 'v.investigations', path: 'development/investigations' },
  { screen: 'v.investigationDetail', path: 'development/investigations/:id' },
  { screen: 'v.recommendations', path: 'development/recommendations' },
  { screen: 'v.recommendationDetail', path: 'development/recommendations/:id' },
  { screen: 'v.rework', path: 'development/rework' },
  { screen: 'v.reworkDetail', path: 'development/rework/:id' },
  { screen: 'v.firmware', path: 'development/firmware' },
  { screen: 'v.firmwareDetail', path: 'development/firmware/:id' },
  { screen: 'projects', path: 'projects' },
  { screen: 'projectDetail', path: 'projects/:id' },
  { screen: 'notifications', path: 'notifications' },
  { screen: 'settings', path: 'settings' },
];
const BY_SCREEN = Object.fromEntries(ROUTE_TABLE.map(r => [r.screen, r]));

function encodeRoute(route) {
  const e = BY_SCREEN[route.screen] || BY_SCREEN['d.dashboard'];
  let path = e.path.replace(':id', route.id != null ? encodeURIComponent(route.id) : '');
  path = path.replace(/\/$/, '');
  const q = route.tab ? `?tab=${encodeURIComponent(route.tab)}` : '';
  return '#/' + path + q;
}

function decodeRoute(hash) {
  let h = (hash || '').replace(/^#\/?/, '');
  const [path, query] = h.split('?');
  const tab = query ? new URLSearchParams(query).get('tab') : null;
  const segs = path.split('/').filter(Boolean);
  if (segs.length === 0) return { screen: 'd.dashboard' };
  // candidates with matching segment count
  const cands = ROUTE_TABLE.map(r => ({ r, parts: r.path.split('/') })).filter(x => x.parts.length === segs.length);
  // prefer fewer params (more static) — static literal routes win over :id routes
  cands.sort((a, b) => a.parts.filter(p => p[0] === ':').length - b.parts.filter(p => p[0] === ':').length);
  for (const { r, parts } of cands) {
    let id = null, ok = true;
    for (let i = 0; i < parts.length; i++) {
      if (parts[i][0] === ':') id = decodeURIComponent(segs[i]);
      else if (parts[i] !== segs[i]) { ok = false; break; }
    }
    if (ok) return { screen: r.screen, id, tab };
  }
  return { screen: 'd.dashboard' };
}

function routeKey(route) { return encodeRoute(route).split('?')[0]; }

/* screen → sidebar nav-item key (for active-item highlighting). Detail/step screens
   fold up to their list item; everything else highlights itself. Replaces the old
   static NAV_OF map in app.jsx (derived here so there is one source of truth). */
const NAV_KEY_OVERRIDES = {
  'd.collectionDetail': 'd.collections', 'd.exception': 'd.dashboard',
  'p.upload': 'projects', 'p.validate': 'projects', 'p.sourcing': 'projects', 'p.results': 'projects',
  'p.procurement': 'projects', 'p.bomOverview': 'projects', 'p.boms': 'projects',
  'programDetail': 'programs', 'projectDetail': 'projects', 'receiving': 'inventoryEmbed',
  'storageDetail': 'inventoryEmbed',
};
function navKeyForScreen(screen) { return NAV_KEY_OVERRIDES[screen] || screen; }

/* ---- Breadcrumbs: hierarchical, every crumb a link ---- */
function buildCrumbs(route, state) {
  const C = (label, screen, id, tab) => ({ label, route: screen ? { screen, id, tab } : null });
  const proj = (pid) => (state.projects[pid] || { name: pid });
  const s = route.screen || 'd.dashboard';
  const find = (coll, id) => state[coll].find(x => x.id === id);

  // workspace roots
  if (s === 'd.dashboard') return [C('Designer', 'd.dashboard')];
  if (s === 'd.collections') return [C('Designer', 'd.dashboard'), C('Collections')];
  if (s === 'd.collectionDetail') { const c = find('collections', route.id); const p = proj(c ? c.project : ''); return [C('PCB Projects', 'projects'), C(p.name, 'projectDetail', c && c.project, 'collections'), C('Collections', 'd.collections'), C(c ? c.name : route.id)]; }

  if (s === 'p.dashboard') return [C('Production', 'p.dashboard')];
  if (s === 'p.boms') return [C('PCB Projects', 'projects'), C('BOMs')];
  if (s === 'p.upload') return [C('PCB Projects', 'projects'), C('Upload BOM')];
  if (['p.bomOverview', 'p.validate', 'p.sourcing', 'p.results', 'p.procurement'].includes(s)) {
    const b = find('boms', route.id); const p = proj(b ? b.project : '');
    const base = [C('PCB Projects', 'projects'), C(p.name, 'projectDetail', b && b.project, 'boms'), C(b ? b.name : route.id, s === 'p.bomOverview' ? null : 'p.bomOverview', route.id)];
    const step = { 'p.validate': 'Validation', 'p.sourcing': 'Sourcing', 'p.results': 'Sourcing Results', 'p.procurement': 'Procurement Package' }[s];
    return step ? [...base, C(step)] : base;
  }

  if (s === 'a.dashboard') return [C('Admin', 'a.dashboard')];
  if (s.startsWith('a.')) { const lbl = { 'a.users': 'Users', 'a.configuration': 'Configuration', 'a.forceWaivers': 'Force-Waivers Log', 'a.audit': 'Audit Log' }[s]; return [C('Admin', 'a.dashboard'), C(lbl)]; }

  if (s === 'v.dashboard') return [C('Development', 'v.dashboard')];
  if (s === 'v.collections') return [C('Development', 'v.dashboard'), C('Collections')];
  if (s === 'v.collectionDetail') { const x = find('collections', route.id); const p = proj(x ? x.project : ''); return [C('PCB Projects', 'projects'), C(p.name, 'projectDetail', x && x.project, 'collections'), C('Collections', 'v.collections'), C(x ? x.name : route.id)]; }
  if (s === 'v.investigations') return [C('Development', 'v.dashboard'), C('Investigations')];
  if (s === 'v.investigationDetail') { const x = find('investigations', route.id); const p = proj(x ? x.project : ''); return [C('PCB Projects', 'projects'), C(p.name, 'projectDetail', x && x.project), C('Investigations', 'v.investigations'), C(x ? x.title : route.id)]; }
  if (s === 'v.recommendations') return [C('Development', 'v.dashboard'), C('Improvements')];
  if (s === 'v.recommendationDetail') { const x = find('recommendations', route.id); const p = proj(x ? x.project : ''); return [C('PCB Projects', 'projects'), C(p.name, 'projectDetail', x && x.project), C('Improvements', 'v.recommendations'), C(x ? x.title : route.id)]; }
  if (s === 'v.rework') return [C('Development', 'v.dashboard'), C('Rework Packages')];
  if (s === 'v.reworkDetail') { const x = find('reworks', route.id); const p = proj(x ? x.project : ''); return [C('PCB Projects', 'projects'), C(p.name, 'projectDetail', x && x.project), C('Rework Packages', 'v.rework'), C(x ? x.title : route.id)]; }
  if (s === 'v.firmware') return [C('Development', 'v.dashboard'), C('Firmware Releases')];
  if (s === 'v.firmwareDetail') { const x = find('firmwares', route.id); const p = proj(x ? x.project : ''); return [C('PCB Projects', 'projects'), C(p.name, 'projectDetail', x && x.project), C('Firmware Releases', 'v.firmware'), C(x ? x.title : route.id)]; }

  if (s === 'storageDetail') return [C('Inventory', 'inventoryEmbed'), C('Storage locations', 'inventoryEmbed'), C(route.id || 'Location')];
  if (s === 'projects') return [C('PCB Projects')];
  if (s === 'projectDetail') { const p = proj(route.id); return [C('PCB Projects', 'projects'), C(p.name)]; }
  if (s === 'notifications') return [C('Notifications')];
  if (s === 'settings') return [C('Account Settings')];
  return [C('AutoBOM', 'd.dashboard')];
}

/* ---- useHashRoute: drive route from the URL hash (Back/Forward + deep links) ---- */
function useHashRoute() {
  const [route, setRoute] = useStateNav(() => decodeRoute(location.hash));
  useEffNav(() => {
    const onHash = () => setRoute(decodeRoute(location.hash));
    window.addEventListener('hashchange', onHash);
    if (!location.hash) location.replace(encodeRoute({ screen: 'd.dashboard' }));
    return () => window.removeEventListener('hashchange', onHash);
  }, []);
  // navigate: push a new history entry (unless replacing)
  const navigate = (r, replace) => {
    if (typeof r === 'string') r = { screen: r };
    const h = encodeRoute(r);
    if (h === location.hash) { setRoute(decodeRoute(h)); return; }
    if (replace) location.replace(h); else location.hash = h;
  };
  return [route, navigate];
}

/* ---- Persistent list/queue UI state (filters, search, sort) ---- */
const LS_KEY = 'autobom.liststate.v1';
function loadLS() { try { return JSON.parse(sessionStorage.getItem(LS_KEY) || '{}'); } catch (e) { return {}; } }
function saveLS(all) { try { sessionStorage.setItem(LS_KEY, JSON.stringify(all)); } catch (e) {} }
function useListState(key, defaults) {
  const [val, setVal] = useStateNav(() => { const all = loadLS(); return { ...defaults, ...(all[key] || {}) }; });
  const set = (patch) => setVal(v => { const nv = { ...v, ...patch }; const all = loadLS(); all[key] = nv; saveLS(all); return nv; });
  return [val, set];
}

/* ---- Scroll position memory, keyed by route ---- */
const SCROLL = {};
function rememberScroll(route) { SCROLL[routeKey(route)] = window.scrollY; }
function restoreScroll(route) { const y = SCROLL[routeKey(route)] || 0; requestAnimationFrame(() => window.scrollTo(0, y)); }

Object.assign(window, { ROUTE_TABLE, encodeRoute, decodeRoute, routeKey, navKeyForScreen, buildCrumbs, useHashRoute, useListState, rememberScroll, restoreScroll });

</script>
<script type="text/babel" data-source="shell.jsx">
/* global React, Icon, RoleDot, RoleTag, Avatar, StatusBadge, Popover, EmptyState,
   useStore, storeActions, ROLE_META, NAV_BY_ROLE, NAV_SHARED, NAV_SOON */
const { useState: useStateShell, useRef: useRefShell } = React;

/* v4 + Session 4: the role switcher is scoped to the LOGGED-IN USER's own roles — no
   more god-mode "view as any role". Purchasing/Inventory are embedded surfaces, never
   login roles, so they never appear. A single-role user sees a static label, not a menu. */
function RoleSwitcher({ activeRole }) {
  const ref = useRefShell(null);
  const [open, setOpen] = useStateShell(false);
  const user = useStore(s => s.users.find(u => u.id === s.currentUserId));
  const m = ROLE_META[activeRole];
  const myRoles = ((user && user.roles) || []).filter(r => ROLE_META[r] && (r !== 'development' || window.DEV_ROLE_ENABLED));
  const multi = myRoles.length > 1;

  if (!multi) {
    return (
      <div className="role-switcher">
        <div className="role-chip role-chip-static">
          <RoleDot role={activeRole} size={9} />
          <div style={{ flex: 1 }}>
            <div className="rc-label">Your workspace</div>
            <div className="rc-role">{m.label}</div>
          </div>
        </div>
      </div>
    );
  }
  return (
    <div className="role-switcher">
      <button ref={ref} className="role-chip" onClick={() => setOpen(o => !o)}>
        <RoleDot role={activeRole} size={9} />
        <div style={{ flex: 1 }}>
          <div className="rc-label">Your workspace</div>
          <div className="rc-role">{m.label}</div>
        </div>
        <Icon name="chevdown" size={15} />
      </button>
      <Popover anchorRef={ref} open={open} onClose={() => setOpen(false)} width={216}>
        <div className="menu-label">Switch workspace</div>
        {myRoles.map(r => (
          <div key={r} className="mi" onClick={() => { storeActions.setRole(r); setOpen(false); }}>
            <RoleDot role={r} size={8} /><span>{ROLE_META[r].label}</span>

          </div>

        <div className="mi" style={{ borderTop: '1px solid var(--border-soft)', marginTop: 4, paddingTop: 9, color: 'var(--text-muted)', fontSize: 11.5, cursor: 'default' }}>
          You hold {myRoles.length} roles. Switching changes your active workspace.
        </div>
      </Popover>
    </div>
  );
}

function Sidebar({ active, go }) {
  const activeRole = useStore(s => s.activeRole);
  const user = useStore(s => s.users.find(u => u.id === s.currentUserId));
  const roleNav = NAV_BY_ROLE[activeRole] || { section: '', items: [] };
  const roleColor = ROLE_META[activeRole].color;

  const bomCount = useStore(s => s.boms.filter(b => b.state !== 'draft').length);
  // v1.3-rev: Dashboard nav item is badged with the Needs Attention count for this role.
  const attentionCount = useStore(s => window.attCountForRole ? window.attCountForRole(s, activeRole) : 0);
  const counts = { 'd.collections': collCount, 'p.boms': bomCount };
  const dashKey = `${activeRole === 'admin' ? 'a' : activeRole === 'development' ? 'v' : activeRole === 'production' ? 'p' : 'd'}.dashboard`;
  counts[dashKey] = attentionCount;

  const NavItem = (n) => {
    if (n.soon) return (
      <div key={n.key} className="nav-item disabled" title="Coming soon">
        <Icon name={n.icon} size={17} className="ni-icon" /><span>{n.label}</span><span className="ni-soon">Soon</span>
      </div>
    );
    const c = counts[n.key];
    // Dashboard 'Needs Attention' badge uses the role's danger color to pull the eye.
    const badgeBg = n.attention && c ? 'var(--danger)' : roleColor;
    return (
      <div key={n.key} className={`nav-item${active === n.key ? ' active' : ''}${n.attention ? ' nav-attention' : ''}`} onClick={() => go({ screen: n.key })}

        <Icon name={n.icon} size={17} className="ni-icon" /><span>{n.label}</span>

  return (

      <div className="sb-brand">
        <div className="sb-logo">A</div>
        <div><div className="sb-brandname">AutoBOM</div><div className="sb-brandsub">Engineering Operations</div></div>
      </div>
      <RoleSwitcher activeRole={activeRole} />
      <nav className="sb-nav">
        {roleNav.items.length > 0 && <>
          <div className="sb-section-label">{roleNav.section}</div>
          {roleNav.items.map(NavItem)}
        </>}
        {roleNav.items.length === 0 && (
          <div style={{ padding: '10px 12px', margin: '4px 0', fontSize: 12, color: 'var(--text-on-dark-dim)', lineHeight: 1.5 }}>
            This role is visibility-only. Use Projects and Reports to review work across departments.
          </div>
        )}
        <div className="sb-section-label">General</div>
        {NAV_SHARED.map(NavItem)}
        <div className="sb-section-label">Coming Soon</div>
        {NAV_SOON.map(NavItem)}
      </nav>
      <div className="sb-user" onClick={() => go({ screen: 'settings' })}>
        <Avatar name={user.name} role={activeRole} />
        <div style={{ flex: 1, minWidth: 0 }}>
          <div className="su-name">{user.name}</div>
          <div className="su-role" style={{ display: 'flex', alignItems: 'center', gap: 5 }}>
            <span className="dot" style={{ background: roleColor, width: 7, height: 7 }} />{ROLE_META[activeRole].label}
          </div>
        </div>
        <Icon name="settings" size={16} style={{ color: 'var(--text-on-dark-dim)' }} />
      </div>
    </aside>
  );
}

function TopRail({ onSearch, onPalette, onBell, unread, searchAnchorRef, go }) {
  return (
    <div className="toprail">
      <button className="icon-btn" title="Back" onClick={() => window.history.back()}><Icon name="chevright" size={18} style={{ transform: 'rotate(180deg)' }} /></button>
      <button className="icon-btn" title="Forward" onClick={() => window.history.forward()}><Icon name="chevright" size={18} /></button>
      <div className="rail-search" ref={searchAnchorRef} onClick={onSearch}>

/* Top-right user menu (Session 4): identity, active role, account settings, log out. */
function UserMenu({ go }) {
  const ref = useRefShell(null);
  const [open, setOpen] = useStateShell(false);
  const user = useStore(s => s.users.find(u => u.id === s.currentUserId));

          </div>
        </div>

        </div>
        {roles.length > 1 && <div className="um-role"><span className="caption">Also holds</span><span className="caption">{roles.filter(r => r !== activeRole).map(r => ROLE_META[r].label).join(', ')}</span></div>}
        <div className="mi" style={{ borderTop: '1px solid var(--border-soft)', marginTop: 4, paddingTop: 8 }} onClick={() => { setOpen(false); go({ screen: 'settings' }); }}>
          <Icon name="settings" size={15} /><span>Account settings</span>

        <div className="mi" onClick={() => { setOpen(false); m.toast && m.toast('Log out — real SSO ships in Phase 2', 'info'); }} style={{ color: 'var(--danger)' }}>
          <Icon name="arrow" size={15} style={{ transform: 'rotate(180deg)' }} /><span>Log out</span>
        </div>
      </Popover>

}

function Breadcrumbs({ crumbs }) {
  return (
    <nav className="breadcrumbs" aria-label="Breadcrumb">
      {crumbs.map((c, i) => (
        <React.Fragment key={i}>
          {i > 0 && <Icon name="chevright" size={13} className="bc-sep" />}
          {c.go ? <button className="bc-link" onClick={c.go}>{c.label}</button>
                : <span className="bc-current">{c.label}</span>}
        </React.Fragment>
      ))}
    </nav>
  );
}

function NotificationPanel({ open, onClose, onNavigate }) {
  const activeRole = useStore(s => s.activeRole);
  const all = useStore(s => s.notifications);
  if (!open) return null;
  const notes = all.filter(n => n.forRoles.includes(activeRole));
  const groups = {}; notes.forEach(n => { (groups[n.group] = groups[n.group] || []).push(n); });
  return (
    <>
      <div className="scrim" onClick={onClose} />
      <div className="notif-panel" role="dialog" aria-label="Notifications">
        <div className="notif-head">
          <Icon name="bell" size={17} /><span style={{ fontWeight: 700, fontSize: 15 }}>Notifications</span>
          <button className="btn-link" style={{ marginLeft: 'auto' }} onClick={() => storeActions.markAllRead()}>Mark all read</button>
          <button className="icon-btn" onClick={onClose}><Icon name="x" size={17} /></button>
        </div>
        <div className="notif-list">
          {notes.length === 0 ? <EmptyState icon="check" title="You're all caught up." sub="New activity that needs your attention will appear here." />
          : Object.keys(groups).map(g => (
            <div key={g}>
              <div className="notif-group-label">{g}</div>
              {groups[g].map(n => {
                const isAction = n.kind !== 'fyi';
                const accent = isAction ? (n.actorRole || n.sourceRole || 'designer') : (n.sourceRole || n.actorRole || 'production');
                const accentColor = window.ROLE_META?.[accent]?.color || 'var(--text-secondary)';
                return (
                  <div key={n.id} className={`notif${n.unread ? ' unread' : ''}`} onClick={() => { storeActions.markRead(n.id); onClose(); onNavigate(n); }} style={{ cursor: 'pointer' }}>
                    <span className={`nf-dot${n.unread ? '' : ' read'}`} />
                    <div style={{ flex: 1, minWidth: 0 }}>
                      <div className="nf-type" style={{ color: isAction ? 'var(--danger)' : 'var(--text-muted)' }}>
                        {isAction ? 'ACTION REQUIRED' : 'UPDATE'}{n.actionLabel ? ' — ' + n.actionLabel : ''}
                      </div>
                      <div className="nf-body">{n.body}</div>
                      <div className="nf-meta">
                        <span className="mono">{n.entity}</span> · Sent by <span style={{ color: accentColor, fontWeight: 600 }}>{(window.ROLE_META?.[n.sourceRole || n.actorRole]?.label || '—')}</span> · {n.who} · {n.when}
                      </div>
                      {n.reject && <div className="nf-reject"><strong>Reason:</strong> {n.reject}</div>}
                      <div className="nf-action">
                        <button className={`btn sm ${isAction ? 'primary' : ''}`} onClick={(e) => { e.stopPropagation(); storeActions.markRead(n.id); onClose(); onNavigate(n); }}>
                          {n.verb || 'View'}<Icon name="arrow" size={13} />
                        </button>
                      </div>
                    </div>
                  </div>
                );
              })}
            </div>
          ))}
        </div>
      </div>
    </>
  );
}

Object.assign(window, { Sidebar, TopRail, Breadcrumbs, NotificationPanel });

</script>
<script type="text/babel" data-source="screen_dashboard.jsx">
/* global React, Icon, StatusBadge, RoleTag, RoleDot, SupplierTag, Banner, EmptyState, Avatar, NeedsAttention,

const { useState: useStateDash } = React;

function StatePeek({ value, onChange, options }) {
  return (
    <div style={{ display: 'flex', alignItems: 'center', gap: 8 }}>
      <span className="caption" style={{ display: 'flex', alignItems: 'center', gap: 5 }}><Icon name="sparkle" size={13} /> Preview state</span>

function DashboardScreen({ go, flashId }) {
  const [state, setState] = useStateDash('default');
  const collections = useStore(s => s.collections.filter(c => c.role === 'designer'));
  const programs = useStore(s => s.programs || []);
  const me = useStore(s => s.users.find(u => u.id === s.currentUserId));
  const isNew = state === 'new';

  const myCollections = isNew ? [] : collections;
  const myPrograms = programs.filter(p => !me || p.owner === me.name);
  const recentPrograms = isNew ? [] : (myPrograms.length ? myPrograms : programs);
  const activeCount = collections.filter(c => c.state === 'active').length;
  const openReq = collections.filter(c => ['order-requested', 'rejected'].includes(c.state)).length;

  return (

          <StatePeek value={state} onChange={setState} options={[{ v: 'default', label: 'Default' }, { v: 'new', label: 'New user', last: true }]} />

      {/* v1.3-rev: Dashboard IS the operational inbox. Every card acts inline. */}

      <div className="stat-row" style={{ marginBottom: 18 }}>
        <div className="stat"><div className="st-label"><Icon name="layers" size={13} /> Active collections</div><div className="st-num">{isNew ? 0 : activeCount}</div><div className="st-sub">in research</div></div>
        <div className="stat"><div className="st-label"><Icon name="arrow" size={13} /> Open requests</div><div className="st-num">{isNew ? 0 : openReq}</div><div className="st-sub">{isNew ? '—' : 'awaiting + rejected'}</div></div>
        <div className="stat"><div className="st-label"><Icon name="alert" size={13} style={{ color: 'var(--warning)' }} /> Items needing review</div><div className="st-num" style={{ color: isNew ? undefined : 'var(--warning)' }}>{isNew ? 0 : reviewItems}</div><div className="st-sub">across collections</div></div>
        <div className="stat"><div className="st-label"><Icon name="folder" size={13} /> Programs</div><div className="st-num">{isNew ? 0 : myPrograms.length}</div><div className="st-sub">{isNew ? '—' : 'you own'}</div></div>

          ) : myCollections.slice(0, 5).map(c => (
            <div key={c.id} className="attn-item" style={{ cursor: 'pointer' }} onClick={() => go({ screen: 'd.collectionDetail', id: c.id })}>
              <div className="attn-main"><div style={{ display: 'flex', alignItems: 'center', gap: 9 }}><span style={{ fontWeight: 600, fontSize: 14 }}>{c.name}</span><StatusBadge status={c.state} /></div>
                <div className="am-meta">{(c.project && PROJECTS[c.project]) ? PROJECTS[c.project].name : ((programs.find(p => p.id === c.program_id) || {}).name || '—')} · {c.items.length} part{c.items.length !== 1 ? 's' : ''} · updated {c.updated}</div></div>
              <Icon name="chevright" size={16} style={{ color: 'var(--text-muted)' }} />
            </div>
          ))}
        </div>
        <div className="panel">
          <div className="panel-head"><Icon name="folder" size={16} /><span className="ph-title">Recent Programs</span>

          {recentPrograms.length === 0 ? (

          ) : recentPrograms.slice(0, 5).map(p => (
            <div key={p.id} className="attn-item" style={{ cursor: 'pointer' }} onClick={() => go({ screen: 'programDetail', id: p.id })}>
              <div className="attn-main"><div style={{ display: 'flex', alignItems: 'center', gap: 9 }}><span className="mono caption" style={{ fontWeight: 700 }}>{p.code}</span><span style={{ fontWeight: 600, fontSize: 14 }}>{p.name}</span></div>
                <div className="am-meta">{p.projects.length} project{p.projects.length !== 1 ? 's' : ''}{p.customer ? ` · ${p.customer}` : ''} · owner {p.owner}</div></div>
              <Icon name="chevright" size={16} style={{ color: 'var(--text-muted)' }} />
            </div>
          ))}
        </div>
      </div>
    </div>
  );
}

Object.assign(window, { DashboardScreen, StatePeek });

</script>
<script type="text/babel" data-source="needs_attention.jsx">
/* global React, Icon, StatusBadge, RoleTag, SupplierTag, Banner, EmptyState, InlinePartVerify,
   useStore, storeActions, getState, PROJECTS, fmtUSD, CATALOG */
/* AutoBOM — Needs Attention (v1.3-rev).
   The Task Center is removed. The Dashboard IS the operational inbox.
   This module derives every role's actionable items and renders interactive
   cards: the common action completes inline (expansion grows WITHIN page flow —
   never a modal/overlay), uncommon ones navigate. Clicking the title navigates
   to full detail. Notification clicks scroll the matching card into view + flash. */
const { useState: useStateNA, useRef: useRefNA, useEffect: useEffNA } = React;

/* ---- derive Needs Attention items for a role ---- */
function deriveAttention(state, role) {
  const items = [];
  const proj = (id) => state.projects[id]?.name || id;

  if (role === 'designer') {
    for (const b of state.boms) {
      if (b.state === 'exceptions' && b.pushback && !b.pushback.recommendation) {
        const pb = b.pushback;
        const count = (pb.flaggedLines ? pb.flaggedLines.length : 0) + (pb.addedComponentRequest ? 1 : 0);
        items.push({
          id: `att-ex-${b.id}`, kind: 'bom-exception', tone: 'danger',
          type: 'BOM EXCEPTION', icon: 'alert',
          title: b.name, badge: `${b.id}${b.version ? ' · v' + b.version : ''}`, project: proj(b.project),
          meta: `${count} item${count > 1 ? 's' : ''} need engineering review · from Production${pb.note ? ' · "' + pb.note + '"' : ''}`,
          reason: pb.reason, urgency: pb.urgency,
          verb: 'Resolve', tag: pb.reason === 'missing-component' ? 'Recommend component' : 'Recommend replacements',
          relatedId: b.id, bom: b,
          titleRoute: { screen: 'p.bomOverview', id: b.id },
        });
      }
    }
    // (No "collection rejected" card — Purchasing has no reject action, so this event
    //  cannot exist. Upstream checks block a bad request before it ever enters the bucket.)
    for (const c of state.collections) {
      if (c.role === 'designer' && c.state === 'active' && c.items.some(i => i.stale)) {
        const n = c.items.filter(i => i.stale).length;
        items.push({
          id: `att-stale-${c.id}`, kind: 'stale-sourcing', tone: 'warning',
          type: 'STALE SOURCING DATA', icon: 'clock',
          title: c.name, badge: c.id, project: proj(c.project),
          meta: `${n} item${n > 1 ? 's' : ''} with supplier data older than 24h`,
          verb: 'Resolve', tag: 'Re-check sourcing', relatedId: c.id, collection: c,
          titleRoute: { screen: 'd.collectionDetail', id: c.id },
        });
      }
    }
  }

  if (role === 'production') {
    for (const b of state.boms) {
      if (b.state === 'validated' || b.state === 'sourcing') {
        items.push({
          id: `att-src-${b.id}`, kind: 'awaiting-sourcing', tone: 'info',
          type: 'BOM AWAITING SOURCING', icon: 'search',
          title: b.name, badge: b.id, project: proj(b.project),
          meta: `${b.items.length} lines · in queue ${b.updated}`,
          verb: 'Resolve', tag: 'Run sourcing', relatedId: b.id, bom: b,
          titleRoute: { screen: 'p.bomOverview', id: b.id },
        });
      } else if (b.state === 'normalised') {
        const n = b.items.filter(i => i.status === 'needs-review' || i.status === 'exception').length;
        items.push({
          id: `att-resrc-${b.id}`, kind: 'replacements-received', tone: 'info',
          type: 'REPLACEMENTS RECEIVED', icon: 'refresh',
          title: b.name, badge: b.id, project: proj(b.project),
          meta: `${n} replaced line${n > 1 ? 's' : ''} from Designer ready to re-source`,
          verb: 'Resolve', tag: 'Re-source replaced lines', relatedId: b.id, bom: b,
          titleRoute: { screen: 'p.bomOverview', id: b.id },
        });
      } else if (b.state === 'draft') {
        const warn = b.items.filter(i => i.status === 'needs-review').length;
        items.push({
          id: `att-val-${b.id}`, kind: 'awaiting-validation', tone: 'warning',
          type: 'BOM AWAITING VALIDATION', icon: 'check',
          title: b.name, badge: b.id, project: proj(b.project),
          meta: `${warn} warning${warn === 1 ? '' : 's'} · uploaded ${b.updated}`,
          verb: 'Resolve', tag: 'Review', relatedId: b.id, bom: b, navigateOnly: true,
          titleRoute: { screen: 'p.validate', id: b.id },
        });
      } else if (b.state === 'exceptions' && b.pushback && b.pushback.recommendation && !b.pushback.appliedWhen) {
        const rec = b.pushback.recommendation;
        items.push({
          id: `att-rec-${b.id}`, kind: 'recommendations-recommended', tone: 'info',
          type: 'REPLACEMENTS RECOMMENDED', icon: 'sparkle',
          title: b.name, badge: b.id, project: proj(b.project),
          meta: `${rec.picks.length} replacement${rec.picks.length > 1 ? 's' : ''} recommended by ${rec.by} · review and apply to the master BOM`,
          reason: b.pushback.reason, urgency: b.pushback.urgency,
          verb: 'Resolve', tag: 'Apply replacements', relatedId: b.id, bom: b,
          titleRoute: { screen: 'p.bomOverview', id: b.id },
        });
      }
    }
    // (No "purchasing rejection" card — Purchasing cannot reject or return a request.
    //  Any problem is caught by an upstream check before submission, on Production's side.)
  }

  if (role === 'purchasing') {
  }

  if (role === 'purchasing') {
    // Purchasing is an embedded observation surface (v4), never a login role — deriveAttention
    // is never called with this role. No cards. (Order/shipment lifecycle retired in Session 1.)
  }

  if (role === 'admin') {
    for (const j of (state.system?.jobs || [])) {
      items.push({
        id: `att-job-${j.id}`, kind: 'failed-job', tone: 'danger',
        type: 'FAILED BACKGROUND JOB', icon: 'alert',
        title: j.label, badge: j.id, project: j.object || '—',
        meta: `${j.error} · failed ${j.when}`,
        verb: 'Resolve', tag: 'Retry', relatedId: j.id, job: j,
        titleRoute: { screen: 'a.configuration', tab: 'system' },
      });
    }
    for (const s of (state.system?.stuck || [])) {
      items.push({
        id: `att-stuck-${s.id}`, kind: 'stuck-workflow', tone: 'warning',
        type: 'STUCK WORKFLOW', icon: 'clock',
        title: s.name, badge: s.id, project: s.objType || '—',
        meta: `${s.status} · no activity for ${s.idle}`,
        verb: 'Resolve', tag: 'Reassign', relatedId: s.id, stuck: s,
        titleRoute: { screen: 'a.audit' },
      });
    }
    const dk = (state.system?.status || []).find(s => s.id === 'digikey' && s.tokenExpiry);
    if (dk) {
      items.push({
        id: 'att-token-digikey', kind: 'token-expiring', tone: 'warning',
        type: 'DIGIKEY TOKEN EXPIRING', icon: 'lock',
        title: 'DigiKey API token', badge: 'OAuth', project: 'Suppliers',
        meta: `Expires ${dk.tokenExpiry} · sourcing on DigiKey will fail when it lapses`,
        verb: 'Resolve', tag: 'Refresh token', relatedId: 'digikey-api',
        titleRoute: { screen: 'a.configuration', tab: 'suppliers' },
      });
    }
  }

  return items;
}

function grandOf(items) { return items.reduce((a, i) => a + (i.ext || 0), 0); }

function attCountForRole(state, role) { return deriveAttention(state, role).length; }

/* ---- tone → colors ---- */
const TONE = {
  danger:  { color: 'var(--danger)',  soft: 'var(--danger-soft)' },
  warning: { color: 'var(--warning)', soft: 'var(--warning-soft)' },
  info:    { color: 'var(--action)',  soft: 'var(--action-soft)' },
};

/* ============================================================
   <NeedsAttention role go flashId />
   Renders the interactive Needs Attention panel for a role.
   ============================================================ */
function NeedsAttention({ role, go, flashId }) {
  const items = useStore(s => deriveAttention(s, role));

  return (
    <div className="panel na-panel" style={{ marginBottom: 18 }}>
      <div className="panel-head">
        <Icon name="flag" size={16} style={{ color: 'var(--danger)' }} />
        <span className="ph-title">Needs Attention</span>
        {items.length > 0 && <span className="ph-meta">{items.length} item{items.length > 1 ? 's' : ''} require your action</span>}
      </div>
      {items.length === 0 ? (
        <div className="na-clear">
          <div className="na-clear-badge"><Icon name="check" size={26} /></div>
          <div className="h2" style={{ margin: '12px 0 2px' }}>All caught up</div>
          <div className="secondary">Nothing needs your attention right now.</div>
        </div>
      ) : (
        <div className="na-list">
          {items.map(it => <AttentionCard key={it.id} item={it} role={role} go={go} flash={flashId === it.relatedId || flashId === it.id} />)}
        </div>
      )}
    </div>
  );
}

function AttentionCard({ item, role, go, flash }) {
  const [open, setOpen] = useStateNA(false);
  const [busy, setBusy] = useStateNA(null); // null | 'running' | 'done'
  const ref = useRefNA(null);
  const t = TONE[item.tone] || TONE.info;

  // Notification deep-link: scroll into view + amber flash.
  useEffNA(() => {
    if (flash && ref.current) {
      ref.current.scrollIntoView({ block: 'center', behavior: 'smooth' });
      ref.current.classList.remove('na-flash'); void ref.current.offsetWidth;
      ref.current.classList.add('na-flash');
    }
  }, [flash]);

  const primary = () => {
    if (item.navigateOnly) { go(item.titleRoute); return; }
    setOpen(o => !o);
  };

  return (
    <div ref={ref} className={`na-card${item.overdue ? ' overdue' : ''}${open ? ' open' : ''}`}>
      <div className="na-row">
        <div className="na-icon" style={{ background: t.soft, color: t.color }}><Icon name={item.icon} size={18} /></div>
        <div className="na-main">
          <div className="na-type" style={{ color: t.color }}>{item.type}</div>
          <div className="na-title">
            <button className="na-titlelink" onClick={() => go(item.titleRoute)} title="Open full detail">{item.title}</button>
            <span className="mono caption na-badge">{item.badge}</span>
          </div>
          {item.reason && <div style={{ marginTop: 4 }}><PushbackBadges reason={item.reason} urgency={item.urgency} /></div>}
          <div className="na-meta">{item.project} · {item.meta}</div>
        </div>
        <div className="na-actions">
          <AttentionAction item={item} open={open} busy={busy} onPrimary={primary} />
        </div>
      </div>
      {open && !item.navigateOnly && (
        <div className="na-expand">
          <AttentionExpansion item={item} role={role} go={go} busy={busy} setBusy={setBusy} close={() => setOpen(false)} />
        </div>
      )}
    </div>
  );
}

/* The primary button rendered on the card row. For inline-immediate kinds it
   shows a progress/working state; for expand kinds it toggles the panel. */
function AttentionAction({ item, open, busy, onPrimary }) {
  const t = TONE[item.tone] || TONE.info;
  if (busy === 'running') return <span className="na-working"><span className="spinner" style={{ width: 14, height: 14 }} /> Working…</span>;
  if (busy === 'done') return <span className="na-done" style={{ color: 'var(--success)' }}><Icon name="check" size={14} /> Done</span>;
  return (
    <div style={{ display: 'flex', alignItems: 'center', gap: 8 }}>
      {item.tag && <span className="na-actiontag">{item.tag}</span>}
      <button className={`btn sm ${item.tone === 'danger' ? 'danger' : 'primary'}`} onClick={onPrimary}>
        Resolve<Icon name={open ? 'chevdown' : 'arrow'} size={13} style={open ? { transform: 'rotate(180deg)' } : undefined} />
      </button>
    </div>
  );
}

/* ---- the inline expansion bodies, per kind ---- */
function AttentionExpansion({ item, role, go, busy, setBusy, close }) {
  switch (item.kind) {
    case 'bom-exception': return <PushbackResolvePanel bom={item.bom} go={go} close={close} />;
    case 'recommendations-recommended': return <ExpApplyRecommendation item={item} go={go} close={close} />;
    case 'stale-sourcing': return <ExpImmediate label="Re-checking sourcing on stale items…" run={() => storeActions.recheckCollectionSourcing(item.collection.id)} setBusy={setBusy} close={close} doneMsg="Sourcing refreshed — timestamps updated." />;
    case 'awaiting-sourcing': return <ExpSourcing item={item} setBusy={setBusy} close={close} />;
    case 'replacements-received': return <ExpImmediate label="Re-sourcing replaced lines…" run={() => storeActions.resourceReplacedLines(item.bom.id)} setBusy={setBusy} close={close} doneMsg="Replaced lines re-sourced." />;
    case 'failed-job': return <ExpImmediate label="Retrying job…" run={() => storeActions.retryJob(item.job.id)} setBusy={setBusy} close={close} doneMsg="Job re-queued." />;
    case 'stuck-workflow': return <ExpReassign item={item} close={close} />;
    case 'token-expiring': return <ExpImmediate label="Refreshing DigiKey token…" run={() => storeActions.refreshDigiKeyToken()} setBusy={setBusy} close={close} doneMsg="Token refreshed." />;
    default: return null;
  }
}

/* Generic immediate action with an inline progress→done flow. */
function ExpImmediate({ label, run, setBusy, close, doneMsg }) {
  const [phase, setPhase] = useStateNA('idle');
  const start = () => {
    setPhase('running'); setBusy('running');
    setTimeout(() => { run(); setPhase('done'); setBusy('done'); }, 1100);
  };
  return (
    <div className="na-exp-body">
      {phase === 'idle' && (
        <div className="na-confirm">
          <span className="secondary">{label.replace(/…$/, '')} — run now?</span>
          <div style={{ display: 'flex', gap: 8 }}>
            <button className="btn sm ghost" onClick={close}>Cancel</button>
            <button className="btn sm primary" onClick={start}><Icon name="refresh" size={13} />Run now</button>
          </div>
        </div>
      )}
      {phase === 'running' && <div className="na-phase"><span className="spinner" style={{ width: 15, height: 15 }} />{label}</div>}
      {phase === 'done' && <div className="na-phase" style={{ color: 'var(--success)' }}><Icon name="check" size={15} />{doneMsg}</div>}
    </div>
  );
}

/* Production: review Designer's recommendations, then Apply to the master BOM. */
function ExpApplyRecommendation({ item, go, close }) {
  const bom = item.bom; const rec = bom.pushback && bom.pushback.recommendation;
  const [applied, setApplied] = useStateNA(false);
  if (!rec) return null;
  if (applied) return <div className="na-phase" style={{ color: 'var(--success)' }}><Icon name="check" size={15} />Applied to the master BOM. Re-run sourcing on the updated lines.</div>;
  return (
    <div className="na-exp-body">
      <div className="caption" style={{ marginBottom: 8 }}>Designer <strong>{rec.by}</strong> recommended {rec.picks.length} replacement{rec.picks.length > 1 ? 's' : ''}. Review, then Apply to commit them to the master BOM — the version increments on Apply.</div>
      <div className="tbl-wrap flow" style={{ marginBottom: 10 }}><table className="bom">
        <thead><tr><th>Line</th><th>Recommended</th><th>Source</th></tr></thead>
        <tbody>{rec.picks.map((p, idx) => (
          <tr key={idx}><td className="mono">{p.added ? 'NEW' : 'Line ' + p.lineNo}</td>
            <td><span className="mono" style={{ fontWeight: 600 }}>{p.mpn}</span> <span className="caption">{p.mfr}</span></td>
            <td className="caption">{p.section === 'wall' ? 'Wall · ' + p.location : 'Supplier'}{p.datasheet ? ' · datasheet' : ''}</td></tr>
        ))}</tbody></table></div>
      {rec.note && <div className="caption" style={{ marginBottom: 8 }}><em>Note from {rec.by}:</em> {rec.note}</div>}
      <div className="na-confirm">
        <button className="btn sm ghost" onClick={() => go({ screen: 'p.bomOverview', id: bom.id })}>Open BOM</button>
        <div style={{ display: 'flex', gap: 8 }}>
          <button className="btn sm ghost" onClick={close}>Later</button>
          <button className="btn sm primary" onClick={() => { storeActions.applyPushbackRecommendation(bom.id); setApplied(true); }}><Icon name="check" size={13} />Apply to master BOM</button>
        </div>
      </div>
    </div>
  );
}

/* (ExpResubmit removed — no rejection card exists to respond to; Purchasing never returns a request.) */

/* Production: run sourcing inline with a live progress bar. */
function ExpSourcing({ item, setBusy, close }) {
  const [phase, setPhase] = useStateNA('idle');
  const [pct, setPct] = useStateNA(0);
  const total = item.bom.items.length;
  const start = () => {
    setPhase('running'); setBusy('running'); setPct(0);
    let p = 0;
    const iv = setInterval(() => {
      p += Math.random() * 16 + 8; if (p >= 100) { p = 100; clearInterval(iv); setTimeout(() => { storeActions.runBomSourcing(item.bom.id); setPhase('done'); setBusy('done'); }, 350); }
      setPct(Math.round(p));
    }, 260);
  };
  if (phase === 'done') return <div className="na-phase" style={{ color: 'var(--success)' }}><Icon name="check" size={15} />Sourcing complete — results ready on the BOM.</div>;
  if (phase === 'running') return (
    <div className="na-exp-body">
      <div className="na-phase"><span className="spinner" style={{ width: 15, height: 15 }} />Sourcing Mouser → DigiKey…</div>
      <div className="progress" style={{ marginTop: 8 }}><i style={{ width: pct + '%' }} /></div>
      <div className="caption" style={{ marginTop: 6, display: 'flex', gap: 16 }}><span>{Math.round(total * pct / 100)} of {total} lines</span><span>{pct}%</span><span>~{Math.max(1, Math.round((100 - pct) / 12))}s remaining</span></div>
    </div>
  );
  return (
    <div className="na-exp-body">
      <div className="na-confirm">
        <span className="secondary">Run Mouser + DigiKey sourcing on all {total} lines?</span>
        <div style={{ display: 'flex', gap: 8 }}>
          <button className="btn sm ghost" onClick={close}>Cancel</button>
          <button className="btn sm primary" onClick={start}><Icon name="search" size={13} />Run sourcing</button>
        </div>
      </div>
    </div>
  );
}

/* Admin: reassign a stuck workflow inline. */
function ExpReassign({ item, close }) {
  const users = useStore(s => s.users.filter(u => u.active));
  const [to, setTo] = useStateNA('');
  const [done, setDone] = useStateNA(false);
  if (done) return <div className="na-phase" style={{ color: 'var(--success)' }}><Icon name="check" size={15} />Reassigned to {to}. They've been notified.</div>;
  return (
    <div className="na-exp-body">
      <label className="fl" style={{ display: 'block', marginBottom: 4 }}>Reassign to</label>
      <select className="select" value={to} onChange={e => setTo(e.target.value)} style={{ width: '100%' }}>
        <option value="">Select a user…</option>
        {users.map(u => <option key={u.id} value={u.name}>{u.name} — {(u.roles || []).join(', ')}</option>)}
      </select>
      <div className="na-confirm" style={{ marginTop: 8 }}>
        <button className="btn sm ghost" onClick={close}>Cancel</button>
        <button className="btn sm primary" disabled={!to} onClick={() => { storeActions.reassignWorkflow(item.stuck.id, to); setDone(true); }}><Icon name="arrow" size={13} />Confirm reassignment</button>
      </div>
    </div>
  );
}

Object.assign(window, { NeedsAttention, deriveAttention, attCountForRole });

</script>
<script type="text/babel" data-source="screen_search.jsx">
/* global React, Icon, StatusBadge, SupplierTag, Banner, EmptyState, Freshness, Popover,
   CATALOG, useStore, PROJECTS, RECENT_SEARCHES, fmtUSD, fmtInt */
const { useState: useStateSearch, useRef: useRefSearch, useEffect: useEffSearch } = React;

function findMatches(q) {
  const s = q.trim().toUpperCase();
  if (!s) return [];
  return Object.values(CATALOG).filter(c =>
    c.mpn.toUpperCase().includes(s) || c.mfr.toUpperCase().includes(s) || c.desc.toUpperCase().includes(s)
  );
}

function SupplierResultCard({ name, supplier, off, recommended }) {
  const zero = off.stock === 0;
  return (
    <div className={`supcard${recommended ? ' recommended' : ''}`}>
      <div className="supcard-head">
        <SupplierTag supplier={supplier} />
        {recommended && <span className="rec-flag">Recommended</span>}
        {zero && !recommended && <span className="rec-flag" style={{ color: 'var(--danger)', background: 'var(--danger-soft)' }}>Zero stock</span>}
      </div>
      <div className="supcard-body">
        <div className="sup-line"><span className="sl-k">Stock</span>
          <span style={{ fontWeight: 600, color: zero ? 'var(--danger)' : 'var(--success)' }}>{zero ? '0 — no stock' : fmtInt(off.stock)}</span></div>
        <div className="sup-line"><span className="sl-k">Unit price</span><span className="mono" style={{ fontWeight: 600 }}>{off.price ? fmtUSD(off.price) : '—'}</span></div>
        <div className="sup-line"><span className="sl-k">Supplier PN</span><span className="mono">{off.pn}</span></div>
        <a className="sup-line" href={off.url} style={{ marginTop: 2 }} onClick={e => e.preventDefault()}>
          <span style={{ color: 'var(--action)', fontWeight: 600, display: 'flex', alignItems: 'center', gap: 5 }}>
            View on {supplier === 'mouser' ? 'Mouser' : 'DigiKey'} <Icon name="external" size={13} /></span>
        </a>
      </div>
    </div>
  );
}

function ResultCard({ c, onAdd }) {
  const addRef = useRefSearch(null);
  const [menu, setMenu] = useStateSearch(false);
  const eol = c.lifecycle === 'obsolete';
  const addable = useStore(s => s.collections.filter(x => x.role === 'designer' && ['active', 'rejected'].includes(x.state)));

  return (
    <div className="card" style={{ overflow: 'visible' }}>
      <div style={{ padding: '15px 18px', borderBottom: '1px solid var(--border-soft)', display: 'flex', alignItems: 'flex-start', gap: 14 }}>
        <div style={{ flex: 1, minWidth: 0 }}>
          <div style={{ display: 'flex', alignItems: 'center', gap: 10, flexWrap: 'wrap' }}>
            <span className="mono" style={{ fontSize: 17, fontWeight: 600 }}>{c.mpn}</span>
            <StatusBadge status={eol ? 'obsolete' : 'active'} />
          </div>
          <div className="secondary" style={{ marginTop: 4 }}>{c.mfr} · {c.desc}</div>
        </div>
        <div style={{ position: 'relative', flex: 'none' }}>
          <button ref={addRef} className="btn primary" onClick={() => setMenu(m => !m)}>
            <Icon name="plus" size={15} />Add to Collection<Icon name="chevdown" size={14} />
          </button>
          <Popover anchorRef={addRef} open={menu} onClose={() => setMenu(false)} align="right" width={260}>
            <div className="menu-label">Add to collection</div>
            {addable.map(x => (
              <div key={x.id} className="mi" onClick={() => { setMenu(false); onAdd(c.mpn, { id: x.id, name: x.name }); }}>
                <Icon name="layers" size={15} style={{ color: 'var(--role-designer)' }} />
                <span>{x.name}</span><span className="mi-sub">{PROJECTS[x.project].name}</span>
              </div>
            ))}
            <div className="mi new" onClick={() => { setMenu(false); onAdd(c.mpn, { id: null, name: c.mpn + ' research' }); }}>
              <Icon name="plus" size={15} />Create new collection…
            </div>
          </Popover>
        </div>
      </div>

      {eol && (
        <div style={{ padding: '0 18px' }}>
          <Banner kind="danger" icon="ban" title="Obsolete / End-of-Life">
            {c.note || 'This part is not recommended for new designs.'} Consider a replacement before adding it to a production BOM.
          </Banner>
        </div>
      )}

      <div style={{ padding: '16px 18px' }}>
        <div style={{ display: 'flex', alignItems: 'center', gap: 10, marginBottom: 11 }}>
          <span className="label" style={{ fontWeight: 700 }}>Supplier sourcing</span>
          <Freshness ts={c.fresh} stale={c.stale} />
          {c.recommend && <span style={{ marginLeft: 'auto', fontSize: 12.5, color: 'var(--text-secondary)' }}>
            Decision engine recommends <strong style={{ color: c.recommend === 'mouser' ? 'var(--supplier-mouser)' : 'var(--supplier-digikey)' }}>{c.recommend === 'mouser' ? 'Mouser' : 'DigiKey'}</strong></span>}
        </div>
        <div className="supplier-grid">
          <SupplierResultCard name={c.mpn} supplier="mouser" off={c.mouser} recommended={c.recommend === 'mouser'} />
          <SupplierResultCard name={c.mpn} supplier="digikey" off={c.digikey} recommended={c.recommend === 'digikey'} />
        </div>
        {c.stale && <div style={{ marginTop: 12 }}>
          <Banner kind="warn" title="Sourcing data is stale">Pricing and stock for this part are older than 24 hours. Re-check before requesting an order.</Banner>
        </div>}
      </div>
    </div>
  );
}

function SearchScreen({ onAdd }) {
  const [query, setQuery] = useStateSearch('');
  const [submitted, setSubmitted] = useStateSearch('');
  const [phase, setPhase] = useStateSearch('idle'); // idle | cache | live | done
  const inputRef = useRefSearch(null);
  const timers = useRefSearch([]);

  useEffSearch(() => () => timers.current.forEach(clearTimeout), []);

  const run = (q) => {
