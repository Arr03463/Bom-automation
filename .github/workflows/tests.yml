name: AutoBOM tests

# Runs the full test suite and compile checks on every push/PR. Does NOT
# deploy anything -- production deployment remains a manual, approved
# on-site procedure (see Documentation/AutoBOM_Onsite_Deployment_Checklist.md).
on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install locked dependencies
        run: python -m pip install -r requirements-lock.txt

      - name: Compile check
        run: python -m py_compile app.py src/*.py tests/*.py

      - name: Run full test suite
        env:
          # Every test in this suite mocks/dry-runs vendor calls; no real
          # credentials are needed or used in CI.
          SUPPLIER_DRY_RUN: "true"
          PARTSBOX_DRY_RUN: "true"
          MOUSER_CART_ENABLED: "false"
          DIGIKEY_MYLISTS_ENABLED: "false"
          SUPPLIER_LOOKUP_CACHE_ENABLED: "false"
        run: python -m unittest discover -s tests -v
