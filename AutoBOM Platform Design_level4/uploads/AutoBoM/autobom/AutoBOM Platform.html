<div id="root"></div>
<script>
/* Diagnostic error overlay — surfaces any load/transform/runtime error on-page
   so a blank render is never silent. Remove once stable. */
(function () {
  function show(title, detail) {
    var r = document.getElementById('root');
    if (!r) return;
    if (!r.querySelector('[data-err-overlay]')) {
      r.innerHTML = '<div data-err-overlay style="font:13px/1.5 ui-monospace,Menlo,monospace;padding:24px;color:#b91c1c;background:#fff;white-space:pre-wrap;max-width:900px;margin:0 auto"></div>';
    }
    var box = r.querySelector('[data-err-overlay]');
    box.textContent += '⚠ ' + title + '\n' + (detail || '') + '\n\n';
  }
  window.addEventListener('error', function (e) {
    show(e.message || 'Script error', (e.filename || '') + ':' + (e.lineno || '') + (e.error && e.error.stack ? '\n' + e.error.stack : ''));
  });
  window.addEventListener('unhandledrejection', function (e) {
    show('Unhandled promise rejection', (e.reason && (e.reason.stack || e.reason.message)) || String(e.reason));
  });
  /* After load, verify the CDN libraries and app actually arrived. */
  window.addEventListener('load', function () {
    setTimeout(function () {
      var miss = [];
      if (typeof React === 'undefined') miss.push('React (CDN)');
      if (typeof ReactDOM === 'undefined') miss.push('ReactDOM (CDN)');
      if (typeof Babel === 'undefined') miss.push('Babel (CDN)');
      if (typeof window.seedState === 'undefined') miss.push('data.jsx');
      if (typeof window.App === 'undefined') miss.push('app.jsx (App)');
      var r = document.getElementById('root');
      var empty = r && r.childElementCount === 0;
      if (miss.length) show('Failed to load: ' + miss.join(', '), 'Likely a blocked CDN fetch or an SRI integrity mismatch. The app cannot start without these.');
      else if (empty) show('Libraries loaded but nothing rendered', 'React/Babel are present and the app compiled, but <div id="root"> is empty — a runtime error in App render.');
    }, 4000);
  });
})();
</script>
