<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Source+Sans+3:wght@400;500;600&display=swap" rel="stylesheet">
</helmet>
<sc-if value="{{ hasAny }}" hint-placeholder-val="{{ false }}">
<section style="font-family:'Source Sans 3',system-ui,sans-serif;font-size:13px;color:#1E2B45;background:#FFFFFF;border:1px solid #E2E8F0;border-radius:10px;box-shadow:0 1px 2px rgba(15,31,68,0.04);padding:10px 16px">
  <div style="display:flex;align-items:center;gap:8px;cursor:pointer" onClick="{{ onToggleCollapse }}">
    <span style="font-size:11px;color:#8A97AD">{{ chevron }}</span>
    <div style="font-size:14px;font-weight:600;color:#0B1F44;white-space:nowrap">Component Characteristics</div>
    <sc-if value="{{ hasActive }}" hint-placeholder-val="{{ false }}"><span style="font-size:12px;color:#5A6A85">{{ activeCount }} active</span></sc-if>
    <span style="margin-left:auto;font-size:11.5px;color:#8A97AD">Only characteristics present in current results</span>
  </div>

  <sc-if value="{{ collapsedChipsShown }}" hint-placeholder-val="{{ false }}">
    <div style="display:flex;gap:6px;flex-wrap:wrap;margin-top:8px">
      <sc-for list="{{ activeChips }}" as="c" hint-placeholder-count="0">
        <span style="display:inline-flex;align-items:center;gap:6px;height:22px;padding:0 8px;border-radius:11px;background:#EAF1FE;color:#1D4FC4;font-size:12px;font-weight:600">{{ c.label }}<button onClick="{{ c.onRemove }}" style="background:none;border:none;color:inherit;opacity:0.7;cursor:pointer;padding:0;font-size:11px">✕</button></span>
      </sc-for>
    </div>
  </sc-if>

  <sc-if value="{{ expanded }}" hint-placeholder-val="{{ false }}">
    <div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:10px;margin-top:10px">
      <sc-for list="{{ activeControls }}" as="a" hint-placeholder-count="0">
        <div style="border:1px solid #E2E8F0;border-radius:8px;padding:8px 10px">
          <div style="display:flex;align-items:center;gap:6px;margin-bottom:6px">
            <span style="font-size:12px;font-weight:600;color:#5A6A85">{{ a.label }}</span>
            <button onClick="{{ a.onRemove }}" style="margin-left:auto;background:none;border:none;color:#8A97AD;cursor:pointer;padding:0;font-size:12px">✕</button>
          </div>
          <sc-if value="{{ a.isChoice }}" hint-placeholder-val="{{ true }}">
            <select value="{{ a.value }}" onChange="{{ a.onChange }}" style="width:100%;box-sizing:border-box;height:28px;border:1px solid #D5DDE8;border-radius:6px;padding:0 6px;font-size:12.5px;font-family:inherit">
              <option value="">Any</option>
              <sc-for list="{{ a.options }}" as="o" hint-placeholder-count="0"><option value="{{ o.value }}">{{ o.value }} ({{ o.count }})</option></sc-for>
            </select>
          </sc-if>
        </div>
      </sc-for>

      <div style="border:1px dashed #D5DDE8;border-radius:8px;padding:8px 10px;position:relative">
        <button onClick="{{ onTogglePicker }}" style="width:100%;height:28px;border:none;background:none;color:#1D5FE0;font-family:inherit;font-size:12.5px;font-weight:600;cursor:pointer">+ Add characteristic</button>
        <sc-if value="{{ pickerOpen }}" hint-placeholder-val="{{ false }}">
          <div style="position:absolute;top:34px;left:0;right:0;z-index:30;background:#FFFFFF;border:1px solid #D5DDE8;border-radius:8px;box-shadow:0 8px 20px rgba(11,31,68,0.15);padding:6px;max-height:180px;overflow-y:auto">
            <sc-for list="{{ pickerOptions }}" as="o" hint-placeholder-count="0">
              <button onClick="{{ o.onClick }}" style="display:block;width:100%;text-align:left;background:none;border:none;padding:6px 8px;font-size:12.5px;font-family:inherit;color:#1E2B45;cursor:pointer;border-radius:5px" style-hover="background:#F8FAFC">{{ o.label }}<span style="color:#8A97AD;margin-left:6px">{{ o.count }}</span></button>
            </sc-for>
            <sc-if value="{{ noPickerOptions }}" hint-placeholder-val="{{ false }}"><div style="padding:6px 8px;font-size:12px;color:#8A97AD">No more characteristics available in the current results.</div></sc-if>
          </div>
        </sc-if>
      </div>
    </div>
  </sc-if>
</section>
</sc-if>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:900,&quot;height&quot;:80},&quot;available&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;Array&lt;{field:string,label:string,values:Array&lt;{value:string,count:number}&gt;}&gt;&quot;},&quot;active&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;string[]&quot;},&quot;values&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;Record&lt;string,string&gt;&quot;},&quot;onAddCharacteristic&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;(field:string)=&gt;void&quot;},&quot;onRemoveCharacteristic&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;(field:string)=&gt;void&quot;},&quot;onValueChange&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;(field:string,value:string)=&gt;void&quot;}}">
class Component extends DCLogic {
  state = { collapsed: false, pickerOpen: false };
  renderVals() {
    const p = this.props;
    const available = p.available ?? [];
    const active = p.active ?? [];
    const values = p.values ?? {};
    const onAdd = p.onAddCharacteristic ?? (() => {});
    const onRemove = p.onRemoveCharacteristic ?? (() => {});
    const onChange = p.onValueChange ?? (() => {});

    const byField = {};
    available.forEach((a) => { byField[a.field] = a; });

    const activeControls = active.map((field) => {
      const a = byField[field] || { field, label: field, values: [] };
      return {
        label: a.label, isChoice: true,
        value: values[field] || '',
        options: a.values || [],
        onChange: (e) => onChange(field, e.target.value),
        onRemove: () => onRemove(field)
      };
    });

    const pickerOptions = available.filter((a) => !active.includes(a.field)).map((a) => ({
      label: a.label, count: a.values ? a.values.length : 0,
      onClick: () => { onAdd(a.field); this.setState({ pickerOpen: false }); }
    }));

    const activeChips = active.filter((f) => values[f]).map((f) => ({
      label: (byField[f]?.label || f) + ': ' + values[f],
      onRemove: () => onRemove(f)
    }));

    const expanded = !this.state.collapsed;
    return {
      hasAny: available.length > 0,
      chevron: expanded ? '▾' : '▸',
      onToggleCollapse: () => this.setState((s) => ({ collapsed: !s.collapsed })),
      expanded, collapsedChipsShown: !expanded && activeChips.length > 0,
      hasActive: active.length > 0, activeCount: active.length,
      activeChips, activeControls,
      pickerOpen: this.state.pickerOpen, onTogglePicker: () => this.setState((s) => ({ pickerOpen: !s.pickerOpen })),
      pickerOptions, noPickerOptions: pickerOptions.length === 0
    };
  }
}
</script>
</body>
</html>
